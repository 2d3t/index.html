<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Моё офлайн-приложение</title>
    
    <!-- Манифест (путь без /) -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Для iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- Стили (если файл есть) -->
    <link rel="stylesheet" href="style.css">
    
    <style>
        /* Можно оставить стили здесь, если нет отдельного CSS-файла */
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:sans-serif;background:#f5f5f5;padding:15px;min-height:100vh;display:flex;justify-content:center;align-items:flex-start}
        .container{max-width:600px;width:100%;background:white;border-radius:20px;padding:25px;box-shadow:0 10px 40px rgba(0,0,0,0.1)}
        h1{font-size:24px;color:#333;margin-bottom:5px}
        .subtitle{color:#888;font-size:13px;margin-bottom:15px}
        .input-group{display:flex;gap:8px;margin-bottom:15px;flex-wrap:wrap}
        #noteInput{flex:1;padding:10px 14px;border:2px solid #e0e0e0;border-radius:12px;font-size:16px;outline:none;min-width:150px}
        #noteInput:focus{border-color:#4CAF50}
        #addBtn{padding:10px 20px;background:#4CAF50;color:white;border:none;border-radius:12px;font-size:16px;cursor:pointer}
        #addBtn:active{transform:scale(0.95)}
        #notesList{min-height:80px;margin-bottom:15px}
        .note-item{background:#f8f9fa;padding:12px 16px;border-radius:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;animation:slideIn 0.3s ease}
        @keyframes slideIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
        .note-text{flex:1;color:#333;font-size:15px;word-wrap:break-word}
        .delete-btn{background:#ff4757;color:white;border:none;border-radius:8px;padding:4px 12px;cursor:pointer;font-size:14px;margin-left:10px}
        .status{display:flex;justify-content:space-between;align-items:center;padding-top:12px;border-top:2px solid #f0f0f0;flex-wrap:wrap;gap:8px}
        #onlineStatus{font-size:14px;color:#4CAF50;font-weight:500}
        #onlineStatus.offline{color:#ff4757}
        .danger{background:#ff4757;color:white;border:none;border-radius:12px;padding:8px 16px;cursor:pointer;font-size:14px}
        .empty{text-align:center;color:#aaa;padding:20px 0}
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 Заметки</h1>
        <p class="subtitle">Работает без интернета</p>
        
        <div class="input-group">
            <input type="text" id="noteInput" placeholder="Введите заметку...">
            <button id="addBtn">➕ Добавить</button>
        </div>
        
        <div id="notesList"></div>
        
        <div class="status">
            <span id="onlineStatus">🟢 Онлайн</span>
            <button id="clearBtn" class="danger">🗑️ Очистить</button>
        </div>
    </div>

    <!-- Основной скрипт (путь без /) -->
    <script src="app.js"></script>
    
    <!-- ИЛИ если весь JS встроен сюда, то закомментируйте строку выше и раскомментируйте этот блок -->
    <!--
    <script>
        // Весь JS код можно поместить прямо сюда
        let notes = [];
        function load() { ... }
        // ...
    </script>
    -->
</body>
</html>
