<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MP3 <-> QR Кодировщик на А4</title>
    
    <!-- Надежные и стабильные версии внешних библиотек -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f9fafb;
            --card-bg: #ffffff;
            --text: #111827;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .grid { grid-template-columns: 1fr; }
        }

        .card {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }

        h2 { margin-top: 0; border-bottom: 2px solid #e5e7eb; padding-bottom: 10px; }

        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; }
        input[type="file"], select {
            width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; box-sizing: border-box;
        }

        button {
            background-color: var(--primary); color: white; border: none; padding: 12px 20px;
            border-radius: 6px; font-weight: 600; cursor: pointer; width: 100%; transition: background 0.2s;
            margin-top: 10px;
        }
        button:hover { background-color: var(--primary-hover); }
        button:disabled { background-color: #9ca3af; cursor: not-allowed; }

        .progress-container {
            background: #e5e7eb; border-radius: 9999px; height: 12px; margin-top: 15px; display: none; overflow: hidden;
        }
        .progress-bar { background: var(--primary); height: 100%; width: 0%; transition: width 0.1s ease; }
        .status-text { font-size: 14px; color: #4b5563; margin-top: 5px; text-align: center; }

        #video-container {
            display: none; position: relative; width: 100%; max-width: 400px; margin: 15px auto; border-radius: 8px; overflow: hidden;
        }
        video { width: 100%; height: auto; display: block; background: #000; }

        #print-area { display: none; }

        /* НАСТРОЙКИ СТИЛЕЙ ДЛЯ ПЕЧАТИ В PDF */
        @media print {
            body * { display: none !important; }
            #print-area { display: block !important; }
            #print-area * { display: block !important; }

            @page {
                size: A4 portrait;
                margin: 0;
            }

            .page-a4 {
                width: 210mm;
                height: 296mm;
                page-break-after: always;
                box-sizing: border-box;
                padding: 20mm;
                display: grid !important;
                align-content: space-around;
                justify-content: space-around;
            }

            .grid-1 { grid-template-columns: 1fr !important; }
            .grid-4 { grid-template-columns: 1fr 1fr !important; gap: 15mm; }
            .grid-6 { grid-template-columns: 1fr 1fr !important; grid-template-rows: 1fr 1fr 1fr !important; gap: 10mm; }

            .qr-item {
                text-align: center;
                display: flex !important;
                flex-direction: column !important;
                align-items: center !important;
                justify-content: center !important;
            }

            .qr-item img {
                display: inline-block !important;
                max-width: 100% !important;
                height: auto !important;
            }

            .qr-label {
                font-family: sans-serif;
                font-size: 12px;
                font-weight: bold;
                margin-top: 8px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Преобразователь MP3 в QR-коды (А4)</h1>
        <p>Разбивайте аудио в коды для печати и собирайте обратно через PDF или веб-камеру.</p>
    </header>

    <div class="grid">
        <!-- БЛОК КОДИРОВАНИЯ -->
        <div class="card">
            <h2>1. Кодирование в QR</h2>
            <div class="form-group">
                <label for="mp3-file">Выберите MP3 файл:</label>
                <input type="file" id="mp3-file" accept="audio/mp3, audio/*">
            </div>
            <div class="form-group">
                <label for="density">Плотность кодов на лист А4:</label>
                <select id="density">
                    <option value="1">1 код на страницу (Максимальный размер)</option>
                    <option value="4" selected>4 кода на страницу (Сетка 2х2)</option>
                    <option value="6">6 кодов на страницу (Сетка 2х3)</option>
                </select>
            </div>
            <button id="btn-generate">Сгенерировать QR-коды</button>
            <button id="btn-print" style="display:none; background-color: #10b981;">Распечатать / Сохранить в PDF</button>

            <div class="progress-container" id="encode-progress-box">
                <div class="progress-bar" id="encode-progress"></div>
            </div>
            <div class="status-text" id="encode-status"></div>
        </div>

        <!-- БЛОК СБОРКИ -->
        <div class="card">
            <h2>2. Восстановление звука</h2>
            <div class="form-group">
                <label for="pdf-file">Загрузить сохраненный PDF:</label>
                <input type="file" id="pdf-file" accept="application/pdf">
            </div>
            <button id="btn-scan-pdf">Распознать из PDF</button>
            
            <div style="text-align: center; margin: 15px 0; font-weight: bold; color: #6b7280;">ИЛИ</div>

            <button id="btn-toggle-camera">Включить сканирование камерой</button>
            <div id="video-container">
                <video id="webcam-video" playsinline></video>
            </div>

            <div class="progress-container" id="decode-progress-box">
                <div class="progress-bar" id="decode-progress"></div>
            </div>
            <div class="status-text" id="decode-status"></div>

            <div id="audio-output" style="margin-top:20px; display:none; text-align:center;">
                <h3>Аудио успешно восстановлено!</h3>
                <audio id="player" controls style="width:100%; margin-bottom:10px;"></audio>
                <a id="download-link" download="restored.mp3" style="color:var(--primary); font-weight:bold; text-decoration:none;">💾 Скачать готовый MP3</a>
            </div>
        </div>
    </div>
</div>

<div id="print-area"></div>

<script>
    // 900 символов гарантирует стабильное чтение
    const CHUNK_SIZE = 900; 
    let gatheredChunks = {}; 
    let totalExpectedChunks = null;
    let cameraStream = null;
    let cameraInterval = null;

    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

    const sleep = ms => new Promise(res => setTimeout(res, ms));

    // КОРРЕКТНЫЙ ПЕРЕВОД ИЗ ARRAYBUFFER В BASE64 Без ограничений стека памяти
    function bufferToBase64(buffer) {
        let binary = '';
        const bytes = new Uint8Array(buffer);
        const len = bytes.byteLength;
        for (let i = 0; i < len; i++) {
            binary += String.fromCharCode(bytes[i]);
        }
        return btoa(binary);
    }

    // ==========================================
    // ГЕНЕРАЦИЯ QR
    // ==========================================
    document.getElementById('btn-generate').addEventListener('click', async () => {
        const fileInput = document.getElementById('mp3-file');
        if (!fileInput.files || fileInput.files.length === 0) {
            return alert('Пожалуйста, выберите файл MP3.');
        }

        const file = fileInput.files[0];
        const density = parseInt(document.getElementById('density').value);
        
        const progressBox = document.getElementById('encode-progress-box');
        const progressBar = document.getElementById('encode-progress');
        const statusText = document.getElementById('encode-status');
        const printBtn = document.getElementById('btn-print');
        const printArea = document.getElementById('print-area');

        progressBox.style.display = 'block';
        printBtn.style.display = 'none';
        printArea.innerHTML = '';

        statusText.innerText = "Чтение бинарных данных аудиофайла...";
        
        try {
            const arrayBuffer = await file.arrayBuffer();
            const encodedData = bufferToBase64(arrayBuffer);

            const chunks = [];
            for (let i = 0; i < encodedData.length; i += CHUNK_SIZE) {
                chunks.push(encodedData.substring(i, i + CHUNK_SIZE));
            }

            const totalChunks = chunks.length;
            statusText.innerText = `Генерация графических изображений. Всего частей: ${totalChunks}`;

            let currentGrid = null;
            let codesOnCurrentPage = 0;

            for (let i = 0; i < totalChunks; i++) {
                if (codesOnCurrentPage === 0 || codesOnCurrentPage === density) {
                    currentGrid = document.createElement('div');
                    currentGrid.className = `page-a4 grid-${density}`;
                    printArea.appendChild(currentGrid);
                    codesOnCurrentPage = 0;
                }

                const qrItem = document.createElement('div');
                qrItem.className = 'qr-item';
                
                // Строгий формат метаданных
                const payload = `${i}|${totalChunks}|${chunks[i]}`;
                const tempQrDiv = document.createElement('div');
                
                const qrSize = density === 1 ? 400 : (density === 4 ? 230 : 180);
                
                new QRCode(tempQrDiv, {
                    text: payload,
                    width: qrSize,
                    height: qrSize,
                    correctLevel: QRCode.CorrectLevel.M
                });

                // Ожидаем рендеринг картинки библиотекой внутри DOM
                await sleep(50);
                let imgElement = tempQrDiv.querySelector('img');
                
                if (!imgElement || !imgElement.src) {
                    await sleep(150); // Дополнительное время ожидания для медленных систем
                    imgElement = tempQrDiv.querySelector('img');
                }

                if (imgElement && imgElement.src) {
                    const finalImg = document.createElement('img');
                    finalImg.src = imgElement.src;
                    qrItem.appendChild(finalImg);
                } else {
                    // Фолбэк на Canvas если элемент img не создался
                    const canvasEl = tempQrDiv.querySelector('canvas');
                    if (canvasEl) {
                        const finalImg = document.createElement('img');
                        finalImg.src = canvasEl.toDataURL("image/png");
                        qrItem.appendChild(finalImg);
                    }
                }

                const label = document.createElement('div');
                label.className = 'qr-label';
                label.innerText = `Часть ${i + 1} из ${totalChunks}`;
                qrItem.appendChild(label);

                currentGrid.appendChild(qrItem);
                codesOnCurrentPage++;

                const pct = Math.round(((i + 1) / totalChunks) * 100);
                progressBar.style.width = pct + '%';
            }

            statusText.innerText = `Успешно сформировано! Всего кодов: ${totalChunks}. Нажмите кнопку экспорта ниже.`;
            printBtn.style.display = 'block';

        } catch (err) {
            alert("Произошла ошибка при кодировании: " + err.message);
            statusText.innerText = "Ошибка генерации.";
        }
    });

    document.getElementById('btn-print').addEventListener('click', () => {
        window.print();
    });

    // ==========================================
    // СБОРКА И ОБРАБОТКА ДАННЫХ КОДОВ
    // ==========================================
    function parsePayload(text) {
        if (!text || !text.includes('|')) return null;
        const parts = text.split('|');
        if (parts.length < 3) return null;

        const idx = parseInt(parts[0], 10);
        const total = parseInt(parts[1], 10);
        const base64Data = parts[2];

        if (isNaN(idx) || isNaN(total)) return null;
        return { idx, total, base64Data };
    }

    function processQrPayload(text) {
        const parsed = parsePayload(text);
        if (!parsed) return null;

        totalExpectedChunks = parsed.total;
        if (!gatheredChunks[parsed.idx]) {
            gatheredChunks[parsed.idx] = parsed.base64Data;
            return { current: Object.keys(gatheredChunks).length, total: parsed.total };
        }
        return null;
    }

    function checkAndAssemble() {
        if (!totalExpectedChunks || Object.keys(gatheredChunks).length !== totalExpectedChunks) return;

        try {
            document.getElementById('decode-status').innerText = "Все фрагменты получены. Собираю аудиофайл...";
            
            let fullBase64 = "";
            for (let i = 0; i < totalExpectedChunks; i++) {
                if (gatheredChunks[i] === undefined) {
                    document.getElementById('decode-status').innerText = `Ошибка сшивки: отсутствует часть ${i + 1}`;
                    return;
                }
                fullBase64 += gatheredChunks[i];
            }

            const binaryStr = atob(fullBase64);
            const len = binaryStr.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) {
                bytes[i] = binaryStr.charCodeAt(i);
            }

            const blob = new Blob([bytes], { type: 'audio/mp3' });
            const blobUrl = URL.createObjectURL(blob);

            const player = document.getElementById('player');
            player.src = blobUrl;
            document.getElementById('download-link').href = blobUrl;
            document.getElementById('audio-output').style.display = 'block';
            document.getElementById('decode-status').innerText = "Поздравляем! Аудиофайл успешно восстановлен.";
            
            stopCamera();
        } catch (e) {
            alert("Критическая ошибка при восстановлении файла. Данные повреждены: " + e.message);
        }
    }

    // РАСПОЗНАВАНИЕ ИЗ PDF
    document.getElementById('btn-scan-pdf').addEventListener('click', async () => {
        const fileInput = document.getElementById('pdf-file');
        if (!fileInput.files || fileInput.files.length === 0) return alert('Выберите корректный PDF файл.');

        const file = fileInput.files[0];
        gatheredChunks = {};
        totalExpectedChunks = null;

        const progressBox = document.getElementById('decode-progress-box');
        const progressBar = document.getElementById('decode-progress');
        const statusText = document.getElementById('decode-status');
        
        progressBox.style.display = 'block';
        progressBar.style.width = '0%';

        const fileReader = new FileReader();
        fileReader.onload = async function() {
            try {
                const typedarray = new Uint8Array(this.result);
                const pdf = await pdfjsLib.getDocument(typedarray).promise;
                
                for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                    statusText.innerText = `Анализ страницы PDF: ${pageNum} из ${pdf.numPages}...`;
                    const page = await pdf.getPage(pageNum);
                    
                    const viewport = page.getViewport({ scale: 2.0 });
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;

                    await page.render({ canvasContext: ctx, viewport: viewport }).promise;

                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    
                    // Сканирование по сетке для захвата множества кодов на листе
                    const cols = 2;
                    const rows = 3;
                    const wZone = Math.floor(canvas.width / cols);
                    const hZone = Math.floor(canvas.height / rows);

                    for (let r = 0; r < rows; r++) {
                        for (let c = 0; c < cols; c++) {
                            const zoneData = ctx.getImageData(c * wZone, r * hZone, wZone, hZone);
                            const code = jsQR(zoneData.data, zoneData.width, zoneData.height);
                            if (code && code.data) {
                                processQrPayload(code.data);
                            }
                        }
                    }

                    // Полноэкранный проход
                    const globalCode = jsQR(imageData.data, imageData.width, imageData.height);
                    if (globalCode && globalCode.data) processQrPayload(globalCode.data);

                    const pct = Math.round((pageNum / pdf.numPages) * 100);
                    progressBar.style.width = pct + '%';
                }

                if (totalExpectedChunks && Object.keys(gatheredChunks).length === totalExpectedChunks) {
                    checkAndAssemble();
                } else {
                    statusText.innerText = `Сканирование завершено. Собрано фрагментов: ${Object.keys(gatheredChunks).length} из ${totalExpectedChunks || 'неизвестно'}. Некоторых частей не хватает.`;
                }
            } catch (err) {
                alert("Ошибка чтения страниц PDF: " + err.message);
            }
        };
        fileReader.readAsArrayBuffer(file);
    });

    // ПОТОК С ВЕБ-КАМЕРЫ
    const camBtn = document.getElementById('btn-toggle-camera');
    camBtn.addEventListener('click', async () => {
        if (cameraStream) {
            stopCamera();
        } else {
            gatheredChunks = {};
            totalExpectedChunks = null;
            try {
                cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                const video = document.getElementById('webcam-video');
                video.srcObject = cameraStream;
                video.setAttribute("playsinline", true);
                video.play();
                document.getElementById('video-container').style.display = 'block';
                camBtn.innerText = "Выключить камеру";
                camBtn.style.backgroundColor = "#ef4444";

                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                cameraInterval = setInterval(() => {
                    if (video.readyState === video.HAVE_CURRENT_DATA) {
                        canvas.width = video.videoWidth;
                        canvas.height = video.videoHeight;
                        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                        const code = jsQR(imgData.data, imgData.width, imgData.height);

                        if (code && code.data) {
                            const result = processQrPayload(code.data);
                            if (result) {
                                document.getElementById('decode-status').innerText = `Считан код! Успешно собрано: ${result.current} из ${result.total}`;
                                if (navigator.vibrate) navigator.vibrate(100);
                                checkAndAssemble();
                            }
                        }
                    }
                }, 300);

            } catch (err) {
                alert("Нет доступа к камере: " + err.message);
            }
        }
    });

    function stopCamera() {
        if (cameraInterval) clearInterval(cameraInterval);
        if (cameraStream) {
            cameraStream.getTracks().forEach(track => track.stop());
        }
        cameraStream = null;
        cameraInterval = null;
        document.getElementById('video-container').style.display = 'none';
        camBtn.innerText = "Включить сканирование камерой";
        camBtn.style.backgroundColor = "var(--primary)";
    }
</script>
</body>
</html>
