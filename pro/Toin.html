<html>
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>QR Сборщик текста</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    background: #f2f3f5;
    font-family: Arial, sans-serif;
    color: #222;
}

.app {
    width: 100%;
    max-width: 600px;
    margin: auto;
    padding: 15px;
}

h1 {
    text-align: center;
    font-size: 24px;
    margin: 5px 0 15px;
}

.card {
    background: white;
    border-radius: 14px;
    padding: 15px;
    margin-bottom: 15px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

#reader {
    width: 100%;
    overflow: hidden;
    border-radius: 12px;
}

.status {
    text-align: center;
    padding: 12px;
    font-size: 16px;
    font-weight: bold;
}

button {
    width: 100%;
    border: 0;
    border-radius: 10px;
    padding: 14px;
    margin-top: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.start {
    background: #111;
    color: white;
}

.copy {
    background: #ddd;
}

.save {
    background: #ddd;
}

.clear {
    background: #eee;
}

textarea {
    width: 100%;
    min-height: 180px;
    resize: vertical;
    border: 1px solid #bbb;
    border-radius: 10px;
    padding: 12px;
    font-size: 15px;
    line-height: 1.45;
    background: #fafafa;
}

.progress {
    margin-top: 10px;
    background: #eee;
    border-radius: 10px;
    height: 12px;
    overflow: hidden;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: #111;
    transition: width .3s;
}

.small {
    color: #666;
    font-size: 13px;
    line-height: 1.4;
}

.ok {
    color: #16833b;
}

.warning {
    color: #a33;
}

.qr-list {
    margin-top: 10px;
}

.qr-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px;
    border-bottom: 1px solid #eee;
}

.qr-number {
    width: 45px;
    font-weight: bold;
}

.qr-size {
    color: #666;
    font-size: 13px;
}
</style>
</head>

<body>

<div class="app">

<h1>📷 QR Сборщик текста</h1>

<div class="card">

    <div id="reader"></div>

    <button class="start" onclick="startScanner()">
        📷 Запустить камеру
    </button>

    <div class="status" id="status">
        Камера не запущена
    </div>

</div>


<div class="card">

    <div>
        Принято QR-кодов:
        <b id="count">0</b>
    </div>

    <div class="progress">
        <div class="progress-bar" id="progress"></div>
    </div>

    <div class="small" id="progressText">
        Сканируйте первый QR-код
    </div>

</div>


<div class="card">

    <b>Порядок QR-кодов</b>

    <div class="qr-list" id="qrList">
        <div class="small">
            Пока ничего не отсканировано.
        </div>
    </div>

</div>


<div class="card">

    <b>Собранный текст</b>

    <textarea
        id="result"
        placeholder="Здесь появится восстановленный текст..."
        readonly></textarea>

    <button class="copy" onclick="copyText()">
        📋 Копировать текст
    </button>

    <button class="save" onclick="saveText()">
        💾 Сохранить TXT
    </button>

    <button class="clear" onclick="clearAll()">
        🗑 Очистить всё
    </button>

</div>

</div>


<script>

/*
============================================================
НАСТРОЙКИ
============================================================
*/


let scanner = null;

let scanning = false;


/*
    Здесь хранятся все отсканированные QR.

    Каждый QR получает порядковый номер
    в момент сканирования.
*/
let parts = [];


/*
    Чтобы один и тот же QR не добавлялся
    много раз, пока камера продолжает его видеть.
*/
let lastDecoded = "";

let lastDecodedTime = 0;


/*
============================================================
ЗАПУСК КАМЕРЫ
============================================================
*/

async function startScanner() {

    if (scanning) {
        return;
    }

    const status =
        document.getElementById("status");

    status.textContent =
        "Запрашиваю доступ к камере...";

    try {

        scanner =
            new Html5Qrcode("reader");

        await scanner.start(

            {
                facingMode: "environment"
            },

            {
                fps: 10,

                qrbox: function(viewfinderWidth, viewfinderHeight) {

                    const size =
                        Math.min(
                            viewfinderWidth,
                            viewfinderHeight
                        ) * 0.75;

                    return {
                        width: size,
                        height: size
                    };
                },

                aspectRatio: 1.0

            },

            onScanSuccess,

            onScanFailure

        );

        scanning = true;

        status.textContent =
            "📷 Наведите камеру на QR-код";

    } catch (error) {

        console.error(error);

        status.innerHTML =
            '<span class="warning">' +
            'Не удалось запустить камеру.<br>' +
            'Разрешите доступ к камере браузеру.' +
            '</span>';

    }
}


/*
============================================================
ОБРАБОТКА УСПЕШНОГО СКАНИРОВАНИЯ
============================================================
*/

function onScanSuccess(decodedText, decodedResult) {

    const now = Date.now();


    /*
        Если камера видит тот же QR несколько раз
        подряд — игнорируем повтор.
    */

    if (
        decodedText === lastDecoded &&
        now - lastDecodedTime < 2500
    ) {
        return;
    }


    lastDecoded = decodedText;

    lastDecodedTime = now;


    addPart(decodedText);
}


/*
============================================================
ОШИБКИ СКАНИРОВАНИЯ
============================================================

Ошибки здесь нормальны.

Камера постоянно пытается распознать изображение,
поэтому отсутствие QR в очередном кадре
не считается ошибкой программы.
*/

function onScanFailure(error) {

    // Ничего не делаем.
}


/*
============================================================
ДОБАВЛЕНИЕ ЧАСТИ
============================================================
*/

function addPart(text) {

    /*
        Проверяем, не был ли такой текст уже добавлен.

        Это дополнительная защита от повторного сканирования.
    */

    for (let i = 0; i < parts.length; i++) {

        if (parts[i] === text) {

            document.getElementById("status").textContent =
                "Этот QR уже был добавлен.";

            return;
        }
    }


    /*
        Добавляем новую часть.
    */

    parts.push(text);


    /*
        Обновляем интерфейс.
    */

    updateInterface();


    /*
        Небольшое визуальное подтверждение.
    */

    document.getElementById("status").innerHTML =
        '<span class="ok">✓ QR-код №' +
        parts.length +
        ' принят</span>';
}


/*
============================================================
ОБНОВЛЕНИЕ ИНТЕРФЕЙСА
============================================================
*/

function updateInterface() {

    const count =
        document.getElementById("count");

    const result =
        document.getElementById("result");

    const qrList =
        document.getElementById("qrList");

    const progress =
        document.getElementById("progress");

    const progressText =
        document.getElementById("progressText");


    /*
        Количество
    */

    count.textContent =
        parts.length;


    /*
        Собираем текст строго в порядке сканирования.
    */

    result.value =
        parts.join("");


    /*
        Пока неизвестно общее количество QR,
        поэтому прогресс показываем условно.
    */

    const percent =
        Math.min(
            100,
            parts.length * 10
        );

    progress.style.width =
        percent + "%";


    progressText.textContent =
        "Получено частей: " +
        parts.length +
        ". Сканируйте следующий QR-код.";


    /*
        Список полученных QR
    */

    qrList.innerHTML = "";


    parts.forEach(function(part, index) {

        const row =
            document.createElement("div");

        row.className =
            "qr-row";


        const number =
            document.createElement("div");

        number.className =
            "qr-number";

        number.textContent =
            "#" + (index + 1);


        const size =
            document.createElement("div");

        size.className =
            "qr-size";

        size.textContent =
            "символов: " +
            part.length +
            ", UTF-8: " +
            utf8Length(part) +
            " байт";


        row.appendChild(number);

        row.appendChild(size);

        qrList.appendChild(row);

    });
}


/*
============================================================
UTF-8
============================================================
*/

function utf8Length(text) {

    return new TextEncoder()
        .encode(text)
        .length;
}


/*
============================================================
КОПИРОВАНИЕ
============================================================
*/

async function copyText() {

    const result =
        document.getElementById("result");

    if (!result.value) {
        return;
    }

    try {

        await navigator.clipboard.writeText(
            result.value
        );

        document.getElementById("status").innerHTML =
            '<span class="ok">✓ Текст скопирован</span>';

    } catch (error) {

        /*
            Запасной вариант
        */

        result.removeAttribute("readonly");

        result.select();

        document.execCommand("copy");

        result.setAttribute("readonly", true);

        document.getElementById("status").innerHTML =
            '<span class="ok">✓ Текст скопирован</span>';
    }
}


/*
============================================================
СОХРАНЕНИЕ TXT
============================================================
*/

function saveText() {

    const text =
        document.getElementById("result").value;

    if (!text) {
        return;
    }

    const blob =
        new Blob(
            [text],
            {
                type: "text/plain;charset=utf-8"
            }
        );

    const url =
        URL.createObjectURL(blob);

    const a =
        document.createElement("a");

    a.href = url;

    a.download =
        "recovered_text.txt";

    document.body.appendChild(a);

    a.click();

    document.body.removeChild(a);

    URL.revokeObjectURL(url);
}


/*
============================================================
ОЧИСТКА
============================================================
*/

async function clearAll() {

    /*
        Если камера работает —
        сначала выключаем её.
    */

    if (scanner && scanning) {

        try {

            await scanner.stop();

        } catch (e) {

            console.log(e);
        }

        scanning = false;
    }


    parts = [];

    lastDecoded = "";

    lastDecodedTime = 0;


    document.getElementById("count").textContent =
        "0";

    document.getElementById("result").value =
        "";

    document.getElementById("progress").style.width =
        "0%";

    document.getElementById("progressText").textContent =
        "Сканируйте первый QR-код";

    document.getElementById("qrList").innerHTML =
        '<div class="small">' +
        'Пока ничего не отсканировано.' +
        '</div>';

    document.getElementById("status").textContent =
        "Камера не запущена";
}

</script>

</body>
</html>
