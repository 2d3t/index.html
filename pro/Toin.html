<!DOCTYPE html>
<html>
<head>
    <title>Моё офлайн-приложение</title>
</head>
<body>
    <input id="note" placeholder="Введите заметку">
    <button onclick="saveNote()">Сохранить</button>
    <div id="notes"></div>

    <script>
        // Загружаем заметки при открытии
        function loadNotes() {
            const saved = localStorage.getItem('notes');
            if (saved) {
                document.getElementById('notes').innerHTML = saved;
            }
        }

        // Сохраняем заметки
        function saveNote() {
            const input = document.getElementById('note');
            const notesDiv = document.getElementById('notes');
            notesDiv.innerHTML += `<p>${input.value}</p>`;
            localStorage.setItem('notes', notesDiv.innerHTML);
            input.value = '';
        }

        // Сохраняем при уходе со страницы
        window.addEventListener('beforeunload', () => {
            const notes = document.getElementById('notes').innerHTML;
            localStorage.setItem('notes', notes);
        });

        loadNotes();
    </script>
</body>
</html>
