<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐱 Крипте-Котик v3 (отладка)</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui;
            background: #0b0e14;
            color: #e0e7f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
        }
        .card {
            max-width: 600px;
            width: 100%;
            background: #1a202c;
            border-radius: 36px;
            padding: 24px 20px 30px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.8);
            border: 1px solid #2d3748;
        }
        h1 { display: flex; align-items: center; gap: 10px; font-weight: 500; font-size: 24px; margin: 0 0 6px 0; }
        h1 small { font-size: 14px; font-weight: 400; color: #a0aec0; margin-left: auto; }
        .status-bar {
            display: flex;
            justify-content: space-between;
            background: #0f141e;
            padding: 10px 16px;
            border-radius: 60px;
            margin: 12px 0 20px 0;
            font-size: 14px;
            border: 1px solid #2d3748;
            flex-wrap: wrap;
        }
        #chatlog {
            background: #0f141e;
            border-radius: 24px;
            padding: 16px;
            height: 280px;
            overflow-y: auto;
            margin-bottom: 16px;
            border: 1px solid #2d3748;
            font-size: 16px;
            line-height: 1.7;
            display: flex;
            flex-direction: column;
        }
        .msg {
            padding: 6px 12px;
            border-radius: 20px;
            max-width: 85%;
            margin-bottom: 6px;
            word-break: break-word;
        }
        .msg.out { background: #2b6cb0; align-self: flex-end; }
        .msg.in { background: #2d3748; align-self: flex-start; }
        .msg.sys { background: transparent; color: #a0aec0; font-size: 13px; align-self: center; }
        .msg.debug { background: #2d3748; color: #ecc94b; font-size: 12px; align-self: center; font-family: monospace; }

        .input-area {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }
        #textInput {
            flex: 1;
            background: #0f141e;
            border: 1px solid #2d3748;
            border-radius: 60px;
            padding: 12px 18px;
            color: #e0e7f0;
            font-size: 16px;
            outline: none;
        }
        #textInput:focus { border-color: #4a90e2; }
        button {
            background: #2b6cb0;
            border: none;
            border-radius: 60px;
            padding: 0 24px;
            font-weight: 600;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }
        button:active { transform: scale(0.94); background: #1a4f8b; }
        button.secondary { background: #2d3748; }
        button.secondary:active { background: #1a202c; }

        .debug-panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            background: #0f141e;
            border-radius: 16px;
            padding: 12px;
            margin-top: 12px;
            border: 1px solid #2d3748;
            font-size: 13px;
        }
        .debug-panel .item {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .debug-panel .value {
            font-family: monospace;
            color: #ecc94b;
        }
        #volumeMeter {
            width: 100%;
            height: 10px;
            background: #2d3748;
            border-radius: 10px;
            overflow: hidden;
            grid-column: span 2;
        }
        #volumeFill {
            height: 100%;
            width: 0%;
            background: #48bb78;
            transition: width 0.05s;
        }
        .threshold-slider {
            grid-column: span 2;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .threshold-slider input {
            flex: 1;
            accent-color: #2b6cb0;
        }
    </style>
</head>
<body>
<div class="card">
    <h1>
        <span>🐱 Крипте-Котик v3</span>
        <small>отладка</small>
    </h1>

    <div class="status-bar">
        <span id="statusText">🟡 Инициализация...</span>
        <span id="peerId">📡 ID: <span id="deviceIdDisplay">—</span></span>
    </div>

    <div id="chatlog"></div>

    <div class="input-area">
        <input type="text" id="textInput" placeholder="Введи сообщение..." maxlength="30">
        <button id="sendBtn">📤 Отправить</button>
    </div>

    <div style="display: flex; gap: 10px; margin-bottom: 6px;">
        <button id="clearBtn" class="secondary" style="flex:1;">🗑 Очистить</button>
        <button id="testBtn" class="secondary" style="flex:1;">🔊 Тест (ПРИВ)</button>
        <button id="debugBtn" class="secondary" style="flex:1;">🐞 Отладка</button>
    </div>

    <!-- Панель отладки -->
    <div class="debug-panel" id="debugPanel">
        <div class="item"><span>🎤 Громкость (RMS)</span><span class="value" id="rmsValue">0</span></div>
        <div class="item"><span>🔊 Последняя пауза</span><span class="value" id="lastPauseValue">—</span></div>
        <div id="volumeMeter"><div id="volumeFill"></div></div>
        <div class="threshold-slider">
            <span>🔽 Порог:</span>
            <input type="range" id="thresholdSlider" min="10" max="100" value="55">
            <span class="value" id="thresholdValue">55</span>
        </div>
        <div class="item" style="grid-column: span 2;">
            <span>📦 Буфер пауз:</span>
            <span class="value" id="bufferValue">[]</span>
        </div>
    </div>
</div>

<script>
    (function(){
        // ---------- НАСТРОЙКИ ----------
        const ALPHABET = " АБВГДЕЁЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯ";
        const BASE_PAUSE = 150;
        const PAUSE_STEP = 50;
        const MAX_PAUSE = BASE_PAUSE + (ALPHABET.length - 1) * PAUSE_STEP;
        const END_PAUSE = MAX_PAUSE + 400;
        const CLICK_DURATION = 80; // увеличенная длительность

        // DOM
        const chatlog = document.getElementById('chatlog');
        const textInput = document.getElementById('textInput');
        const sendBtn = document.getElementById('sendBtn');
        const clearBtn = document.getElementById('clearBtn');
        const testBtn = document.getElementById('testBtn');
        const debugBtn = document.getElementById('debugBtn');
        const statusText = document.getElementById('statusText');
        const deviceIdDisplay = document.getElementById('deviceIdDisplay');
        const rmsValue = document.getElementById('rmsValue');
        const lastPauseValue = document.getElementById('lastPauseValue');
        const bufferValue = document.getElementById('bufferValue');
        const volumeFill = document.getElementById('volumeFill');
        const thresholdSlider = document.getElementById('thresholdSlider');
        const thresholdValue = document.getElementById('thresholdValue');

        let audioContext = null;
        let isSending = false;
        let receiveBuffer = [];
        let receiveTimer = null;
        let lastClickTime = 0;
        let deviceId = '';
        let debugMode = false;

        // ---------- AUDIO ----------
        function initAudio() {
            if (audioContext) return;
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                deviceId = Math.random().toString(36).substring(2, 6).toUpperCase();
                deviceIdDisplay.textContent = deviceId;
                startMicrophone();
            } catch(e) {
                statusText.innerHTML = '🔴 Ошибка Web Audio';
            }
        }

        // ---------- МИКРОФОН ----------
        let mediaStream = null;
        let analyser = null;
        let dataArray = null;
        let micActive = false;

        function startMicrophone() {
            navigator.mediaDevices.getUserMedia({ audio: true, video: false })
                .then(stream => {
                    mediaStream = stream;
                    const source = audioContext.createMediaStreamSource(stream);
                    analyser = audioContext.createAnalyser();
                    analyser.fftSize = 512;
                    analyser.smoothingTimeConstant = 0.2;
                    source.connect(analyser);
                    dataArray = new Uint8Array(analyser.fftSize);
                    micActive = true;
                    statusText.innerHTML = '🟢 Микрофон активен';
                    listenLoop();
                })
                .catch(err => {
                    statusText.innerHTML = '🔴 Нет доступа к микрофону';
                });
        }

        // ---------- ОБНАРУЖЕНИЕ ЩЕЛЧКОВ ----------
        let listening = false;
        let currentThreshold = 55;

        thresholdSlider.addEventListener('input', () => {
            currentThreshold = parseInt(thresholdSlider.value);
            thresholdValue.textContent = currentThreshold;
        });

        function listenLoop() {
            if (!analyser || !micActive) return;
            listening = true;

            function check() {
                if (!listening || !analyser) return;
                analyser.getByteTimeDomainData(dataArray);
                let sum = 0;
                for (let i = 0; i < dataArray.length; i++) {
                    const val = (dataArray[i] - 128) / 128;
                    sum += val * val;
                }
                const rms = Math.sqrt(sum / dataArray.length) * 100;
                
                // Обновляем отладку
                rmsValue.textContent = Math.round(rms);
                const percent = Math.min(rms * 2, 100);
                volumeFill.style.width = percent + '%';
                if (percent > 30) {
                    volumeFill.style.background = '#ecc94b';
                } else {
                    volumeFill.style.background = '#48bb78';
                }

                const now = performance.now();

                // Если громкость выше порога
                if (rms > currentThreshold) {
                    // Игнорируем свой сигнал
                    if (now - lastSendTime < 200) {
                        requestAnimationFrame(check);
                        return;
                    }
                    // Обрабатываем щелчок
                    handleClick(now);
                }

                requestAnimationFrame(check);
            }
            check();
        }

        // ---------- ОБРАБОТКА ЩЕЛЧКА ----------
        let lastClickReceived = 0;

        function handleClick(now) {
            if (now - lastClickReceived < 70) return;
            lastClickReceived = now;

            if (debugMode) {
                addMessage(`🔊 Щелчок в ${now.toFixed(0)}`, 'debug');
            }

            if (lastClickTime === 0) {
                lastClickTime = now;
                receiveBuffer = [];
                if (receiveTimer) {
                    clearTimeout(receiveTimer);
                    receiveTimer = null;
                }
                receiveTimer = setTimeout(() => {
                    finishReceiving();
                }, END_PAUSE);
                if (debugMode) addMessage('📦 Начало приёма', 'debug');
                return;
            }

            const pause = now - lastClickTime;
            lastClickTime = now;

            if (pause > END_PAUSE) {
                finishReceiving();
                return;
            }

            receiveBuffer.push(pause);
            lastPauseValue.textContent = pause.toFixed(0) + 'мс';
            bufferValue.textContent = '[' + receiveBuffer.map(p => p.toFixed(0)).join(', ') + ']';

            if (debugMode) {
                addMessage(`⏱️ Пауза: ${pause.toFixed(0)}мс`, 'debug');
            }

            if (receiveTimer) {
                clearTimeout(receiveTimer);
                receiveTimer = setTimeout(() => {
                    finishReceiving();
                }, END_PAUSE);
            }
        }

        // ---------- ЗАВЕРШЕНИЕ ПРИЁМА ----------
        function finishReceiving() {
            if (receiveTimer) {
                clearTimeout(receiveTimer);
                receiveTimer = null;
            }
            if (receiveBuffer.length === 0) {
                lastClickTime = 0;
                return;
            }

            let message = '';
            for (let p of receiveBuffer) {
                let index = Math.round((p - BASE_PAUSE) / PAUSE_STEP);
                if (index < 0) index = 0;
                if (index >= ALPHABET.length) index = ALPHABET.length - 1;
                message += ALPHABET[index];
            }

            if (debugMode) {
                addMessage(`📝 Расшифровано: "${message}"`, 'debug');
            }

            if (message.trim().length > 0) {
                addMessage(message, 'in');
            }

            lastClickTime = 0;
            receiveBuffer = [];
            lastPauseValue.textContent = '—';
            bufferValue.textContent = '[]';
        }

        // ---------- ОТПРАВКА ----------
        let lastSendTime = 0;

        function sendMessage(text) {
            if (isSending) return;
            if (!audioContext) { initAudio(); return; }
            text = text.toUpperCase();
            let filtered = '';
            for (let ch of text) {
                if (ALPHABET.includes(ch)) filtered += ch;
            }
            if (!filtered) {
                addMessage('⚠️ Только кириллица', 'sys');
                return;
            }

            const pauses = [];
            for (let ch of filtered) {
                pauses.push(BASE_PAUSE + ALPHABET.indexOf(ch) * PAUSE_STEP);
            }

            addMessage(filtered, 'out');
            playClicks(pauses);
        }

        // ---------- ВОСПРОИЗВЕДЕНИЕ ----------
        function playClicks(pauses) {
            if (isSending) return;
            isSending = true;
            statusText.innerHTML = '🔊 Передача...';

            let index = 0;

            function playNext() {
                if (index >= pauses.length) {
                    setTimeout(() => finishSend(), END_PAUSE);
                    return;
                }

                playClick(CLICK_DURATION, 1800);
                lastSendTime = performance.now();

                const delay = pauses[index];
                index++;
                setTimeout(() => {
                    playNext();
                }, delay);
            }

            playClick(CLICK_DURATION, 1800);
            lastSendTime = performance.now();
            setTimeout(() => {
                index = 1;
                if (pauses.length > 1) {
                    playNext();
                } else {
                    setTimeout(() => finishSend(), END_PAUSE);
                }
            }, pauses[0] || 0);
        }

        function playClick(duration, freq) {
            if (!audioContext) return;
            try {
                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();
                osc.type = 'sine';
                osc.frequency.value = freq || 1500;
                gain.gain.value = 1.0; // максимальная громкость
                osc.connect(gain);
                gain.connect(audioContext.destination);
                osc.start();
                setTimeout(() => { osc.stop(); }, duration);
            } catch(e) {}
        }

        function finishSend() {
            isSending = false;
            statusText.innerHTML = '🟢 Готов';
        }

        // ---------- ЧАТ ----------
        function addMessage(text, type) {
            const div = document.createElement('div');
            div.className = `msg ${type}`;
            div.textContent = text;
            chatlog.appendChild(div);
            chatlog.scrollTop = chatlog.scrollHeight;
        }
        function addSystemMessage(text) {
            const div = document.createElement('div');
            div.className = 'msg sys';
            div.textContent = text;
            chatlog.appendChild(div);
            chatlog.scrollTop = chatlog.scrollHeight;
        }

        function testConnection() {
            addSystemMessage('🔊 Тест (ПРИВ)');
            sendMessage('ПРИВ');
        }

        // ---------- СОБЫТИЯ ----------
        sendBtn.addEventListener('click', () => {
            const text = textInput.value.trim();
            if (text) { sendMessage(text); textInput.value = ''; }
        });
        textInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendBtn.click(); });
        clearBtn.addEventListener('click', () => { chatlog.innerHTML = ''; });
        testBtn.addEventListener('click', testConnection);
        debugBtn.addEventListener('click', () => {
            debugMode = !debugMode;
            debugBtn.textContent = debugMode ? '🔍 Отладка ВКЛ' : '🐞 Отладка';
            addSystemMessage(debugMode ? '🐞 Режим отладки включён' : '🐞 Отладка выключена');
        });

        document.body.addEventListener('click', () => {
            if (!audioContext) {
                initAudio();
                addSystemMessage('🎤 Микрофон активирован');
            }
        });

        window.addEventListener('load', () => {
            addSystemMessage('🐱 Крипте-Котик v3 с отладкой');
            addSystemMessage('💡 Включи отладку, чтобы видеть каждый щелчок');
            addSystemMessage('📊 Следи за громкостью — она должна быть > порога');
        });
    })();
</script>
</body>
</html>
