<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ультразвуковой модем</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #e0e0e0; padding: 20px; text-align: center; }
        button { background: #00adb5; border: none; color: white; padding: 12px 24px; font-size: 16px; border-radius: 5px; cursor: pointer; margin: 10px; }
        button:active { background: #007a80; }
        input { padding: 10px; font-size: 16px; width: 80%; max-width: 300px; border-radius: 5px; border: 1px solid #333; background: #222; color: white; }
        .box { background: #1e1e1e; padding: 15px; border-radius: 8px; margin: 20px auto; max-width: 400px; border: 1px solid #333; }
        #log { font-family: monospace; color: #888; font-size: 12px; max-height: 100px; overflow-y: auto; text-align: left; background: #000; padding: 10px; border-radius: 5px; }
        #output { font-size: 24px; font-weight: bold; color: #00adb5; margin-top: 10px; }
    </style>
</head>
<body>

    <h1>Ultrasonic Comm</h1>
    <button id="initBtn">1. Включить звук / микрофон</button>

    <div class="box">
        <h3>Передатчик (Tx)</h3>
        <input type="text" id="textInput" value="HELLO" placeholder="Текст (A-Z)">
        <br>
        <button id="sendBtn" disabled>Отправить импульсы</button>
    </div>

    <div class="box">
        <h3>Приемник (Rx)</h3>
        <div>Получено:</div>
        <div id="output">...</div>
    </div>

    <div class="box">
        <h3>Технический лог</h3>
        <div id="log"></div>
    </div>

<script>
    // Алфавит и кодирование пауз (в секундах)
    // Шаг паузы: Каждая следующая буква увеличивает паузу на 0.2 сек.
    const ALPHABET = " ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    const BASE_PAUSE = 0.3; // Минимальная пауза (для пробела)
    const STEP = 0.15;      // Шаг для каждой следующей буквы
    const FREQUENCY = 18500; // Частота ультразвука (Гц)
    const PULSE_DURATION = 0.05; // Длительность щелчка (50 мс)

    let audioCtx = null;
    let analyser = null;
    let isListening = false;

    // Логирование на экран
    function log(msg) {
        const logDiv = document.getElementById('log');
        logDiv.innerHTML += msg + '<br>';
        logDiv.scrollTop = logDiv.scrollHeight;
    }

    // Инициализация AudioContext по нажатию кнопки (требование безопасности браузеров)
    document.getElementById('initBtn').addEventListener('click', async () => {
        if (audioCtx) return;
        
        try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            document.getElementById('sendBtn').disabled = false;
            document.getElementById('initBtn').innerText = "Звук готов";
            document.getElementById('initBtn').style.background = "#28a745";
            
            // Запуск приемника (микрофон)
            await initReceiver();
        } catch (e) {
            alert("Не удалось активировать аудио: " + e);
        }
    });

    // --- ПЕРЕДАТЧИК (Генерация ультразвуковых импульсов) ---
    function sendClick(time) {
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        
        osc.type = 'sine';
        osc.frequency.setValueAtTime(FREQUENCY, time);
        
        // Экспоненциальное затухание помогает уменьшить щелчок по корпусу телефона
        gainNode.gain.setValueAtTime(0, time);
        gainNode.gain.linearRampToValueAtTime(1, time + 0.005); 
        gainNode.gain.setValueAtTime(1, time + PULSE_DURATION - 0.01);
        gainNode.gain.linearRampToValueAtTime(0, time + PULSE_DURATION);
        
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        
        osc.start(time);
        osc.stop(time + PULSE_DURATION);
    }

    document.getElementById('sendBtn').addEventListener('click', () => {
        const text = document.getElementById('textInput').value.toUpperCase();
        let currentTime = audioCtx.currentTime + 0.1;
        
        log(`Отправка: "${text}"`);
        
        // Стартовый импульс (синхронизация)
        sendClick(currentTime);
        log(`[Tx] Стартовый импульс в ${currentTime.toFixed(3)}`);
        
        for (let i = 0; i < text.length; i++) {
            const char = text[i];
            const index = ALPHABET.indexOf(char);
            if (index === -1) continue; // Игнорируем неизвестные символы
            
            // Вычисляем паузу для этой буквы
            const pauseDuration = BASE_PAUSE + (index * STEP);
            
            // Время следующего щелчка = текущее время + длительность импульса + пауза
            currentTime += PULSE_DURATION + pauseDuration;
            sendClick(currentTime);
            
            log(`[Tx] Буква '${char}' (пауза ${pauseDuration.toFixed(2)}с) -> Импульс в ${currentTime.toFixed(3)}`);
        }
    });

    // --- ПРИЕМНИК (Детектор частоты и декодер) ---
    async function initReceiver() {
        try {
            // ОТКЛЮЧАЕМ встроенные фильтры телефона, иначе они вырежут ультразвук как шум
            const stream = await navigator.mediaDevices.getUserMedia({
                audio: {
                    echoCancellation: false,
                    noiseSuppression: false,
                    autoGainControl: false
                }
            });

            const source = audioCtx.createMediaStreamSource(stream);
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 2048; // Размер окна преобразования Фурье
            source.connect(analyser);
            
            isListening = true;
            log("[Rx] Микрофон слушает. Фильтры отключены.");
            detectPulse();
        } catch (err) {
            log("[Rx] Ошибка доступа к микрофону: " + err);
        }
    }

    let lastPulseTime = 0;
    let blankingPeriod = false;
    const THRESHOLD = 40; // Чувствительность (подбирается экспериментально от 10 до 100)

    function detectPulse() {
        if (!isListening) return;
        requestAnimationFrame(detectPulse);

        const bufferLength = analyser.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);
        analyser.getByteFrequencyData(dataArray);

        // Находим нужный индекс в массиве частот
        // Частота одного шага (bin) = SampleRate / fftSize
        const sampleRate = audioCtx.sampleRate;
        const binIndex = Math.round((FREQUENCY * analyser.fftSize) / sampleRate);
        
        const volumeAtFrequency = dataArray[binIndex];

        // Если зафиксирован пик и мы не в "слепом окне" (резонанс)
        if (volumeAtFrequency > THRESHOLD && !blankingPeriod) {
            const now = audioCtx.currentTime;
            
            // Включаем "слепое окно" на 150мс, чтобы проигнорировать эхо
            blankingPeriod = true;
            setTimeout(() => { blankingPeriod = false; }, 150);

            log(`[Rx] Пик обнаружен! Мощность: ${volumeAtFrequency}. Время: ${now.toFixed(3)}`);

            if (lastPulseTime > 0) {
                // Вычисляем чистую паузу между импульсами
                const measuredPause = now - lastPulseTime - PULSE_DURATION;
                decodePause(measuredPause);
            } else {
                log("[Rx] Это стартовый импульс. Начинаю отсчет времени.");
                document.getElementById('output').innerText = ""; 
            }
            
            lastPulseTime = now;
        }
    }

    function decodePause(pause) {
        log(`[Rx] Замеренная пауза: ${pause.toFixed(3)} сек`);
        
        // Ищем к какому индексу алфавита ближе всего наша пауза
        let bestIndex = -1;
        let minDiff = Infinity;
        
        for (let i = 0; i < ALPHABET.length; i++) {
            const expectedPause = BASE_PAUSE + (i * STEP);
            const diff = Math.abs(pause - expectedPause);
            if (diff < minDiff) {
                minDiff = diff;
                bestIndex = i;
            }
        }

        // Если погрешность слишком большая (больше половины шага), возможно это левый шум
        if (minDiff > STEP * 0.6) {
            log(`[Rx] Ошибка: Пауза не распознана (ошибка ${minDiff.toFixed(3)})`);
            return;
        }

        const detectedChar = ALPHABET[bestIndex];
        log(`[Rx] Распознан символ: '${detectedChar}' (ошибка: ${minDiff.toFixed(3)}с)`);
        document.getElementById('output').innerText += detectedChar;
    }
</script>
</body>
</html>
