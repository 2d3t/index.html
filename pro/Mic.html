<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐱 Крипте-Котик: Акустический чат</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui;
            background: #0b0e14;
            color: #e0e7f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
        }
        .card {
            max-width: 500px;
            width: 100%;
            background: #1a202c;
            border-radius: 36px;
            padding: 24px 20px 30px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.8);
            border: 1px solid #2d3748;
        }
        h1 {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 500;
            font-size: 24px;
            margin: 0 0 6px 0;
        }
        h1 small {
            font-size: 14px;
            font-weight: 400;
            color: #a0aec0;
            margin-left: auto;
        }
        .status-bar {
            display: flex;
            justify-content: space-between;
            background: #0f141e;
            padding: 10px 16px;
            border-radius: 60px;
            margin: 12px 0 20px 0;
            font-size: 14px;
            border: 1px solid #2d3748;
        }
        .badge {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 10px;
            margin-right: 6px;
        }
        .badge.green { background: #48bb78; box-shadow: 0 0 6px #48bb78; }
        .badge.red { background: #fc8181; box-shadow: 0 0 6px #fc8181; }
        .badge.yellow { background: #ecc94b; box-shadow: 0 0 6px #ecc94b; }

        #chatlog {
            background: #0f141e;
            border-radius: 24px;
            padding: 16px;
            height: 280px;
            overflow-y: auto;
            margin-bottom: 16px;
            border: 1px solid #2d3748;
            font-size: 16px;
            line-height: 1.7;
            display: flex;
            flex-direction: column;
        }
        .msg {
            padding: 6px 12px;
            border-radius: 20px;
            max-width: 85%;
            margin-bottom: 6px;
            word-break: break-word;
        }
        .msg.out { background: #2b6cb0; align-self: flex-end; }
        .msg.in { background: #2d3748; align-self: flex-start; }
        .msg.sys { background: transparent; color: #a0aec0; font-size: 13px; align-self: center; }

        .input-area {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }
        #textInput {
            flex: 1;
            background: #0f141e;
            border: 1px solid #2d3748;
            border-radius: 60px;
            padding: 12px 18px;
            color: #e0e7f0;
            font-size: 16px;
            outline: none;
        }
        #textInput:focus { border-color: #4a90e2; }
        button {
            background: #2b6cb0;
            border: none;
            border-radius: 60px;
            padding: 0 24px;
            font-weight: 600;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }
        button:active { transform: scale(0.94); background: #1a4f8b; }
        button.secondary { background: #2d3748; }
        button.secondary:active { background: #1a202c; }

        .microphone-indicator {
            display: flex;
            justify-content: center;
            gap: 14px;
            font-size: 13px;
            color: #a0aec0;
            margin-top: 12px;
        }
        .microphone-indicator span { display: flex; align-items: center; gap: 4px; }
        .dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 12px;
            background: #4a5568;
            transition: 0.15s;
        }
        .dot.active { background: #48bb78; box-shadow: 0 0 10px #48bb78; }
        .dot.speaking { background: #ecc94b; box-shadow: 0 0 10px #ecc94b; }
    </style>
</head>
<body>
<div class="card">
    <h1>
        <span>🐱 Крипте-Котик</span>
        <small>акустический чат</small>
    </h1>

    <div class="status-bar">
        <span id="statusText">🟡 Инициализация...</span>
        <span id="peerId">📡 ID: <span id="deviceIdDisplay">—</span></span>
    </div>

    <div id="chatlog"></div>

    <div class="input-area">
        <input type="text" id="textInput" placeholder="Введи сообщение..." maxlength="30">
        <button id="sendBtn">📤 Отправить</button>
    </div>

    <div style="display: flex; gap: 10px; margin-bottom: 6px;">
        <button id="clearBtn" class="secondary" style="flex:1;">🗑 Очистить</button>
        <button id="testBtn" class="secondary" style="flex:1;">🔊 Тест связи</button>
    </div>

    <div class="microphone-indicator">
        <span>🎤 <span class="dot" id="micDot"></span> микрофон</span>
        <span>🔊 <span class="dot" id="speakerDot"></span> динамик</span>
        <span id="lastSignal" style="font-size:12px;">⏱️ —</span>
    </div>
</div>

<script>
    (function(){
        // ---------- НАСТРОЙКИ ----------
        const ALPHABET = " АБВГДЕЁЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯ";
        // паузы в миллисекундах: пробел = 100, А = 150, Б = 200 ... Я = 1750
        const BASE_PAUSE = 100; 
        const PAUSE_STEP = 50;
        const MAX_PAUSE = BASE_PAUSE + (ALPHABET.length - 1) * PAUSE_STEP; // 1750 мс

        // Время "молчания" = конец сообщения (дольше любой буквы)
        const END_PAUSE = MAX_PAUSE + 300; // 2050 мс

        // Длительность самого щелчка (чтобы не занимал время паузы)
        const CLICK_DURATION = 40; // 40 мс

        // DOM-элементы
        const chatlog = document.getElementById('chatlog');
        const textInput = document.getElementById('textInput');
        const sendBtn = document.getElementById('sendBtn');
        const clearBtn = document.getElementById('clearBtn');
        const testBtn = document.getElementById('testBtn');
        const statusText = document.getElementById('statusText');
        const deviceIdDisplay = document.getElementById('deviceIdDisplay');
        const micDot = document.getElementById('micDot');
        const speakerDot = document.getElementById('speakerDot');
        const lastSignal = document.getElementById('lastSignal');

        // ---------- ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ----------
        let audioContext = null;
        let isSending = false;          // флаг: идёт передача (блокируем повтор)
        let isReceiving = false;        // флаг: идёт приём сообщения
        let receiveBuffer = [];         // массив пауз между щелчками
        let receiveTimer = null;        // таймер для END_PAUSE (конец сообщения)
        let lastClickTime = 0;          // время последнего принятого щелчка
        let deviceId = '';

        // Для подавления эха: блокируем микрофон на время воспроизведения
        let micMuteTimeout = null;

        // ---------- ИНИЦИАЛИЗАЦИЯ AUDIO ----------
        function initAudio() {
            if (audioContext) return;
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                deviceId = Math.random().toString(36).substring(2, 6).toUpperCase();
                deviceIdDisplay.textContent = deviceId;
                statusText.innerHTML = '🟢 Готов к приёму/передаче';
                // Запрашиваем разрешение микрофона
                startMicrophone();
            } catch(e) {
                statusText.innerHTML = '🔴 Ошибка: браузер не поддерживает Web Audio';
                console.error(e);
            }
        }

        // ---------- МИКРОФОН ----------
        let mediaStream = null;
        let analyser = null;
        let dataArray = null;
        let micActive = false;

        function startMicrophone() {
            navigator.mediaDevices.getUserMedia({ audio: true, video: false })
                .then(stream => {
                    mediaStream = stream;
                    const source = audioContext.createMediaStreamSource(stream);
                    analyser = audioContext.createAnalyser();
                    analyser.fftSize = 512;
                    analyser.smoothingTimeConstant = 0.3;
                    source.connect(analyser);
                    dataArray = new Uint8Array(analyser.fftSize);
                    micActive = true;
                    micDot.className = 'dot active';
                    statusText.innerHTML = '🟢 Микрофон активен, слушаем...';
                    // Запускаем анализ
                    listenLoop();
                })
                .catch(err => {
                    console.error('Ошибка доступа к микрофону:', err);
                    micDot.className = 'dot';
                    statusText.innerHTML = '🔴 Нет доступа к микрофону';
                });
        }

        // ---------- ОБНАРУЖЕНИЕ ЩЕЛЧКОВ (анализ громкости) ----------
        let listening = false;

        function listenLoop() {
            if (!analyser || !micActive) return;
            listening = true;
            const threshold = 70; // порог громкости (0-255)

            function check() {
                if (!listening || !analyser) return;
                analyser.getByteTimeDomainData(dataArray);
                // Вычисляем RMS (среднеквадратичную громкость)
                let sum = 0;
                for (let i = 0; i < dataArray.length; i++) {
                    const val = (dataArray[i] - 128) / 128;
                    sum += val * val;
                }
                const rms = Math.sqrt(sum / dataArray.length) * 100;
                const now = performance.now();

                // Если громкость > порога и мы не в режиме отправки (чтобы не ловить свой сигнал)
                if (rms > threshold && !isSending) {
                    // Проверяем, что это не эхо от нашего динамика (если недавно играли звук)
                    const timeSinceLastSend = now - lastSendTime;
                    if (timeSinceLastSend < 200) {
                        // Скорее всего эхо, игнорируем
                        requestAnimationFrame(check);
                        return;
                    }

                    // Обнаружен щелчок!
                    handleClick(now);
                }

                requestAnimationFrame(check);
            }
            check();
        }

        // ---------- ОБРАБОТКА ПРИНЯТОГО ЩЕЛЧКА ----------
        let lastClickReceived = 0;

        function handleClick(now) {
            // Защита от ложных срабатываний (дребезг)
            if (now - lastClickReceived < 80) return; 
            lastClickReceived = now;

            if (lastClickTime === 0) {
                // Первый щелчок — начало сообщения
                lastClickTime = now;
                receiveBuffer = [];
                isReceiving = true;
                // Сбрасываем таймер конца сообщения
                if (receiveTimer) {
                    clearTimeout(receiveTimer);
                    receiveTimer = null;
                }
                // Устанавливаем таймер на окончание сообщения
                receiveTimer = setTimeout(() => {
                    finishReceiving();
                }, END_PAUSE);
                return;
            }

            // Вычисляем паузу между щелчками
            const pause = now - lastClickTime;
            lastClickTime = now;

            // Если пауза слишком большая (возможно, конец сообщения)
            if (pause > END_PAUSE) {
                // Это конец сообщения
                finishReceiving();
                return;
            }

            // Сохраняем паузу в буфер
            receiveBuffer.push(pause);

            // Сбрасываем таймер конца сообщения (перезапускаем)
            if (receiveTimer) {
                clearTimeout(receiveTimer);
                receiveTimer = setTimeout(() => {
                    finishReceiving();
                }, END_PAUSE);
            }

            // Обновляем индикатор
            lastSignal.textContent = `⏱️ ${pause.toFixed(0)}мс`;
        }

        // ---------- ЗАВЕРШЕНИЕ ПРИЁМА СООБЩЕНИЯ ----------
        function finishReceiving() {
            if (receiveTimer) {
                clearTimeout(receiveTimer);
                receiveTimer = null;
            }
            if (receiveBuffer.length === 0) {
                isReceiving = false;
                lastClickTime = 0;
                return;
            }

            // Расшифровываем паузы в текст
            let message = '';
            for (let p of receiveBuffer) {
                // Ищем ближайшую букву по таблице
                let index = Math.round((p - BASE_PAUSE) / PAUSE_STEP);
                if (index < 0) index = 0;
                if (index >= ALPHABET.length) index = ALPHABET.length - 1;
                message += ALPHABET[index];
            }

            // Добавляем в чат
            if (message.trim().length > 0) {
                addMessage(message, 'in');
            }

            // Сброс
            isReceiving = false;
            lastClickTime = 0;
            receiveBuffer = [];
            lastSignal.textContent = '⏱️ —';
        }

        // ---------- ОТПРАВКА СООБЩЕНИЯ (кодирование) ----------
        let lastSendTime = 0;

        function sendMessage(text) {
            if (isSending) return;
            if (!audioContext) {
                initAudio();
                return;
            }
            if (text.length === 0) return;

            // Переводим текст в верхний регистр
            text = text.toUpperCase();
            // Убираем символы не из алфавита
            let filtered = '';
            for (let ch of text) {
                if (ALPHABET.includes(ch)) filtered += ch;
            }
            if (filtered.length === 0) {
                addMessage('⚠️ Только кириллица или пробел', 'sys');
                return;
            }

            // Строим массив пауз
            const pauses = [];
            for (let ch of filtered) {
                const idx = ALPHABET.indexOf(ch);
                const pause = BASE_PAUSE + idx * PAUSE_STEP;
                pauses.push(pause);
            }

            // Добавляем своё сообщение в чат
            addMessage(filtered, 'out');

            // Запускаем воспроизведение
            playClicks(pauses);
        }

        // ---------- ВОСПРОИЗВЕДЕНИЕ ЩЕЛЧКОВ ----------
        function playClicks(pauses) {
            if (isSending) return;
            isSending = true;
            speakerDot.className = 'dot speaking';
            statusText.innerHTML = '🔊 Передача...';

            // Блокируем микрофон на время передачи, чтобы не ловить себя
            if (micMuteTimeout) clearTimeout(micMuteTimeout);
            // Временно отключаем анализ (ставим флаг)
            micDot.className = 'dot';
            // (Анализ продолжает работать, но мы игнорируем сигналы из-за isSending)

            let index = 0;
            let currentPause = pauses[index] || 0;

            function playNext() {
                if (index >= pauses.length) {
                    // Все паузы сыграны — конец
                    finishSend();
                    return;
                }

                // Воспроизводим щелчок
                playClick(CLICK_DURATION);
                lastSendTime = performance.now();

                // Ждём паузу и переходим к следующему щелчку
                const delay = currentPause;
                index++;
                if (index < pauses.length) {
                    currentPause = pauses[index];
                } else {
                    // После последнего щелчка ждём END_PAUSE, затем завершаем
                    setTimeout(() => {
                        finishSend();
                    }, END_PAUSE);
                    return;
                }

                // Ставим таймер на следующий щелчок
                setTimeout(() => {
                    playNext();
                }, delay);
            }

            // Стартуем с первой паузой (после первого щелчка)
            // Сразу играем первый щелчок и потом ждём паузу
            playClick(CLICK_DURATION);
            lastSendTime = performance.now();
            // Ждём первую паузу, затем играем второй щелчок и т.д.
            const firstPause = pauses[0] || 0;
            setTimeout(() => {
                index = 1;
                if (pauses.length > 1) {
                    currentPause = pauses[1];
                    playNext();
                } else {
                    // Если только одна буква
                    setTimeout(() => {
                        finishSend();
                    }, END_PAUSE);
                }
            }, firstPause);
        }

        function playClick(duration) {
            if (!audioContext) return;
            try {
                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();
                osc.type = 'sine';
                osc.frequency.value = 1500; // высокий тон, чтобы отличать от шума
                gain.gain.value = 0.4;
                osc.connect(gain);
                gain.connect(audioContext.destination);
                osc.start();
                setTimeout(() => {
                    osc.stop();
                }, duration);
            } catch(e) {
                console.warn('Ошибка воспроизведения:', e);
            }
        }

        function finishSend() {
            isSending = false;
            speakerDot.className = 'dot';
            statusText.innerHTML = '🟢 Готов к приёму/передаче';
            // Разблокируем микрофон
            micDot.className = 'dot active';
        }

        // ---------- ЧАТ (отображение) ----------
        function addMessage(text, type) {
            const div = document.createElement('div');
            div.className = `msg ${type}`;
            div.textContent = text;
            chatlog.appendChild(div);
            chatlog.scrollTop = chatlog.scrollHeight;
        }

        function addSystemMessage(text) {
            const div = document.createElement('div');
            div.className = 'msg sys';
            div.textContent = text;
            chatlog.appendChild(div);
            chatlog.scrollTop = chatlog.scrollHeight;
        }

        // ---------- ТЕСТ СВЯЗИ ----------
        function testConnection() {
            addSystemMessage('🔊 Тестовый сигнал (ПРИВЕТ)');
            sendMessage('ПРИВЕТ');
        }

        // ---------- СОБЫТИЯ КНОПОК ----------
        sendBtn.addEventListener('click', () => {
            const text = textInput.value.trim();
            if (text) {
                sendMessage(text);
                textInput.value = '';
            }
        });

        textInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                sendBtn.click();
            }
        });

        clearBtn.addEventListener('click', () => {
            chatlog.innerHTML = '';
        });

        testBtn.addEventListener('click', testConnection);

        // ---------- СТАРТ ----------
        // По клику на страницу инициализируем аудио (политика автозапуска)
        document.addEventListener('click', () => {
            if (!audioContext) {
                initAudio();
            }
        }, { once: false });

        // Автоинициализация при загрузке (если разрешено)
        window.addEventListener('load', () => {
            // Показываем статус
            statusText.innerHTML = '🟡 Нажмите на страницу для активации';
            addSystemMessage('🐱 Крипте-Котик готов. Нажми на страницу, чтобы включить микрофон.');
            addSystemMessage('💡 Отправляй сообщения, они передаются звуком!');
            // Попытка инициализации без клика (не всегда работает)
            setTimeout(() => {
                if (!audioContext) {
                    // Не инициализируем, ждём клик
                }
            }, 100);
        });

        // Обработчик клика для инициализации
        document.body.addEventListener('click', () => {
            if (!audioContext) {
                initAudio();
                addSystemMessage('🎤 Микрофон активирован, можно общаться!');
            }
        });

        // Предотвращаем автоматическую отправку при вводе
    })();
</script>
</body>
</html>
