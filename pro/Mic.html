<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐱 Крипте-Котик v2 (фикс приёма)</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui;
            background: #0b0e14;
            color: #e0e7f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
        }
        .card {
            max-width: 500px;
            width: 100%;
            background: #1a202c;
            border-radius: 36px;
            padding: 24px 20px 30px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.8);
            border: 1px solid #2d3748;
        }
        h1 { display: flex; align-items: center; gap: 10px; font-weight: 500; font-size: 24px; margin: 0 0 6px 0; }
        h1 small { font-size: 14px; font-weight: 400; color: #a0aec0; margin-left: auto; }
        .status-bar {
            display: flex;
            justify-content: space-between;
            background: #0f141e;
            padding: 10px 16px;
            border-radius: 60px;
            margin: 12px 0 20px 0;
            font-size: 14px;
            border: 1px solid #2d3748;
        }
        .badge {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 10px;
            margin-right: 6px;
        }
        .badge.green { background: #48bb78; box-shadow: 0 0 6px #48bb78; }
        .badge.red { background: #fc8181; box-shadow: 0 0 6px #fc8181; }
        .badge.yellow { background: #ecc94b; box-shadow: 0 0 6px #ecc94b; }

        #chatlog {
            background: #0f141e;
            border-radius: 24px;
            padding: 16px;
            height: 280px;
            overflow-y: auto;
            margin-bottom: 16px;
            border: 1px solid #2d3748;
            font-size: 16px;
            line-height: 1.7;
            display: flex;
            flex-direction: column;
        }
        .msg {
            padding: 6px 12px;
            border-radius: 20px;
            max-width: 85%;
            margin-bottom: 6px;
            word-break: break-word;
        }
        .msg.out { background: #2b6cb0; align-self: flex-end; }
        .msg.in { background: #2d3748; align-self: flex-start; }
        .msg.sys { background: transparent; color: #a0aec0; font-size: 13px; align-self: center; }

        .input-area {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }
        #textInput {
            flex: 1;
            background: #0f141e;
            border: 1px solid #2d3748;
            border-radius: 60px;
            padding: 12px 18px;
            color: #e0e7f0;
            font-size: 16px;
            outline: none;
        }
        #textInput:focus { border-color: #4a90e2; }
        button {
            background: #2b6cb0;
            border: none;
            border-radius: 60px;
            padding: 0 24px;
            font-weight: 600;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }
        button:active { transform: scale(0.94); background: #1a4f8b; }
        button.secondary { background: #2d3748; }
        button.secondary:active { background: #1a202c; }

        .microphone-indicator {
            display: flex;
            justify-content: center;
            gap: 14px;
            font-size: 13px;
            color: #a0aec0;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        .microphone-indicator span { display: flex; align-items: center; gap: 4px; }
        .dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 12px;
            background: #4a5568;
            transition: 0.15s;
        }
        .dot.active { background: #48bb78; box-shadow: 0 0 10px #48bb78; }
        .dot.speaking { background: #ecc94b; box-shadow: 0 0 10px #ecc94b; }
        #volumeMeter {
            width: 80px;
            height: 8px;
            background: #2d3748;
            border-radius: 8px;
            overflow: hidden;
            display: inline-block;
            vertical-align: middle;
        }
        #volumeFill {
            height: 100%;
            width: 0%;
            background: #48bb78;
            transition: width 0.05s;
        }
    </style>
</head>
<body>
<div class="card">
    <h1>
        <span>🐱 Крипте-Котик v2</span>
        <small>фикс приёма</small>
    </h1>

    <div class="status-bar">
        <span id="statusText">🟡 Инициализация...</span>
        <span id="peerId">📡 ID: <span id="deviceIdDisplay">—</span></span>
    </div>

    <div id="chatlog"></div>

    <div class="input-area">
        <input type="text" id="textInput" placeholder="Введи сообщение..." maxlength="30">
        <button id="sendBtn">📤 Отправить</button>
    </div>

    <div style="display: flex; gap: 10px; margin-bottom: 6px;">
        <button id="clearBtn" class="secondary" style="flex:1;">🗑 Очистить</button>
        <button id="testBtn" class="secondary" style="flex:1;">🔊 Тест связи</button>
    </div>

    <div class="microphone-indicator">
        <span>🎤 <span class="dot" id="micDot"></span> микрофон</span>
        <span>🔊 <span class="dot" id="speakerDot"></span> динамик</span>
        <span>📊 громкость: <span id="volumeMeter"><span id="volumeFill"></span></span></span>
        <span id="lastSignal" style="font-size:12px;">⏱️ —</span>
    </div>
</div>

<script>
    (function(){
        // ---------- НАСТРОЙКИ ----------
        const ALPHABET = " АБВГДЕЁЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯ";
        const BASE_PAUSE = 150;   // +50 мс на букву
        const PAUSE_STEP = 50;
        const MAX_PAUSE = BASE_PAUSE + (ALPHABET.length - 1) * PAUSE_STEP;
        const END_PAUSE = MAX_PAUSE + 400; // 2050 мс
        const CLICK_DURATION = 60; // чуть длиннее

        // DOM
        const chatlog = document.getElementById('chatlog');
        const textInput = document.getElementById('textInput');
        const sendBtn = document.getElementById('sendBtn');
        const clearBtn = document.getElementById('clearBtn');
        const testBtn = document.getElementById('testBtn');
        const statusText = document.getElementById('statusText');
        const deviceIdDisplay = document.getElementById('deviceIdDisplay');
        const micDot = document.getElementById('micDot');
        const speakerDot = document.getElementById('speakerDot');
        const lastSignal = document.getElementById('lastSignal');
        const volumeFill = document.getElementById('volumeFill');

        // Глобальные
        let audioContext = null;
        let isSending = false;
        let receiveBuffer = [];
        let receiveTimer = null;
        let lastClickTime = 0;
        let deviceId = '';

        // ---------- AUDIO ----------
        function initAudio() {
            if (audioContext) return;
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                deviceId = Math.random().toString(36).substring(2, 6).toUpperCase();
                deviceIdDisplay.textContent = deviceId;
                statusText.innerHTML = '🟢 Готов';
                startMicrophone();
            } catch(e) {
                statusText.innerHTML = '🔴 Ошибка Web Audio';
            }
        }

        // ---------- МИКРОФОН (всегда слушает) ----------
        let mediaStream = null;
        let analyser = null;
        let dataArray = null;
        let micActive = false;

        function startMicrophone() {
            navigator.mediaDevices.getUserMedia({ audio: true, video: false })
                .then(stream => {
                    mediaStream = stream;
                    const source = audioContext.createMediaStreamSource(stream);
                    analyser = audioContext.createAnalyser();
                    analyser.fftSize = 512;
                    analyser.smoothingTimeConstant = 0.2;
                    source.connect(analyser);
                    dataArray = new Uint8Array(analyser.fftSize);
                    micActive = true;
                    micDot.className = 'dot active';
                    statusText.innerHTML = '🟢 Микрофон активен';
                    listenLoop();
                })
                .catch(err => {
                    micDot.className = 'dot';
                    statusText.innerHTML = '🔴 Нет доступа к микрофону';
                });
        }

        // ---------- ОБНАРУЖЕНИЕ ЩЕЛЧКОВ ----------
        let listening = false;
        const THRESHOLD = 65; // чуть ниже для чувствительности

        function listenLoop() {
            if (!analyser || !micActive) return;
            listening = true;

            function check() {
                if (!listening || !analyser) return;
                analyser.getByteTimeDomainData(dataArray);
                let sum = 0;
                for (let i = 0; i < dataArray.length; i++) {
                    const val = (dataArray[i] - 128) / 128;
                    sum += val * val;
                }
                const rms = Math.sqrt(sum / dataArray.length) * 100;
                // Показываем громкость
                const percent = Math.min(rms * 1.5, 100);
                volumeFill.style.width = percent + '%';
                if (percent > 20) {
                    volumeFill.style.background = '#ecc94b';
                } else {
                    volumeFill.style.background = '#48bb78';
                }

                const now = performance.now();

                // Если громкость выше порога — это щелчок
                if (rms > THRESHOLD) {
                    // Игнорируем, если это наш собственный сигнал (но проверяем по времени)
                    const timeSinceLastSend = now - lastSendTime;
                    if (timeSinceLastSend < 150) {
                        // Скорее всего эхо — игнорируем
                        requestAnimationFrame(check);
                        return;
                    }
                    // Обрабатываем щелчок
                    handleClick(now);
                }

                requestAnimationFrame(check);
            }
            check();
        }

        // ---------- ОБРАБОТКА ЩЕЛЧКА ----------
        let lastClickReceived = 0;

        function handleClick(now) {
            if (now - lastClickReceived < 70) return; // антидребезг
            lastClickReceived = now;

            // Логируем в консоль для отладки
            console.log('Щелчок в', now);

            if (lastClickTime === 0) {
                // Начало сообщения
                lastClickTime = now;
                receiveBuffer = [];
                if (receiveTimer) {
                    clearTimeout(receiveTimer);
                    receiveTimer = null;
                }
                receiveTimer = setTimeout(() => {
                    finishReceiving();
                }, END_PAUSE);
                return;
            }

            const pause = now - lastClickTime;
            lastClickTime = now;

            if (pause > END_PAUSE) {
                finishReceiving();
                return;
            }

            receiveBuffer.push(pause);
            lastSignal.textContent = `⏱️ ${pause.toFixed(0)}мс`;

            if (receiveTimer) {
                clearTimeout(receiveTimer);
                receiveTimer = setTimeout(() => {
                    finishReceiving();
                }, END_PAUSE);
            }
        }

        // ---------- ЗАВЕРШЕНИЕ ПРИЁМА ----------
        function finishReceiving() {
            if (receiveTimer) {
                clearTimeout(receiveTimer);
                receiveTimer = null;
            }
            if (receiveBuffer.length === 0) {
                isReceiving = false;
                lastClickTime = 0;
                return;
            }

            let message = '';
            for (let p of receiveBuffer) {
                let index = Math.round((p - BASE_PAUSE) / PAUSE_STEP);
                if (index < 0) index = 0;
                if (index >= ALPHABET.length) index = ALPHABET.length - 1;
                message += ALPHABET[index];
            }

            if (message.trim().length > 0) {
                addMessage(message, 'in');
            }

            isReceiving = false;
            lastClickTime = 0;
            receiveBuffer = [];
            lastSignal.textContent = '⏱️ —';
        }

        // ---------- ОТПРАВКА ----------
        let lastSendTime = 0;

        function sendMessage(text) {
            if (isSending) return;
            if (!audioContext) { initAudio(); return; }
            text = text.toUpperCase();
            let filtered = '';
            for (let ch of text) {
                if (ALPHABET.includes(ch)) filtered += ch;
            }
            if (!filtered) {
                addMessage('⚠️ Только кириллица', 'sys');
                return;
            }

            const pauses = [];
            for (let ch of filtered) {
                pauses.push(BASE_PAUSE + ALPHABET.indexOf(ch) * PAUSE_STEP);
            }

            addMessage(filtered, 'out');
            playClicks(pauses);
        }

        // ---------- ВОСПРОИЗВЕДЕНИЕ ----------
        function playClicks(pauses) {
            if (isSending) return;
            isSending = true;
            speakerDot.className = 'dot speaking';
            statusText.innerHTML = '🔊 Передача...';

            let index = 0;

            function playNext() {
                if (index >= pauses.length) {
                    setTimeout(() => finishSend(), END_PAUSE);
                    return;
                }

                // Громкий писк
                playClick(CLICK_DURATION, 1800); // частота 1800 Гц
                lastSendTime = performance.now();

                const delay = pauses[index];
                index++;
                setTimeout(() => {
                    playNext();
                }, delay);
            }

            // Первый щелчок сразу
            playClick(CLICK_DURATION, 1800);
            lastSendTime = performance.now();
            setTimeout(() => {
                index = 1;
                if (pauses.length > 1) {
                    playNext();
                } else {
                    setTimeout(() => finishSend(), END_PAUSE);
                }
            }, pauses[0] || 0);
        }

        function playClick(duration, freq) {
            if (!audioContext) return;
            try {
                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();
                osc.type = 'sine';
                osc.frequency.value = freq || 1500;
                gain.gain.value = 0.8; // громче
                osc.connect(gain);
                gain.connect(audioContext.destination);
                osc.start();
                setTimeout(() => { osc.stop(); }, duration);
            } catch(e) {}
        }

        function finishSend() {
            isSending = false;
            speakerDot.className = 'dot';
            statusText.innerHTML = '🟢 Готов';
        }

        // ---------- ЧАТ ----------
        function addMessage(text, type) {
            const div = document.createElement('div');
            div.className = `msg ${type}`;
            div.textContent = text;
            chatlog.appendChild(div);
            chatlog.scrollTop = chatlog.scrollHeight;
        }
        function addSystemMessage(text) {
            const div = document.createElement('div');
            div.className = 'msg sys';
            div.textContent = text;
            chatlog.appendChild(div);
            chatlog.scrollTop = chatlog.scrollHeight;
        }

        function testConnection() {
            addSystemMessage('🔊 Тест (ПРИВЕТ)');
            sendMessage('ПРИВЕТ');
        }

        // ---------- СОБЫТИЯ ----------
        sendBtn.addEventListener('click', () => {
            const text = textInput.value.trim();
            if (text) { sendMessage(text); textInput.value = ''; }
        });
        textInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendBtn.click(); });
        clearBtn.addEventListener('click', () => { chatlog.innerHTML = ''; });
        testBtn.addEventListener('click', testConnection);

        document.body.addEventListener('click', () => {
            if (!audioContext) {
                initAudio();
                addSystemMessage('🎤 Микрофон активирован');
            }
        });

        window.addEventListener('load', () => {
            addSystemMessage('🐱 Крипте-Котик v2. Нажми на страницу, чтобы включить.');
            addSystemMessage('📢 Говори громко, слушай внимательно!');
        });
    })();
</script>
</body>
</html>
