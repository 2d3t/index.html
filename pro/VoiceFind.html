<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Крипто-поиск · Голосовой Google</title>
    <style>
        /* Минимализм + тёмная крипто-тема */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at 20% 30%, #0b0e14, #030507);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .card {
            max-width: 780px;
            width: 100%;
            background: rgba(12, 16, 24, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 255, 170, 0.2);
            border-radius: 3rem;
            padding: 2.5rem 2rem;
            box-shadow: 0 25px 50px -8px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(0, 255, 170, 0.1) inset, 0 0 30px rgba(0, 255, 170, 0.2);
            transition: box-shadow 0.3s ease;
        }

        .card:hover {
            box-shadow: 0 30px 60px -10px #000, 0 0 0 1px rgba(0, 255, 170, 0.3) inset, 0 0 40px rgba(0, 255, 170, 0.4);
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            margin-bottom: 2rem;
        }

        .logo-icon {
            font-size: 2.4rem;
            filter: drop-shadow(0 0 8px #00ffaa);
        }

        .logo-text {
            font-weight: 600;
            font-size: 1.9rem;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #ffffff, #b0ffe0);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 20px rgba(0, 255, 170, 0.5);
        }

        .search-section {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            margin-bottom: 1.5rem;
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            background: #0b0f16;
            border: 1px solid #1e2a3a;
            border-radius: 60px;
            padding: 0.25rem 0.25rem 0.25rem 1.5rem;
            transition: all 0.2s ease;
            box-shadow: 0 0 0 0 rgba(0, 255, 170, 0);
        }

        .input-wrapper:focus-within {
            border-color: #00ffaa;
            box-shadow: 0 0 0 4px rgba(0, 255, 170, 0.15);
        }

        .input-wrapper input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 1rem 0;
            font-size: 1.2rem;
            color: #f0f4fa;
            outline: none;
            min-width: 0;
        }

        .input-wrapper input::placeholder {
            color: #4a5b6e;
            font-weight: 300;
            letter-spacing: 0.02em;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111a24;
            border: 1px solid #1e2e3e;
            border-radius: 50px;
            padding: 0.9rem 1.8rem;
            font-weight: 500;
            font-size: 1.1rem;
            color: #d0e0f0;
            cursor: pointer;
            transition: all 0.2s ease;
            gap: 0.6rem;
            white-space: nowrap;
            border: 1px solid rgba(0, 255, 170, 0.2);
        }

        .btn:hover {
            background: #16222e;
            border-color: #00ffaa;
            color: #ffffff;
            transform: scale(1.02);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background: linear-gradient(145deg, #003d2e, #002218);
            border: 1px solid #00cc88;
            color: #ccffee;
            box-shadow: 0 0 15px rgba(0, 255, 170, 0.3);
            padding: 1rem 2rem;
            font-size: 1.15rem;
            width: 100%;
            justify-content: center;
        }

        .btn-primary:hover {
            background: linear-gradient(145deg, #005a44, #003b2a);
            border-color: #33ffbb;
            box-shadow: 0 0 25px rgba(0, 255, 170, 0.6);
            color: #ffffff;
        }

        .voice-btn {
            background: #111a24;
            border: 1px solid #2a3e4e;
            border-radius: 50px;
            width: 60px;
            height: 60px;
            padding: 0;
            font-size: 1.8rem;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            cursor: pointer;
            color: #a0b8cc;
            border: 1px solid rgba(0, 255, 170, 0.25);
        }

        .voice-btn:hover {
            background: #182734;
            color: #00ffaa;
            border-color: #00ffaa;
            box-shadow: 0 0 20px rgba(0, 255, 170, 0.3);
        }

        .voice-btn.listening {
            animation: pulse 1.2s infinite;
            background: #003d2e;
            color: #00ffaa;
            border-color: #00ffaa;
            box-shadow: 0 0 30px rgba(0, 255, 170, 0.8);
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(0, 255, 170, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(0, 255, 170, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(0, 255, 170, 0); }
        }

        .status {
            font-size: 0.95rem;
            color: #7b8fa0;
            min-height: 2.2rem;
            padding: 0.5rem 0.2rem 0;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            letter-spacing: 0.01em;
            transition: color 0.2s;
        }

        .status.error {
            color: #ff6b6b;
        }

        .status.success {
            color: #00ffaa;
        }

        .status .indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #4a5b6e;
            margin-right: 0.25rem;
        }

        .status.listening .indicator {
            background: #00ffaa;
            box-shadow: 0 0 12px #00ffaa;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .hint {
            font-size: 0.85rem;
            color: #3f5265;
            margin-top: 1.8rem;
            text-align: center;
            border-top: 1px solid #18222e;
            padding-top: 1.5rem;
            letter-spacing: 0.3px;
        }

        .hint kbd {
            background: #101a24;
            border-radius: 20px;
            padding: 0.2rem 0.8rem;
            font-size: 0.8rem;
            color: #a0c0d0;
            border: 1px solid #2a3e4e;
            margin: 0 0.2rem;
        }

        /* Адаптив */
        @media (max-width: 550px) {
            .card {
                padding: 1.8rem 1.2rem;
                border-radius: 2rem;
            }

            .logo-text {
                font-size: 1.5rem;
            }

            .input-wrapper {
                padding-left: 1rem;
            }

            .input-wrapper input {
                font-size: 1rem;
                padding: 0.8rem 0;
            }

            .voice-btn {
                width: 52px;
                height: 52px;
                font-size: 1.5rem;
            }

            .btn-primary {
                font-size: 1rem;
                padding: 0.9rem 1.2rem;
            }

            .search-section {
                gap: 0.9rem;
            }
        }

        /* Скрываем стандартный крестик в поиске (для Webkit) */
        input[type="search"]::-webkit-search-decoration,
        input[type="search"]::-webkit-search-cancel-button,
        input[type="search"]::-webkit-search-results-button,
        input[type="search"]::-webkit-search-results-decoration {
            display: none;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">
            <span class="logo-icon">⚡</span>
            <span class="logo-text">CRYPTO SEARCH</span>
        </div>

        <div class="search-section">
            <!-- Поле ввода + кнопка голоса -->
            <div class="input-wrapper">
                <input type="search" id="searchInput" placeholder="Спросите голосом или введите запрос..." autocomplete="off" autofocus>
                <button class="voice-btn" id="voiceBtn" title="Голосовой поиск (нажмите и говорите)">🎤</button>
            </div>

            <!-- Кнопка поиска в Google -->
            <button class="btn btn-primary" id="searchBtn">
                <span>🔍</span> Искать в Google
            </button>

            <!-- Статус / обратная связь -->
            <div class="status" id="status">
                <span class="indicator"></span>
                <span id="statusText">Готов к голосовому вводу</span>
            </div>
        </div>

        <div class="hint">
            <kbd>🎤</kbd> нажмите и говорите — запрос появится в строке, затем нажмите <kbd>Искать</kbd><br>
            или просто нажмите <kbd>Enter</kbd> в поле ввода
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // DOM-элементы
            const searchInput = document.getElementById('searchInput');
            const voiceBtn = document.getElementById('voiceBtn');
            const searchBtn = document.getElementById('searchBtn');
            const statusDiv = document.getElementById('status');
            const statusText = document.getElementById('statusText');

            // Проверка поддержки Web Speech API
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

            // Переменные для распознавания
            let recognition = null;
            let isListening = false;

            // ---------- Вспомогательные функции для статуса ----------
            function setStatus(message, type = 'info', listening = false) {
                statusText.textContent = message;

                // Сброс классов
                statusDiv.classList.remove('error', 'success', 'listening');

                if (type === 'error') {
                    statusDiv.classList.add('error');
                } else if (type === 'success') {
                    statusDiv.classList.add('success');
                }

                if (listening) {
                    statusDiv.classList.add('listening');
                }
            }

            // ---------- Поиск в Google ----------
            function performGoogleSearch(query) {
                const trimmed = query.trim();
                if (!trimmed) {
                    setStatus('Введите запрос или используйте голос', 'error');
                    searchInput.focus();
                    return;
                }

                const googleUrl = `https://www.google.com/search?q=${encodeURIComponent(trimmed)}`;
                window.open(googleUrl, '_blank', 'noopener,noreferrer');

                setStatus(`Запрос отправлен: "${trimmed}"`, 'success');
            }

            // ---------- Инициализация распознавания речи ----------
            function initSpeechRecognition() {
                if (!SpeechRecognition) {
                    setStatus('Ваш браузер не поддерживает голосовой ввод 😕 (попробуйте Chrome/Edge/Safari)', 'error');
                    voiceBtn.disabled = true;
                    voiceBtn.style.opacity = '0.5';
                    voiceBtn.style.cursor = 'not-allowed';
                    return null;
                }

                const rec = new SpeechRecognition();
                rec.lang = 'ru-RU';           // русский язык по умолчанию
                rec.continuous = false;        // одна фраза за раз
                rec.interimResults = false;    // только финальный результат
                rec.maxAlternatives = 1;

                // ---------- Обработчики событий ----------
                rec.onstart = function() {
                    isListening = true;
                    voiceBtn.classList.add('listening');
                    setStatus('🎧 Слушаю... Говорите запрос', 'info', true);
                };

                rec.onresult = function(event) {
                    const transcript = event.results[0][0].transcript;
                    if (transcript) {
                        searchInput.value = transcript;
                        setStatus(`Распознано: "${transcript}"`, 'success');
                        // Небольшая вибрация для UX (если поддерживается)
                        if (navigator.vibrate) navigator.vibrate(30);
                    } else {
                        setStatus('Не удалось распознать речь, попробуйте ещё раз', 'error');
                    }
                };

                rec.onerror = function(event) {
                    console.warn('Speech recognition error:', event.error);

                    let errorMessage = 'Ошибка распознавания';
                    if (event.error === 'no-speech') {
                        errorMessage = 'Ничего не услышал. Попробуйте снова.';
                    } else if (event.error === 'audio-capture') {
                        errorMessage = 'Нет доступа к микрофону. Проверьте разрешения.';
                    } else if (event.error === 'not-allowed') {
                        errorMessage = 'Доступ к микрофону запрещён. Разрешите в настройках браузера.';
                    } else if (event.error === 'network') {
                        errorMessage = 'Ошибка сети. Проверьте подключение.';
                    } else if (event.error === 'aborted') {
                        errorMessage = 'Запись прервана.';
                    }

                    setStatus(errorMessage, 'error');
                    resetListeningState();
                };

                rec.onend = function() {
                    resetListeningState();
                    // Если запрос уже есть в поле — можно предложить поиск, но не навязчиво
                    if (searchInput.value.trim() && !statusDiv.classList.contains('error')) {
                        setStatus(`Готово: "${searchInput.value.trim()}". Нажмите "Искать в Google"`, 'info');
                    } else if (!statusDiv.classList.contains('error')) {
                        setStatus('Готов к голосовому вводу', 'info');
                    }
                };

                return rec;
            }

            function resetListeningState() {
                isListening = false;
                voiceBtn.classList.remove('listening');
                statusDiv.classList.remove('listening');
                // Если статус не содержит ошибки — вернём нейтральный
                if (!statusDiv.classList.contains('error') && !statusDiv.classList.contains('success')) {
                    setStatus('Готов к голосовому вводу', 'info');
                }
            }

            // ---------- Запуск / остановка прослушивания ----------
            function startListening() {
                if (!recognition) {
                    // Пробуем инициализировать ещё раз (на случай если браузер стал поддерживать)
                    recognition = initSpeechRecognition();
                    if (!recognition) return;
                }

                if (isListening) {
                    // Если уже слушаем — останавливаем
                    recognition.stop();
                    return;
                }

                // Сбрасываем статус ошибки перед новым запуском
                statusDiv.classList.remove('error', 'success');
                setStatus('Инициализация микрофона...', 'info');

                try {
                    recognition.start();
                } catch (err) {
                    console.error('Ошибка запуска распознавания:', err);
                    // Если recognition уже запущен — принудительно остановим и попробуем снова
                    if (err.name === 'InvalidStateError') {
                        recognition.stop();
                        setTimeout(() => {
                            try {
                                recognition.start();
                            } catch (e) {
                                setStatus('Не удалось запустить микрофон. Обновите страницу.', 'error');
                            }
                        }, 200);
                    } else {
                        setStatus('Ошибка доступа к микрофону. Проверьте разрешения.', 'error');
                    }
                }
            }

            // ---------- Обработчики UI ----------
            // Кнопка "Искать в Google"
            searchBtn.addEventListener('click', function() {
                performGoogleSearch(searchInput.value);
            });

            // Нажатие Enter в поле ввода
            searchInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    performGoogleSearch(searchInput.value);
                }
            });

            // Клик по кнопке микрофона
            voiceBtn.addEventListener('click', function(e) {
                e.preventDefault();
                startListening();
            });

            // Если пользователь начал печатать — сбрасываем возможные ошибки
            searchInput.addEventListener('input', function() {
                if (statusDiv.classList.contains('error')) {
                    statusDiv.classList.remove('error');
                    setStatus('Готов к вводу', 'info');
                }
            });

            // ---------- Инициализация при загрузке ----------
            // Пытаемся создать распознавание сразу, чтобы проверить поддержку
            recognition = initSpeechRecognition();

            // Если поддержка есть — показываем приветствие
            if (recognition) {
                setStatus('Нажмите 🎤 и говорите запрос', 'info');
            }

            // Фокус на поле ввода (для удобства)
            searchInput.focus();
        })();
    </script>
</body>
</html>
