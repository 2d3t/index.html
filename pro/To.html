<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Генератор QR-кодов</title>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>

<style>
    * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    body {
        margin: 0;
        background: #f2f3f5;
        font-family: Arial, sans-serif;
        color: #222;
    }

    .app {
        width: 100%;
        max-width: 600px;
        margin: 0 auto;
        padding: 15px;
    }

    h1 {
        text-align: center;
        margin: 5px 0 15px;
        font-size: 24px;
    }

    textarea {
        width: 100%;
        min-height: 180px;
        resize: vertical;
        border: 1px solid #bbb;
        border-radius: 12px;
        padding: 14px;
        font-size: 16px;
        line-height: 1.45;
        background: white;
        outline: none;
    }

    textarea:focus {
        border-color: #555;
    }

    .buttons {
        display: flex;
        gap: 8px;
        margin-top: 10px;
    }

    button {
        flex: 1;
        border: 0;
        border-radius: 10px;
        padding: 14px 10px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }

    .generate {
        background: #111;
        color: white;
    }

    .clear {
        background: #ddd;
        color: #222;
    }

    .info {
        margin-top: 12px;
        padding: 10px;
        background: white;
        border-radius: 10px;
        font-size: 14px;
        line-height: 1.5;
    }

    .qr-list {
        margin-top: 15px;
    }

    .qr-item {
        background: white;
        border-radius: 14px;
        padding: 15px;
        margin-bottom: 15px;
        text-align: center;
        box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .qr-title {
        font-size: 18px;
        font-weight: bold;
        margin-bottom: 12px;
    }

    .qr-container {
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
    }

    .qr-container img {
        display: block;
        width: min(100%, 420px);
        height: auto;
        image-rendering: pixelated;
    }

    .qr-info {
        margin-top: 10px;
        color: #666;
        font-size: 13px;
        word-break: break-word;
    }

    .download {
        margin-top: 10px;
        width: 100%;
        background: #e8e8e8;
        color: #222;
    }

    .warning {
        color: #a33;
        font-weight: bold;
    }

    .empty {
        text-align: center;
        color: #777;
        padding: 25px 5px;
    }
</style>
</head>

<body>

<div class="app">

    <h1>QR Генератор</h1>

    <textarea
        id="text"
        placeholder="Введите или вставьте текст здесь..."></textarea>

    <div class="buttons">
        <button class="generate" onclick="generateQR()">Создать QR</button>
        <button class="clear" onclick="clearAll()">Очистить</button>
    </div>

    <div class="info" id="info">
        Введите текст и нажмите «Создать QR».
    </div>

    <div class="qr-list" id="qrList">
        <div class="empty">
            QR-коды появятся здесь
        </div>
    </div>

</div>

<script>

/*
    ============================================================
    ОСНОВНЫЕ НАСТРОЙКИ
    ============================================================
*/

/*
    Уровень коррекции ошибок:

    L = примерно 7%
    M = примерно 15%
    Q = примерно 25%
    H = примерно 30%

    M — хороший компромисс для обычного использования.
*/
const ERROR_LEVEL = 'M';


/*
    Максимальный размер QR-кода.

    QR-код имеет версии от 1 до 40.
    0 означает: библиотека сама выбирает максимальную
    подходящую версию.
*/
const QR_TYPE = 0;


/*
    ============================================================
    ПОДСЧЁТ БАЙТОВ
    ============================================================

    Это важно.

    Один русский символ занимает несколько байт в UTF-8.
    Также считаются:
    - пробелы
    - табы
    - переносы строк
    - emoji
    - zero-width символы
    - другие Unicode-символы

    Поэтому нельзя просто считать text.length.
*/

function utf8Length(text) {
    return new TextEncoder().encode(text).length;
}


/*
    Разбиваем текст не по UTF-16 кодовым единицам,
    а по Unicode-символам.

    Благодаря этому emoji и другие символы,
    состоящие из surrogate pair, не будут разорваны.
*/
function splitUnicode(text) {
    return Array.from(text);
}


/*
    ============================================================
    ПРОВЕРКА: ПОМЕСТИТСЯ ЛИ ТЕКСТ В QR
    ============================================================
*/

function canFit(text) {

    try {

        const qr = qrcode(QR_TYPE, ERROR_LEVEL);

        /*
            addData() работает с реальным содержимым текста.
            Никакие символы здесь не удаляются и не заменяются.
        */
        qr.addData(text);

        qr.make();

        return true;

    } catch (e) {

        return false;

    }
}


/*
    ============================================================
    ПОИСК МАКСИМАЛЬНОГО КУСКА
    ============================================================

    Используется бинарный поиск.

    Например:

    Большой текст
       ↓
    пробуем половину
       ↓
    помещается?
       ↓
    увеличиваем / уменьшаем
       ↓
    находим максимально возможный кусок
*/

function getLargestChunk(chars, startIndex) {

    let left = 1;
    let right = chars.length - startIndex;

    let best = 0;

    while (left <= right) {

        const middle = Math.floor((left + right) / 2);

        const candidate =
            chars.slice(
                startIndex,
                startIndex + middle
            ).join('');

        if (canFit(candidate)) {

            best = middle;
            left = middle + 1;

        } else {

            right = middle - 1;

        }
    }

    return best;
}


/*
    ============================================================
    РАЗБИЕНИЕ ТЕКСТА НА QR
    ============================================================
*/

function splitTextForQR(text) {

    const chars = splitUnicode(text);

    const parts = [];

    let position = 0;

    while (position < chars.length) {

        const count = getLargestChunk(chars, position);

        /*
            Теоретически такого быть не должно,
            если библиотека способна создать хотя бы
            QR с одним символом.
        */
        if (count <= 0) {

            throw new Error(
                "Не удалось поместить символ в QR-код."
            );
        }

        const part =
            chars.slice(
                position,
                position + count
            ).join('');

        parts.push(part);

        position += count;
    }

    return parts;
}


/*
    ============================================================
    СОЗДАНИЕ PNG
    ============================================================
*/

function createQRImage(text) {

    const qr = qrcode(QR_TYPE, ERROR_LEVEL);

    qr.addData(text);
    qr.make();

    /*
        cellSize = размер одного квадратика QR
        margin = белое поле вокруг
    */

    return qr.createDataURL(7, 12);
}


/*
    ============================================================
    ГЕНЕРАЦИЯ ВСЕХ QR
    ============================================================
*/

function generateQR() {

    const text = document.getElementById('text').value;

    const list = document.getElementById('qrList');
    const info = document.getElementById('info');

    list.innerHTML = '';

    if (text.length === 0) {

        info.innerHTML =
            'Введите текст и нажмите «Создать QR».';

        list.innerHTML =
            '<div class="empty">Нет текста</div>';

        return;
    }

    try {

        /*
            Получаем реальные байты UTF-8.
        */
        const bytes = utf8Length(text);

        /*
            Делим текст на максимально возможные части.
        */
        const parts = splitTextForQR(text);

        info.innerHTML =
            'Символов: <b>' +
            text.length +
            '</b><br>' +

            'Байт UTF-8: <b>' +
            bytes +
            '</b><br>' +

            'QR-кодов: <b>' +
            parts.length +
            '</b>';

        /*
            Создаём каждый QR.
        */

        parts.forEach((part, index) => {

            const item =
                document.createElement('div');

            item.className = 'qr-item';

            const title =
                document.createElement('div');

            title.className = 'qr-title';

            title.textContent =
                'QR-код ' +
                (index + 1) +
                ' / ' +
                parts.length;

            item.appendChild(title);


            /*
                Сам QR
            */

            const qrContainer =
                document.createElement('div');

            qrContainer.className =
                'qr-container';

            const img =
                document.createElement('img');

            img.src =
                createQRImage(part);

            img.alt =
                'QR-код ' + (index + 1);

            qrContainer.appendChild(img);

            item.appendChild(qrContainer);


            /*
                Информация о текущей части
            */

            const qrInfo =
                document.createElement('div');

            qrInfo.className = 'qr-info';

            qrInfo.innerHTML =
                'Символов: <b>' +
                part.length +
                '</b> · ' +

                'UTF-8: <b>' +
                utf8Length(part) +
                ' байт</b>';

            item.appendChild(qrInfo);


            /*
                Кнопка скачивания
            */

            const download =
                document.createElement('button');

            download.className =
                'download';

            download.textContent =
                'Скачать PNG';

            download.onclick =
                function () {

                    downloadImage(
                        img.src,
                        'QR_' +
                        String(index + 1) +
                        '_of_' +
                        parts.length +
                        '.png'
                    );

                };

            item.appendChild(download);


            list.appendChild(item);

        });

        /*
            Прокручиваем страницу к QR-кодам.
        */

        setTimeout(() => {

            list.scrollIntoView({
                behavior: 'smooth',
                block: 'start'
            });

        }, 100);

    } catch (error) {

        console.error(error);

        info.innerHTML =
            '<span class="warning">' +
            'Ошибка при создании QR-кодов: ' +
            error.message +
            '</span>';

    }
}


/*
    ============================================================
    СКАЧИВАНИЕ PNG
    ============================================================
*/

function downloadImage(dataURL, filename) {

    const a =
        document.createElement('a');

    a.href = dataURL;

    a.download = filename;

    document.body.appendChild(a);

    a.click();

    document.body.removeChild(a);
}


/*
    ============================================================
    ОЧИСТКА
    ============================================================
*/

function clearAll() {

    document.getElementById('text').value = '';

    document.getElementById('info').innerHTML =
        'Введите текст и нажмите «Создать QR».';

    document.getElementById('qrList').innerHTML =
        '<div class="empty">' +
        'QR-коды появятся здесь' +
        '</div>';
}


/*
    ============================================================
    CTRL + ENTER / ENTER
    ============================================================
*/

document.getElementById('text').addEventListener(
    'keydown',
    function(event) {

        /*
            На компьютере Ctrl+Enter создаёт QR.
            На телефоне Enter остаётся обычным переносом строки.
        */

        if (event.ctrlKey && event.key === 'Enter') {

            event.preventDefault();

            generateQR();
        }
    }
);

</script>

</body>
</html>
