<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ультразвуковой модем — улучшенный синхронизация</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #e0e0e0; padding: 20px; text-align: center; }
        button { background: #00adb5; border: none; color: white; padding: 12px 24px; font-size: 16px; border-radius: 5px; cursor: pointer; margin: 10px; transition: 0.2s; }
        button:hover { background: #008a92; }
        button:active { background: #007a80; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        input { padding: 10px; font-size: 16px; width: 80%; max-width: 300px; border-radius: 5px; border: 1px solid #333; background: #222; color: white; }
        .box { background: #1e1e1e; padding: 15px; border-radius: 8px; margin: 20px auto; max-width: 500px; border: 1px solid #333; }
        #log { font-family: monospace; color: #888; font-size: 12px; max-height: 150px; overflow-y: auto; text-align: left; background: #000; padding: 10px; border-radius: 5px; }
        #output { font-size: 28px; font-weight: bold; color: #00adb5; margin-top: 10px; min-height: 45px; letter-spacing: 2px; }
        .status { color: #aaa; font-size: 13px; margin-top: 5px; }
        .freq-badge { display: inline-block; background: #2a2a2a; padding: 2px 10px; border-radius: 12px; margin: 2px; font-size: 11px; color: #00adb5; }
        #progress { width: 100%; height: 4px; background: #333; border-radius: 2px; margin: 10px 0; overflow: hidden; }
        #progress-bar { height: 100%; width: 0%; background: #00adb5; transition: width 0.1s; }
        .synced { color: #4caf50; font-weight: bold; }
        .waiting { color: #ff9800; }
    </style>
</head>
<body>

    <h1>🔊 Ultrasonic Modem v2</h1>
    <button id="initBtn">🎤 Включить звук / микрофон</button>

    <div class="box">
        <h3>📤 Передатчик (Tx)</h3>
        <input type="text" id="textInput" value="HELLO WORLD" placeholder="Текст (A-Z, пробел)">
        <br>
        <button id="sendBtn" disabled>📡 Отправить</button>
        <div id="progress"><div id="progress-bar"></div></div>
        <div class="status">
            <span>Синхросигнал: 16.5 кГц (100 мс) + 19.5 кГц (100 мс)</span><br>
            <span>Тоны: 17.0–20.5 кГц (120 мс) · Пауза: 80 мс · Защита: 60 мс</span>
        </div>
    </div>

    <div class="box">
        <h3>📥 Приемник (Rx)</h3>
        <div>Статус: <span id="rxStatus" class="waiting">ожидание сигнала</span></div>
        <div>Получено:</div>
        <div id="output">⏳ ожидание...</div>
    </div>

    <div class="box">
        <h3>📋 Технический лог</h3>
        <div id="log"></div>
    </div>

<script>
    // ============================================================
    //  НАСТРОЙКИ С УВЕЛИЧЕННЫМИ ИНТЕРВАЛАМИ
    // ============================================================
    const ALPHABET = " ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    const BASE_FREQ = 17000;          // 17 кГц — буква 'A'
    const FREQ_STEP = 130;            // шаг 130 Гц на букву
    const TONE_DURATION = 0.12;       // 120 мс — длительность тона
    const SILENCE_GAP = 0.08;         // 80 мс — пауза между тонами
    const GUARD_INTERVAL = 0.06;      // 60 мс — дополнительная защита

    // Время на один символ (тон + пауза + защита)
    const SYMBOL_TIME = TONE_DURATION + SILENCE_GAP + GUARD_INTERVAL;

    // Частоты синхронизации
    const SYNC_FREQ_1 = 16500;        // первый синхросигнал
    const SYNC_FREQ_2 = 19500;        // второй синхросигнал
    const SYNC_DURATION = 0.10;       // 100 мс каждый

    let audioCtx = null;
    let analyser = null;
    let isListening = false;
    let isSending = false;

    // ---- Логирование ----
    function log(msg) {
        const logDiv = document.getElementById('log');
        logDiv.innerHTML += msg + '<br>';
        logDiv.scrollTop = logDiv.scrollHeight;
    }

    // ---- Прогресс-бар ----
    function setProgress(pct) {
        document.getElementById('progress-bar').style.width = Math.min(100, pct) + '%';
    }

    // ---- Статус приемника ----
    function setRxStatus(text, isSynced = false) {
        const el = document.getElementById('rxStatus');
        el.textContent = text;
        el.className = isSynced ? 'synced' : 'waiting';
    }

    // ---- Инициализация ----
    document.getElementById('initBtn').addEventListener('click', async () => {
        if (audioCtx) return;
        try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            document.getElementById('sendBtn').disabled = false;
            document.getElementById('initBtn').innerText = "✅ Звук готов";
            document.getElementById('initBtn').style.background = "#28a745";
            await initReceiver();
            log("🔊 Аудио система активирована");
        } catch (e) {
            alert("Ошибка: " + e.message);
            log("❌ Ошибка инициализации: " + e.message);
        }
    });

    // ============================================================
    //  ПЕРЕДАТЧИК
    // ============================================================
    function playTone(frequency, startTime, duration, volume = 0.7) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(frequency, startTime);

        // Плавное включение/выключение
        gain.gain.setValueAtTime(0, startTime);
        gain.gain.linearRampToValueAtTime(volume, startTime + 0.008);
        gain.gain.setValueAtTime(volume, startTime + duration - 0.008);
        gain.gain.linearRampToValueAtTime(0, startTime + duration);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(startTime);
        osc.stop(startTime + duration);
    }

    function getFrequency(char) {
        const idx = ALPHABET.indexOf(char);
        if (idx === -1) return null;
        return BASE_FREQ + (idx * FREQ_STEP);
    }

    document.getElementById('sendBtn').addEventListener('click', () => {
        if (isSending) return;
        const text = document.getElementById('textInput').value.toUpperCase().trim();
        if (!text) {
            log("⚠️ Введите текст");
            return;
        }

        isSending = true;
        document.getElementById('sendBtn').disabled = true;
        document.getElementById('sendBtn').innerText = "⏳ Передача...";
        setProgress(0);

        log(`📤 Начало передачи: "${text}" (${text.length} символов)`);

        let startTime = audioCtx.currentTime + 0.2;
        const totalDuration = text.length * SYMBOL_TIME + 0.8;

        // ============================================
        //  СИНХРОНИЗАЦИОННАЯ ПОСЫЛКА (преамбула)
        // ============================================
        // 1-й синхротон: 16.5 кГц
        playTone(SYNC_FREQ_1, startTime, SYNC_DURATION);
        log(`[Tx] 🔵 СИНХРО-1: ${SYNC_FREQ_1/1000}кГц в ${startTime.toFixed(3)}`);
        startTime += SYNC_DURATION + 0.05; // пауза 50 мс

        // 2-й синхротон: 19.5 кГц
        playTone(SYNC_FREQ_2, startTime, SYNC_DURATION);
        log(`[Tx] 🔵 СИНХРО-2: ${SYNC_FREQ_2/1000}кГц в ${startTime.toFixed(3)}`);
        startTime += SYNC_DURATION + 0.15; // пауза 150 мс перед данными

        // ============================================
        //  ПЕРЕДАЧА ДАННЫХ
        // ============================================
        for (let i = 0; i < text.length; i++) {
            const char = text[i];
            const freq = getFrequency(char);
            if (freq === null) {
                log(`⚠️ Символ '${char}' пропущен`);
                startTime += SYMBOL_TIME;
                continue;
            }

            const toneStart = startTime;
            playTone(freq, toneStart, TONE_DURATION);

            const freqKHz = (freq / 1000).toFixed(2);
            log(`[Tx] '${char}' → ${freqKHz}кГц в ${toneStart.toFixed(3)}`);

            startTime += SYMBOL_TIME;
            setProgress(((i + 1) / text.length) * 100);
        }

        // ============================================
        //  ЗАВЕРШАЮЩИЙ МАРКЕР (опционально)
        // ============================================
        playTone(SYNC_FREQ_2 + 200, startTime, 0.06);
        log(`[Tx] 🔴 Финиш в ${startTime.toFixed(3)}`);

        setTimeout(() => {
            isSending = false;
            document.getElementById('sendBtn').disabled = false;
            document.getElementById('sendBtn').innerText = "📡 Отправить";
            setProgress(0);
            log("✅ Передача завершена");
        }, (totalDuration + 0.5) * 1000);
    });

    // ============================================================
    //  ПРИЕМНИК
    // ============================================================
    async function initReceiver() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                audio: {
                    echoCancellation: false,
                    noiseSuppression: false,
                    autoGainControl: false
                }
            });

            const source = audioCtx.createMediaStreamSource(stream);
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 4096;
            analyser.smoothingTimeConstant = 0.85;
            source.connect(analyser);

            isListening = true;
            log("[Rx] 🎤 Микрофон активен");
            log(`[Rx] Разрешение: ~${(audioCtx.sampleRate / analyser.fftSize).toFixed(1)} Гц/бин`);

            detectTones();
        } catch (err) {
            log("[Rx] ❌ Ошибка микрофона: " + err);
            setRxStatus("❌ ошибка микрофона");
        }
    }

    // ============================================================
    //  ДЕТЕКТОР С УЛУЧШЕННОЙ СИНХРОНИЗАЦИЕЙ
    // ============================================================
    let lastDetectedTime = 0;
    let decodingBuffer = "";
    let isReceiving = false;
    let syncDetected = false;
    let receiveTimeout = null;
    let symbolCount = 0;

    // Допуски
    const FREQ_TOLERANCE = 70; // Гц
    const MIN_SIGNAL = 28;

    function detectTones() {
        if (!isListening) return;
        requestAnimationFrame(detectTones);

        const bufferLength = analyser.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);
        analyser.getByteFrequencyData(dataArray);

        const sampleRate = audioCtx.sampleRate;
        const fftSize = analyser.fftSize;
        const now = audioCtx.currentTime;

        // --- Находим доминирующую частоту ---
        let maxPower = 0;
        let maxIndex = 0;
        for (let i = 0; i < bufferLength; i++) {
            if (dataArray[i] > maxPower) {
                maxPower = dataArray[i];
                maxIndex = i;
            }
        }

        if (maxPower < MIN_SIGNAL) {
            // Таймаут приема
            if (isReceiving && (now - lastDetectedTime > 2.0)) {
                isReceiving = false;
                syncDetected = false;
                if (decodingBuffer.length > 0) {
                    log(`[Rx] ⏹️ Таймаут. Получено: "${decodingBuffer}"`);
                    document.getElementById('output').innerText = decodingBuffer;
                }
                decodingBuffer = "";
                setRxStatus("ожидание сигнала", false);
            }
            return;
        }

        const freq = (maxIndex * sampleRate) / fftSize;
        const freqKHz = (freq / 1000).toFixed(2);

        // ============================================
        //  ОБНАРУЖЕНИЕ СИНХРОСИГНАЛА
        // ============================================
        if (!syncDetected) {
            // Ищем первый синхротон (16.5 кГц)
            if (Math.abs(freq - SYNC_FREQ_1) < FREQ_TOLERANCE && maxPower > 35) {
                log(`[Rx] 🔵 СИНХРО-1 обнаружен: ${freqKHz}кГц (${maxPower})`);
                syncDetected = true;
                // Ждем второй синхротон с небольшой задержкой
                setTimeout(() => {
                    if (!syncDetected) {
                        syncDetected = false;
                        log("[Rx] ⚠️ Таймаут ожидания СИНХРО-2");
                        setRxStatus("ошибка синхронизации", false);
                    }
                }, 300);
                return;
            }

            // Если нашли второй без первого — игнорируем
            if (Math.abs(freq - SYNC_FREQ_2) < FREQ_TOLERANCE) {
                // Может быть просто шум
                return;
            }
            return;
        }

        // ============================================
        //  ПОИСК ВТОРОГО СИНХРОСИГНАЛА
        // ============================================
        if (Math.abs(freq - SYNC_FREQ_2) < FREQ_TOLERANCE && maxPower > 35) {
            log(`[Rx] 🔵 СИНХРО-2 обнаружен: ${freqKHz}кГц (${maxPower})`);
            // Начинаем прием
            isReceiving = true;
            decodingBuffer = "";
            symbolCount = 0;
            document.getElementById('output').innerText = "";
            setRxStatus("🔴 прием данных...", true);
            lastDetectedTime = now;

            // Сбрасываем флаг синхронизации, чтобы не ловить повторно
            syncDetected = false;
            return;
        }

        // ============================================
        //  ДЕКОДИРОВАНИЕ СИМВОЛОВ
        // ============================================
        if (isReceiving && maxPower > 30) {
            // Защита от множественных срабатываний на одном тоне
            if (now - lastDetectedTime < SYMBOL_TIME * 0.4) {
                return;
            }

            // Проверяем, не финишный ли это маркер
            if (Math.abs(freq - (SYNC_FREQ_2 + 200)) < FREQ_TOLERANCE) {
                log(`[Rx] 🔴 ФИНИШ обнаружен: ${freqKHz}кГц`);
                isReceiving = false;
                if (decodingBuffer.length > 0) {
                    document.getElementById('output').innerText = decodingBuffer;
                    log(`[Rx] ✅ ИТОГ: "${decodingBuffer}" (${decodingBuffer.length} символов)`);
                    setRxStatus("✅ прием завершен", true);
                }
                lastDetectedTime = now;
                return;
            }

            // Ищем ближайший символ по частоте
            let bestChar = null;
            let bestDiff = Infinity;

            for (let i = 0; i < ALPHABET.length; i++) {
                const targetFreq = BASE_FREQ + (i * FREQ_STEP);
                const diff = Math.abs(freq - targetFreq);
                if (diff < bestDiff) {
                    bestDiff = diff;
                    bestChar = ALPHABET[i];
                }
            }

            if (bestDiff < FREQ_TOLERANCE && bestChar !== null) {
                log(`[Rx] 🎵 '${bestChar}' (${freqKHz}кГц, погр.${bestDiff.toFixed(0)}Гц)`);
                decodingBuffer += bestChar;
                document.getElementById('output').innerText = decodingBuffer;
                symbolCount++;
                lastDetectedTime = now;
            } else {
                // Неизвестная частота в диапазоне ультразвука
                if (freq > 16000 && freq < 22000) {
                    log(`[Rx] ❓ Неизвестный тон: ${freqKHz}кГц (${maxPower})`);
                    // Возможно, это синхросигнал, который мы пропустили
                    if (Math.abs(freq - SYNC_FREQ_1) < FREQ_TOLERANCE ||
                        Math.abs(freq - SYNC_FREQ_2) < FREQ_TOLERANCE) {
                        log("[Rx] 🔄 Обнаружен синхросигнал во время приема — сброс");
                        isReceiving = false;
                        syncDetected = false;
                        decodingBuffer = "";
                        setRxStatus("ожидание сигнала", false);
                    }
                }
                lastDetectedTime = now;
            }
        }
    }

    // ---- Сброс приемника ----
    function resetReceiver() {
        isReceiving = false;
        syncDetected = false;
        decodingBuffer = "";
        document.getElementById('output').innerText = "⏳ ожидание...";
        setRxStatus("ожидание сигнала", false);
        log("[Rx] 🔄 Прием сброшен");
    }

    // ---- Клавиша Enter ----
    document.getElementById('textInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            document.getElementById('sendBtn').click();
        }
    });

    log("🚀 Модем v2 загружен. Нажмите 'Включить звук' для старта.");
    setRxStatus("ожидание сигнала", false);
</script>
</body>
</html>
