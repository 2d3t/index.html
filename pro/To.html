<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ультразвуковой модем — простая версия</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #e0e0e0; padding: 20px; text-align: center; }
        button { background: #00adb5; border: none; color: white; padding: 12px 24px; font-size: 16px; border-radius: 5px; cursor: pointer; margin: 10px; transition: 0.2s; }
        button:hover { background: #008a92; }
        button:active { background: #007a80; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        input { padding: 10px; font-size: 16px; width: 80%; max-width: 300px; border-radius: 5px; border: 1px solid #333; background: #222; color: white; }
        .box { background: #1e1e1e; padding: 15px; border-radius: 8px; margin: 15px auto; max-width: 450px; border: 1px solid #333; }
        #log { font-family: monospace; color: #888; font-size: 11px; max-height: 120px; overflow-y: auto; text-align: left; background: #000; padding: 8px; border-radius: 5px; }
        #output { font-size: 32px; font-weight: bold; color: #4caf50; margin-top: 10px; min-height: 50px; letter-spacing: 3px; }
        .status { color: #ff9800; font-size: 14px; }
        .status-good { color: #4caf50; }
        .freq-badge { display: inline-block; background: #2a2a2a; padding: 2px 10px; border-radius: 12px; margin: 2px; font-size: 11px; color: #00adb5; }
        #progress { width: 100%; height: 3px; background: #333; border-radius: 2px; margin: 8px 0; overflow: hidden; }
        #progress-bar { height: 100%; width: 0%; background: #4caf50; transition: width 0.1s; }
        .test-signal { background: #2a2a2a; padding: 5px; border-radius: 4px; margin: 5px; font-size: 12px; }
    </style>
</head>
<body>

    <h1>📢 Ultrasonic Modem</h1>
    <button id="initBtn">🎤 Включить микрофон</button>

    <div class="box">
        <h3>📤 Передатчик</h3>
        <input type="text" id="textInput" value="TEST" placeholder="Текст">
        <br>
        <button id="sendBtn" disabled>📡 Отправить</button>
        <div id="progress"><div id="progress-bar"></div></div>
        <div class="test-signal">
            ⚡ Частоты: 17.0–20.0 кГц · Тон: 150 мс · Пауза: 100 мс
        </div>
    </div>

    <div class="box">
        <h3>📥 Приемник</h3>
        <div>Статус: <span id="rxStatus" class="status">⏳ ожидание</span></div>
        <div id="output">...</div>
    </div>

    <div class="box">
        <h3>📋 Лог</h3>
        <div id="log"></div>
    </div>

<script>
    // ============================================================
    //  ПРОСТЫЕ НАСТРОЙКИ — МАКСИМАЛЬНАЯ НАДЕЖНОСТЬ
    // ============================================================
    const ALPHABET = " ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
    const BASE_FREQ = 17000;          // 17 кГц
    const FREQ_STEP = 120;            // 120 Гц на символ
    const TONE_DURATION = 0.15;       // 150 мс
    const SILENCE_GAP = 0.10;         // 100 мс пауза
    
    // СИНХРОНИЗАЦИЯ — просто один длинный тон перед сообщением
    const SYNC_FREQ = 16500;          // 16.5 кГц
    const SYNC_DURATION = 0.20;       // 200 мс

    let audioCtx = null;
    let analyser = null;
    let isListening = false;
    let isSending = false;

    function log(msg) {
        const logDiv = document.getElementById('log');
        logDiv.innerHTML += msg + '<br>';
        logDiv.scrollTop = logDiv.scrollHeight;
    }

    function setProgress(pct) {
        document.getElementById('progress-bar').style.width = Math.min(100, pct) + '%';
    }

    function setRxStatus(text, good = false) {
        const el = document.getElementById('rxStatus');
        el.textContent = text;
        el.className = good ? 'status-good' : 'status';
    }

    // ---- Инициализация ----
    document.getElementById('initBtn').addEventListener('click', async () => {
        if (audioCtx) return;
        try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            document.getElementById('sendBtn').disabled = false;
            document.getElementById('initBtn').innerText = "✅ Микрофон включен";
            document.getElementById('initBtn').style.background = "#28a745";
            await initReceiver();
            log("✅ Система готова");
            setRxStatus("слушаю...");
        } catch (e) {
            alert("Ошибка: " + e.message);
            log("❌ " + e.message);
        }
    });

    // ============================================================
    //  ПЕРЕДАТЧИК
    // ============================================================
    function playTone(freq, startTime, duration, volume = 0.8) {
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, startTime);
            
            gain.gain.setValueAtTime(0, startTime);
            gain.gain.linearRampToValueAtTime(volume, startTime + 0.01);
            gain.gain.setValueAtTime(volume, startTime + duration - 0.01);
            gain.gain.linearRampToValueAtTime(0, startTime + duration);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(startTime);
            osc.stop(startTime + duration);
            return true;
        } catch(e) {
            return false;
        }
    }

    function getFreq(char) {
        const idx = ALPHABET.indexOf(char);
        if (idx === -1) return null;
        return BASE_FREQ + (idx * FREQ_STEP);
    }

    document.getElementById('sendBtn').addEventListener('click', () => {
        if (isSending) return;
        const text = document.getElementById('textInput').value.toUpperCase().trim();
        if (!text) {
            log("⚠️ Введите текст");
            return;
        }

        isSending = true;
        document.getElementById('sendBtn').disabled = true;
        document.getElementById('sendBtn').innerText = "⏳ Передача...";
        setProgress(0);

        log(`📤 Передача: "${text}" (${text.length} симв.)`);
        
        let time = audioCtx.currentTime + 0.3;
        
        // ---- СИНХРОНИЗАЦИЯ: длинный тон ----
        playTone(SYNC_FREQ, time, SYNC_DURATION);
        log(`[Tx] 🔵 СИНХРО (${SYNC_FREQ/1000}кГц) в ${time.toFixed(3)}`);
        time += SYNC_DURATION + 0.20; // пауза 200 мс

        // ---- ДАННЫЕ ----
        for (let i = 0; i < text.length; i++) {
            const char = text[i];
            const freq = getFreq(char);
            if (freq === null) {
                log(`⚠️ Символ '${char}' пропущен`);
                time += TONE_DURATION + SILENCE_GAP;
                continue;
            }
            
            playTone(freq, time, TONE_DURATION);
            const fKHz = (freq/1000).toFixed(2);
            log(`[Tx] '${char}' → ${fKHz}кГц в ${time.toFixed(3)}`);
            
            time += TONE_DURATION + SILENCE_GAP;
            setProgress(((i+1)/text.length)*100);
        }

        setTimeout(() => {
            isSending = false;
            document.getElementById('sendBtn').disabled = false;
            document.getElementById('sendBtn').innerText = "📡 Отправить";
            setProgress(0);
            log("✅ Готово");
        }, (text.length * (TONE_DURATION + SILENCE_GAP) + 1) * 1000);
    });

    // ============================================================
    //  ПРИЕМНИК — УПРОЩЕННЫЙ И НАДЕЖНЫЙ
    // ============================================================
    async function initReceiver() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                audio: {
                    echoCancellation: false,
                    noiseSuppression: false,
                    autoGainControl: false,
                    sampleRate: 44100
                }
            });

            const source = audioCtx.createMediaStreamSource(stream);
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 4096;
            analyser.smoothingTimeConstant = 0.9;
            source.connect(analyser);

            isListening = true;
            log("🎤 Микрофон работает");
            detectLoop();
        } catch (err) {
            log("❌ Ошибка микрофона: " + err);
            setRxStatus("❌ ошибка");
        }
    }

    // ---- ДЕТЕКТОР ----
    let syncDetected = false;
    let receiving = false;
    let result = "";
    let lastTime = 0;
    let symbolCount = 0;
    const SYNC_TOLERANCE = 60;    // Гц
    const FREQ_TOLERANCE = 60;    // Гц
    const MIN_POWER = 30;

    function detectLoop() {
        if (!isListening) return;
        requestAnimationFrame(detectLoop);

        const bufferLength = analyser.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);
        analyser.getByteFrequencyData(dataArray);

        const sampleRate = audioCtx.sampleRate;
        const fftSize = analyser.fftSize;
        const now = audioCtx.currentTime;

        // Находим пик
        let maxPower = 0, maxIdx = 0;
        for (let i = 0; i < bufferLength; i++) {
            if (dataArray[i] > maxPower) {
                maxPower = dataArray[i];
                maxIdx = i;
            }
        }

        if (maxPower < MIN_POWER) {
            // Таймаут приема
            if (receiving && (now - lastTime > 2.0)) {
                receiving = false;
                syncDetected = false;
                if (result.length > 0) {
                    log(`[Rx] ⏹️ Таймаут. Итог: "${result}"`);
                    document.getElementById('output').innerText = result;
                }
                result = "";
                setRxStatus("ожидание");
            }
            return;
        }

        const freq = (maxIdx * sampleRate) / fftSize;
        const fKHz = (freq/1000).toFixed(2);

        // ---- ПОИСК СИНХРОСИГНАЛА ----
        if (!receiving) {
            if (Math.abs(freq - SYNC_FREQ) < SYNC_TOLERANCE) {
                log(`[Rx] 🔵 СИНХРО: ${fKHz}кГц (${maxPower})`);
                syncDetected = true;
                receiving = true;
                result = "";
                symbolCount = 0;
                document.getElementById('output').innerText = "";
                setRxStatus("🔴 прием...", true);
                lastTime = now;
            }
            return;
        }

        // ---- ДЕКОДИРОВАНИЕ ----
        if (receiving && maxPower > MIN_POWER) {
            // Защита от повторных срабатываний
            if (now - lastTime < (TONE_DURATION + SILENCE_GAP) * 0.5) {
                return;
            }

            // Проверяем, не синхросигнал ли это опять (мог повториться)
            if (Math.abs(freq - SYNC_FREQ) < SYNC_TOLERANCE) {
                // Игнорируем повторный синхросигнал
                lastTime = now;
                return;
            }

            // Ищем ближайший символ
            let bestChar = null;
            let bestDiff = Infinity;
            
            for (let i = 0; i < ALPHABET.length; i++) {
                const target = BASE_FREQ + (i * FREQ_STEP);
                const diff = Math.abs(freq - target);
                if (diff < bestDiff) {
                    bestDiff = diff;
                    bestChar = ALPHABET[i];
                }
            }

            if (bestDiff < FREQ_TOLERANCE && bestChar !== null) {
                log(`[Rx] ✅ '${bestChar}' (${fKHz}кГц, ±${bestDiff.toFixed(0)}Гц)`);
                result += bestChar;
                document.getElementById('output').innerText = result;
                symbolCount++;
                lastTime = now;
            } else {
                // Если частота не распознана, но это в ультразвуке
                if (freq > 16000 && freq < 22000) {
                    log(`[Rx] ❓ ${fKHz}кГц (${maxPower}) — неизвестно`);
                }
                lastTime = now;
            }
        }
    }

    // ---- Сброс ----
    function resetRx() {
        receiving = false;
        syncDetected = false;
        result = "";
        document.getElementById('output').innerText = "...";
        setRxStatus("ожидание");
        log("🔄 Сброс приемника");
    }

    // ---- Enter для отправки ----
    document.getElementById('textInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') document.getElementById('sendBtn').click();
    });

    log("🚀 Загружено. Нажмите 'Включить микрофон'.");
    setRxStatus("ожидание");
</script>
</body>
</html>
