<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>QR-Генератор (пошаговый)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0e17;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 450px;
            width: 100%;
            background: #111827;
            border-radius: 32px;
            padding: 28px 24px;
            border: 1px solid #1f2937;
            box-shadow: 0 12px 40px rgba(0,0,0,0.6);
        }
        h1 {
            font-size: 28px;
            font-weight: 700;
            color: #00ffaa;
            margin-bottom: 8px;
            text-align: center;
        }
        .subtitle {
            color: #7f8c8d;
            font-size: 14px;
            text-align: center;
            margin-bottom: 28px;
            border-bottom: 1px solid #1f2937;
            padding-bottom: 16px;
        }
        label {
            display: block;
            color: #cbd5e1;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
        }
        textarea {
            width: 100%;
            background: #0f172a;
            border: 1px solid #2d3a4e;
            border-radius: 20px;
            padding: 16px;
            color: #e2e8f0;
            font-size: 15px;
            resize: vertical;
            min-height: 120px;
            font-family: inherit;
            transition: border 0.2s;
        }
        textarea:focus {
            outline: none;
            border-color: #00ffaa;
        }
        .char-counter {
            text-align: right;
            font-size: 13px;
            color: #5b6e8c;
            margin-top: 6px;
            margin-bottom: 20px;
        }
        .btn {
            width: 100%;
            border: none;
            border-radius: 40px;
            padding: 14px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.1s ease, opacity 0.2s;
            margin-bottom: 12px;
        }
        .btn:active { transform: scale(0.97); }
        .btn:disabled { opacity: 0.4; pointer-events: none; }
        .btn-primary {
            background: linear-gradient(135deg, #00ffaa, #00a8ff);
            color: #000;
        }
        .btn-secondary {
            background: #1e293b;
            border: 1px solid #2d3a4e;
            color: #e2e8f0;
        }
        .btn-secondary:hover { background: #2d3a4e; border-color: #00ffaa; }
        .btn-success {
            background: #00cc88;
            color: #000;
        }
        .btn-danger {
            background: #ff4444;
            color: #fff;
        }
        .btn-group {
            display: flex;
            gap: 10px;
        }
        .btn-group .btn { flex: 1; }
        .qr-grid {
            display: flex;
            flex-direction: column;
            gap: 24px;
            margin-top: 16px;
        }
        .qr-item {
            background: #0f172a;
            border-radius: 24px;
            padding: 20px;
            border: 1px solid #1f2937;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            animation: fadeIn 0.3s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.97); }
            to { opacity: 1; transform: scale(1); }
        }
        .part-label {
            font-size: 13px;
            color: #94a3b8;
            background: #1e293b;
            padding: 2px 12px;
            border-radius: 40px;
            margin-bottom: 4px;
        }
        .qrcode-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 50px;
        }
        .qrcode-container canvas {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
        }
        .btn-download-part {
            background: #1e293b;
            border: 1px solid #2d3a4e;
            border-radius: 40px;
            padding: 8px 16px;
            color: #e2e8f0;
            font-weight: 500;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-download-part:hover { background: #2d3a4e; border-color: #00ffaa; }
        .btn-download-all {
            width: 100%;
            background: #1e293b;
            border: 1px solid #2d3a4e;
            border-radius: 40px;
            padding: 14px;
            color: #e2e8f0;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 16px;
        }
        .btn-download-all:hover { background: #2d3a4e; border-color: #00ffaa; }
        .empty-state { color: #4a5a70; font-size: 14px; text-align: center; padding: 30px 0; }
        .error-msg {
            background: #450a0a;
            border-left: 4px solid #ef4444;
            padding: 10px 14px;
            border-radius: 12px;
            margin-bottom: 16px;
            color: #fca5a5;
            font-size: 14px;
            display: none;
        }
        .settings-row {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
        }
        .settings-row label { margin-bottom: 0; font-size: 14px; color: #94a3b8; }
        .settings-row select {
            background: #0f172a;
            border: 1px solid #2d3a4e;
            border-radius: 40px;
            padding: 8px 16px;
            color: #e2e8f0;
            font-size: 14px;
            flex: 1;
        }
        .level-info {
            font-size: 12px;
            color: #4a5a70;
            text-align: center;
            margin-top: 14px;
            border-top: 1px solid #1f2937;
            padding-top: 14px;
        }
        .level-info span { color: #00ffaa; }
        .progress-info {
            background: #1e293b;
            border-radius: 20px;
            padding: 12px 16px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .progress-info .count {
            color: #00ffaa;
            font-weight: 600;
        }
        @media (max-width: 480px) {
            .container { padding: 20px 16px; }
            h1 { font-size: 24px; }
            textarea { min-height: 100px; font-size: 14px; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>📱 QR-Генератор</h1>
    <div class="subtitle">Пошаговое создание QR-кодов</div>

    <label for="textInput">Введите текст:</label>
    <textarea id="textInput" placeholder="Ваш текст..."></textarea>
    <div class="char-counter" id="charCounter">
        0 символов, <span id="partsCount">0</span> частей
    </div>

    <div class="settings-row">
        <label for="sizeSelect">Размер QR:</label>
        <select id="sizeSelect">
            <option value="150">Маленький (150px)</option>
            <option value="200" selected>Средний (200px)</option>
            <option value="300">Большой (300px)</option>
        </select>
    </div>

    <div class="btn-group">
        <button class="btn btn-primary" id="prepareBtn">📋 Подготовить части</button>
        <button class="btn btn-secondary" id="resetBtn" disabled>🔄 Сброс</button>
    </div>

    <div id="progressPanel" class="progress-info" style="display:none;">
        <span>Часть <span id="currentPart">0</span> / <span id="totalParts">0</span></span>
        <span class="count" id="statusText">Ожидание</span>
    </div>

    <button class="btn btn-success" id="nextBtn" disabled style="font-size:18px;">▶️ Создать следующую часть</button>

    <div class="error-msg" id="errorMsg">⚠️ Ошибка</div>

    <div id="qrGrid" class="qr-grid">
        <div class="empty-state">📦 Разбей текст на части и создавай QR-коды по одному</div>
    </div>

    <div class="level-info">🔒 Уровень коррекции: <span>L</span> (7%) — максимальная ёмкость</div>
</div>

<script>
    (function() {
        const textInput = document.getElementById('textInput');
        const nextBtn = document.getElementById('nextBtn');
        const prepareBtn = document.getElementById('prepareBtn');
        const resetBtn = document.getElementById('resetBtn');
        const qrGrid = document.getElementById('qrGrid');
        const errorMsg = document.getElementById('errorMsg');
        const charCounter = document.getElementById('charCounter');
        const partsCount = document.getElementById('partsCount');
        const currentPartSpan = document.getElementById('currentPart');
        const totalPartsSpan = document.getElementById('totalParts');
        const statusText = document.getElementById('statusText');
        const progressPanel = document.getElementById('progressPanel');
        const sizeSelect = document.getElementById('sizeSelect');

        const MAX_CHARS_PER_QR = 130;
        let chunks = [];
        let currentIndex = 0;
        let isGenerating = false;

        function updateCounter() {
            const len = textInput.value.length;
            const parts = Math.ceil(len / MAX_CHARS_PER_QR);
            partsCount.textContent = parts;
            charCounter.innerHTML = `${len} символов, <span id="partsCount">${parts}</span> частей`;
        }
        textInput.addEventListener('input', updateCounter);

        function splitTextIntoChunks(text) {
            const result = [];
            let i = 0;
            while (i < text.length) {
                let end = Math.min(i + MAX_CHARS_PER_QR, text.length);
                if (end < text.length) {
                    let lastSpace = text.lastIndexOf(' ', end);
                    if (lastSpace > i) end = lastSpace;
                }
                result.push(text.slice(i, end));
                i = end + 1;
            }
            return result;
        }

        // Надёжное ожидание появления canvas с MutationObserver
        function waitForCanvas(container, timeoutMs = 5000) {
            return new Promise((resolve, reject) => {
                // Проверяем сразу
                const canvas = container.querySelector('canvas');
                if (canvas && canvas.width > 0 && canvas.height > 0) {
                    resolve();
                    return;
                }

                const observer = new MutationObserver(() => {
                    const c = container.querySelector('canvas');
                    if (c && c.width > 0 && c.height > 0) {
                        observer.disconnect();
                        resolve();
                    }
                });

                observer.observe(container, { childList: true, subtree: true });

                // Таймаут
                const timeout = setTimeout(() => {
                    observer.disconnect();
                    reject(new Error('Timeout'));
                }, timeoutMs);

                // Проверка через интервал на случай, если MutationObserver не сработал
                const interval = setInterval(() => {
                    const c = container.querySelector('canvas');
                    if (c && c.width > 0 && c.height > 0) {
                        clearInterval(interval);
                        clearTimeout(timeout);
                        observer.disconnect();
                        resolve();
                    }
                }, 100);
            });
        }

        function createQR(container, text, size) {
            return new Promise((resolve, reject) => {
                try {
                    container.innerHTML = '';
                    new QRCode(container, {
                        text: text,
                        width: size,
                        height: size,
                        colorDark: '#000000',
                        colorLight: '#ffffff',
                        correctLevel: QRCode.CorrectLevel.L
                    });
                    waitForCanvas(container).then(resolve).catch(reject);
                } catch (e) {
                    reject(e);
                }
            });
        }

        function downloadPart(index) {
            const container = document.getElementById(`qr-${index}`);
            if (!container) return;
            const canvas = container.querySelector('canvas');
            if (!canvas) return alert('QR-код ещё не создан');
            const link = document.createElement('a');
            link.download = `qr_part_${index + 1}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        function updateUI() {
            const total = chunks.length;
            totalPartsSpan.textContent = total;
            currentPartSpan.textContent = Math.min(currentIndex + 1, total);
            progressPanel.style.display = total > 0 ? 'flex' : 'none';
            
            if (currentIndex >= total && total > 0) {
                statusText.textContent = '✅ Готово!';
                nextBtn.disabled = true;
                nextBtn.textContent = '✅ Все части созданы';
            } else {
                statusText.textContent = `Ожидание (${currentIndex + 1}/${total})`;
                nextBtn.disabled = false;
                nextBtn.textContent = `▶️ Создать часть ${currentIndex + 1}`;
            }
            
            resetBtn.disabled = total === 0;
        }

        function prepareChunks() {
            const text = textInput.value.trim();
            errorMsg.style.display = 'none';
            
            if (!text) {
                errorMsg.textContent = '⚠️ Введите текст';
                errorMsg.style.display = 'block';
                return;
            }
            
            chunks = splitTextIntoChunks(text);
            if (chunks.length > 10) {
                errorMsg.textContent = `⚠️ Слишком много частей (${chunks.length}). Максимум 10.`;
                errorMsg.style.display = 'block';
                return;
            }
            
            qrGrid.innerHTML = '';
            currentIndex = 0;
            
            const empty = document.createElement('div');
            empty.className = 'empty-state';
            empty.textContent = `📦 Готово ${chunks.length} частей. Нажми «Создать следующую часть»`;
            qrGrid.appendChild(empty);
            
            updateUI();
            prepareBtn.disabled = true;
        }

        function downloadAll() {
            const containers = qrGrid.querySelectorAll('.qrcode-container');
            if (!containers.length) return;
            if (typeof JSZip === 'undefined') {
                const script = document.createElement('script');
                script.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
                script.onload = () => downloadAllZip(containers);
                document.head.appendChild(script);
                return;
            }
            downloadAllZip(containers);
        }

        function downloadAllZip(containers) {
            const zip = new JSZip();
            containers.forEach((c, i) => {
                const canvas = c.querySelector('canvas');
                if (canvas) {
                    zip.file(`qr_part_${i+1}.png`, canvas.toDataURL('image/png').split(',')[1], { base64: true });
                }
            });
            zip.generateAsync({ type: 'blob' }).then(blob => {
                const link = document.createElement('a');
                link.download = `qr_codes.zip`;
                link.href = URL.createObjectURL(blob);
                link.click();
                URL.revokeObjectURL(link.href);
            });
        }

        async function createNextQR() {
            if (isGenerating) return;
            if (currentIndex >= chunks.length) {
                alert('Все части уже созданы');
                return;
            }
            
            isGenerating = true;
            nextBtn.disabled = true;
            nextBtn.textContent = '⏳ Создание...';
            statusText.textContent = 'Создание...';
            
            const size = parseInt(sizeSelect.value, 10);
            const chunk = chunks[currentIndex];
            
            const empty = qrGrid.querySelector('.empty-state');
            if (empty) empty.remove();
            
            const item = document.createElement('div');
            item.className = 'qr-item';
            item.id = `qr-item-${currentIndex}`;

            const label = document.createElement('div');
            label.className = 'part-label';
            label.textContent = chunks.length === 1 ? '📄 Весь текст' : `📄 Часть ${currentIndex + 1} / ${chunks.length}`;
            item.appendChild(label);

            const wrapper = document.createElement('div');
            wrapper.className = 'qrcode-container';
            wrapper.id = `qr-${currentIndex}`;
            item.appendChild(wrapper);

            const btn = document.createElement('button');
            btn.className = 'btn-download-part';
            btn.textContent = `💾 Скачать часть ${currentIndex + 1}`;
            btn.addEventListener('click', () => downloadPart(currentIndex));
            item.appendChild(btn);

            qrGrid.appendChild(item);

            try {
                await createQR(wrapper, chunk, size);
                currentIndex++;
                updateUI();
                
                if (currentIndex >= chunks.length) {
                    const allBtn = document.createElement('button');
                    allBtn.className = 'btn-download-all';
                    allBtn.textContent = '📦 Скачать все части (ZIP)';
                    allBtn.addEventListener('click', downloadAll);
                    qrGrid.appendChild(allBtn);
                }
            } catch (e) {
                console.error(e);
                wrapper.innerHTML = `<span style="color:#ef4444;">❌ Ошибка</span>`;
                statusText.textContent = '❌ Ошибка';
            }
            
            isGenerating = false;
            if (currentIndex >= chunks.length) {
                nextBtn.disabled = true;
                nextBtn.textContent = '✅ Готово';
            } else {
                nextBtn.disabled = false;
                nextBtn.textContent = `▶️ Создать часть ${currentIndex + 1}`;
                statusText.textContent = `Ожидание (${currentIndex + 1}/${chunks.length})`;
            }
        }

        function resetAll() {
            chunks = [];
            currentIndex = 0;
            qrGrid.innerHTML = `<div class="empty-state">📦 Разбей текст на части и создавай QR-коды по одному</div>`;
            progressPanel.style.display = 'none';
            nextBtn.disabled = true;
            nextBtn.textContent = '▶️ Создать следующую часть';
            prepareBtn.disabled = false;
            resetBtn.disabled = true;
            errorMsg.style.display = 'none';
        }

        prepareBtn.addEventListener('click', prepareChunks);
        resetBtn.addEventListener('click', resetAll);
        nextBtn.addEventListener('click', createNextQR);

        updateCounter();
    })();
</script>
</body>
</html>
