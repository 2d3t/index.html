<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>QR Text Transfer</title>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="https://unpkg.com/html5-qrcode"></script>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    background: #f1f2f4;
    color: #222;
    font-family: Arial, sans-serif;
}

.app {
    max-width: 650px;
    margin: auto;
    padding: 12px;
}

h1 {
    text-align: center;
    margin: 5px 0 15px;
    font-size: 24px;
}

.tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 12px;
    flex-wrap: wrap;
}

.tab {
    flex: 1;
    padding: 13px 5px;
    border: 0;
    border-radius: 10px;
    background: #ddd;
    font-size: 16px;
    font-weight: bold;
    min-width: 80px;
}

.tab.active {
    background: #111;
    color: white;
}

.page {
    display: none;
}

.page.active {
    display: block;
}

.card {
    background: white;
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,.07);
}

textarea {
    width: 100%;
    min-height: 190px;
    resize: vertical;
    padding: 13px;
    border: 1px solid #bbb;
    border-radius: 10px;
    font-size: 16px;
    line-height: 1.45;
    outline: none;
}

textarea:focus {
    border-color: #333;
}

button {
    width: 100%;
    border: 0;
    border-radius: 10px;
    padding: 13px;
    margin-top: 8px;
    font-size: 16px;
    font-weight: bold;
}

.primary {
    background: #111;
    color: white;
}

.secondary {
    background: #ddd;
}

.danger {
    background: #eee;
}

.info {
    font-size: 14px;
    line-height: 1.5;
}

.center {
    text-align: center;
}

.qr-item {
    background: white;
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 14px;
    text-align: center;
    box-shadow: 0 2px 8px rgba(0,0,0,.07);
}

.qr-title {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 10px;
}

.qr-image {
    width: 100%;
    max-width: 430px;
    height: auto;
    image-rendering: pixelated;
}

.qr-meta {
    margin-top: 8px;
    color: #666;
    font-size: 13px;
    word-break: break-word;
}

.progress {
    height: 12px;
    background: #e5e5e5;
    border-radius: 10px;
    overflow: hidden;
    margin-top: 10px;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: #111;
    transition: width .25s;
}

#reader {
    width: 100%;
    overflow: hidden;
    border-radius: 12px;
}

.status {
    text-align: center;
    padding: 10px;
    font-weight: bold;
}

.ok {
    color: #16833b;
}

.error {
    color: #b00020;
}

.warning {
    color: #a05a00;
}

.parts {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 10px;
}

.part {
    width: 38px;
    height: 38px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 13px;
}

.part.received {
    background: #222;
    color: white;
}

.part.missing {
    background: #eee;
    color: #888;
}

.small {
    color: #666;
    font-size: 13px;
    line-height: 1.45;
}

.hash {
    font-family: monospace;
    font-size: 12px;
    word-break: break-all;
    background: #f5f5f5;
    padding: 8px;
    border-radius: 7px;
    margin-top: 6px;
}

.hidden {
    display: none;
}

.size-control {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 10px 0;
    padding: 10px;
    background: #f8f8f8;
    border-radius: 10px;
    flex-wrap: wrap;
}

.size-control label {
    font-weight: bold;
    font-size: 14px;
    min-width: 90px;
}

.size-control input {
    flex: 1;
    padding: 8px;
    border: 1px solid #bbb;
    border-radius: 6px;
    font-size: 16px;
    width: 80px;
    min-width: 60px;
}

.size-control .hint {
    font-size: 12px;
    color: #666;
}

/* ===== ПЕРЕДАЧА (СЛАЙД-ШОУ) ===== */
.transfer-container {
    background: white;
    border-radius: 14px;
    padding: 20px;
    text-align: center;
    min-height: 500px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 8px rgba(0,0,0,.07);
}

.transfer-container .qr-display {
    width: 100%;
    max-width: 500px;
    margin: 0 auto;
}

.transfer-container .qr-display img {
    width: 100%;
    height: auto;
    image-rendering: pixelated;
    background: white;
}

.transfer-container .transfer-info {
    font-size: 18px;
    font-weight: bold;
    margin-top: 15px;
    color: #222;
}

.transfer-container .transfer-counter {
    font-size: 14px;
    color: #666;
    margin-top: 5px;
}

.transfer-controls {
    display: flex;
    gap: 10px;
    margin-top: 15px;
    flex-wrap: wrap;
}

.transfer-controls button {
    flex: 1;
    min-width: 80px;
}

.speed-control {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 15px;
    padding: 10px;
    background: #f8f8f8;
    border-radius: 10px;
    flex-wrap: wrap;
    justify-content: center;
}

.speed-control label {
    font-weight: bold;
    font-size: 14px;
}

.speed-control input[type="range"] {
    flex: 1;
    min-width: 120px;
    accent-color: #111;
}

.speed-control .speed-value {
    font-weight: bold;
    font-size: 16px;
    min-width: 60px;
    text-align: center;
}

.transfer-status {
    margin-top: 10px;
    font-size: 14px;
    color: #666;
}

/* Анимация пульсации для активного режима */
@keyframes pulse {
    0% { opacity: 1; }
    50% { opacity: 0.6; }
    100% { opacity: 1; }
}

.transfer-active .qr-display img {
    animation: pulse 1.5s ease-in-out infinite;
}

</style>
</head>

<body>
<button onclick="toggleQR()">QR-код</button>

<div id="qrContainer" style="display:none; margin-top:10px;">
    <img src="https://2d3t.github.io/index.html/icons/qrtr.png"
         alt="QR-код Приглашение"
         style="max-width:100%; height:auto;">
</div>

<script>
function toggleQR() {
    const qr = document.getElementById('qrContainer');
    qr.style.display = qr.style.display === 'none' ? 'block' : 'none';
}
</script>

<div class="app">

<h1>📦 QR Text Transfer</h1>

<div class="tabs">
    <button id="tabGenerator" class="tab active" onclick="showPage('generator')">📤 Генератор</button>
    <button id="tabScanner" class="tab" onclick="showPage('scanner')">📷 Сборщик</button>
    <button id="tabTransfer" class="tab" onclick="showPage('transfer')">📺 Передача</button>
</div>


<!-- =====================================================
     ГЕНЕРАТОР
===================================================== -->

<div id="generator" class="page active">

<div class="card">

<textarea
    id="sourceText"
    placeholder="Введите или вставьте сюда текст..."></textarea>

<div class="size-control">
    <label for="maxChunkSize">Макс. символов в QR:</label>
    <input type="number" id="maxChunkSize" value="150" min="10" max="1000">
    <span class="hint">(10-1000)</span>
</div>

<button class="primary" onclick="generateQRs()">Создать QR-коды</button>
<button class="secondary" onclick="clearGenerator()">Очистить</button>

</div>

<div id="generatorInfo" class="card info">
    Введите текст и нажмите «Создать QR-коды».
</div>

<div id="qrOutput"></div>

</div>



<!-- =====================================================
     СБОРЩИК
===================================================== -->

<div id="scanner" class="page">

<div class="card">

<div id="reader"></div>

<button id="startCameraButton" class="primary" onclick="startScanner()">📷 Запустить камеру</button>
<button class="secondary" onclick="stopScanner()">⏹ Остановить камеру</button>

<div id="scanStatus" class="status">Камера не запущена</div>

</div>


<div class="card">

<div>
    Получено: <b id="receivedCount">0</b> / <b id="totalCount">?</b>
</div>

<div class="progress">
    <div id="scanProgress" class="progress-bar"></div>
</div>

<div id="scanProgressText" class="small" style="margin-top:8px;">
    Отсканируйте первый QR-код.
</div>

<div id="partsList" class="parts"></div>

</div>


<div class="card">

<b>Восстановленный текст</b>

<textarea id="resultText" readonly placeholder="После получения всех частей здесь появится исходный текст..."></textarea>

<button class="secondary" onclick="copyResult()">📋 Копировать</button>
<button class="secondary" onclick="saveResult()">💾 Сохранить TXT</button>
<button class="danger" onclick="clearScanner()">🗑 Очистить сборщик</button>

</div>


<div id="verification" class="card info hidden">

<b>Проверка целостности</b>

<div id="verificationText"></div>

</div>

</div>


<!-- =====================================================
     ПЕРЕДАЧА (СЛАЙД-ШОУ)
===================================================== -->

<div id="transfer" class="page">

<div class="transfer-container" id="transferContainer">

    <div class="qr-display" id="transferDisplay">
        <img id="transferImage" src="" alt="QR-код">
    </div>

    <div class="transfer-info" id="transferInfo">Нет QR-кодов</div>
    <div class="transfer-counter" id="transferCounter">0 / 0</div>

    <div class="transfer-controls">
        <button class="primary" id="transferStartBtn" onclick="startTransfer()">▶ Старт</button>
        <button class="secondary" id="transferStopBtn" onclick="stopTransfer()" disabled>⏹ Стоп</button>
        <button class="secondary" onclick="transferPrev()">◀ Назад</button>
        <button class="secondary" onclick="transferNext()">Вперед ▶</button>
    </div>

    <div class="speed-control">
        <label for="transferSpeed">Скорость:</label>
        <input type="range" id="transferSpeed" min="0.5" max="5" step="0.1" value="2">
        <span class="speed-value" id="speedDisplay">2.0 сек</span>
    </div>

    <div class="transfer-status" id="transferStatus">Ожидание запуска</div>

</div>

</div>


</div>

<script>

/* =========================================================
   ОБЩИЕ НАСТРОЙКИ
========================================================= */

const QR_ERROR_LEVEL = "M";

let scanner = null;
let scannerRunning = false;
let lastScanText = "";
let lastScanTime = 0;

// === ПЕРЕМЕННЫЕ ДЛЯ ПЕРЕДАЧИ ===
let transferQRs = [];
let transferIndex = 0;
let transferTimer = null;
let transferRunning = false;


/* =========================================================
   ГЕНЕРАТОР
========================================================= */

// Функция для правильного подсчёта байт в UTF-8
function utf8Bytes(text) {
    // Используем TextEncoder для точного подсчета байт в UTF-8
    return new TextEncoder().encode(text).length;
}

function utf8Length(text) {
    return utf8Bytes(text);
}

function canFitQR(text) {
    try {
        const qr = qrcode(0, QR_ERROR_LEVEL);
        qr.addData(text);
        qr.make();
        return true;
    } catch (e) {
        return false;
    }
}

function unicodeChars(text) {
    return Array.from(text);
}

function findLargestChunk(chars, start, maxSize) {
    let low = 1;
    let high = Math.min(chars.length - start, maxSize);
    let best = 0;

    while (low <= high) {
        const middle = Math.floor((low + high) / 2);
        const candidate = chars.slice(start, start + middle).join("");

        if (canFitQR(candidate)) {
            best = middle;
            low = middle + 1;
        } else {
            high = middle - 1;
        }
    }

    return best;
}

function splitRawText(text, maxSize) {
    const chars = unicodeChars(text);
    const result = [];
    let position = 0;

    while (position < chars.length) {
        const count = findLargestChunk(chars, position, maxSize);

        if (count <= 0) {
            throw new Error("Не удалось создать QR-код. Уменьшите максимальный размер.");
        }

        result.push(chars.slice(position, position + count).join(""));
        position += count;
    }

    return result;
}


/* =========================================================
   SHA-256
========================================================= */

async function sha256(text) {
    const data = new TextEncoder().encode(text);
    const hash = await crypto.subtle.digest("SHA-256", data);
    return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, "0")).join("");
}


/* =========================================================
   ФОРМАТ QR
========================================================= */

const DATA_SEPARATOR = "<<<QRTX_DATA>>>";

function createPacketSafe(documentId, partNumber, totalParts, hash, data) {
    return [
        "QRTX",
        "1",
        documentId,
        String(partNumber),
        String(totalParts),
        hash,
        DATA_SEPARATOR,
        data
    ].join("|");
}


/* =========================================================
   ГЕНЕРАЦИЯ
========================================================= */

async function generateQRs() {
    const text = document.getElementById("sourceText").value;
    const maxSizeInput = document.getElementById("maxChunkSize");
    let maxSize = parseInt(maxSizeInput.value, 10);

    if (isNaN(maxSize) || maxSize < 1) {
        maxSize = 150;
        maxSizeInput.value = 150;
    }
    if (maxSize < 1) maxSize = 1;
    if (maxSize > 5000) maxSize = 5000;

    const info = document.getElementById("generatorInfo");
    const output = document.getElementById("qrOutput");
    output.innerHTML = "";

    if (text.length === 0) {
        info.innerHTML = "Введите текст.";
        return;
    }

    info.innerHTML = "⏳ Анализирую вместимость QR-кодов... (лимит: " + maxSize + " символов)";

    try {
        const hash = await sha256(text);
        const documentId = crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36);

        let rawParts = [];
        let chars = unicodeChars(text);
        let position = 0;
        let estimatedTotal = 1;

        for (let iteration = 0; iteration < 10; iteration++) {
            rawParts = [];
            position = 0;

            while (position < chars.length) {
                const headerExample = createPacketSafe(documentId, estimatedTotal, estimatedTotal, hash, "");
                let low = 1;
                let high = Math.min(chars.length - position, maxSize);
                let best = 0;

                while (low <= high) {
                    const middle = Math.floor((low + high) / 2);
                    const candidate = chars.slice(position, position + middle).join("");
                    const packet = createPacketSafe(documentId, rawParts.length + 1, estimatedTotal, hash, candidate);

                    if (canFitQR(packet)) {
                        best = middle;
                        low = middle + 1;
                    } else {
                        high = middle - 1;
                    }
                }

                if (best <= 0) {
                    throw new Error("Даже минимальная часть не помещается в QR. Уменьшите максимальный размер.");
                }

                rawParts.push(chars.slice(position, position + best).join(""));
                position += best;
            }

            if (rawParts.length === estimatedTotal) {
                break;
            }
            estimatedTotal = rawParts.length;
        }

        const totalParts = rawParts.length;

        // Сохраняем QR-коды для передачи
        transferQRs = [];

        // Правильно считаем байты для отображения
        const totalBytes = utf8Length(text);
        
        info.innerHTML =
            "Символов: <b>" + text.length + "</b><br>" +
            "UTF-8: <b>" + totalBytes + " байт</b><br>" +
            "Максимум в одном QR: <b>" + maxSize + " символов</b><br>" +
            "QR-кодов: <b>" + totalParts + "</b><br><br>" +
            "Контрольная сумма SHA-256:<br>" +
            "<div class='hash'>" + hash + "</div>";

        rawParts.forEach((part, index) => {
            const packet = createPacketSafe(documentId, index + 1, totalParts, hash, part);
            const qr = qrcode(0, QR_ERROR_LEVEL);
            qr.addData(packet);
            qr.make();

            const dataURL = qr.createDataURL(7, 12);
            
            // Сохраняем для передачи
            transferQRs.push({
                dataURL: dataURL,
                part: index + 1,
                total: totalParts,
                size: part.length,
                bytes: utf8Length(part)
            });

            const item = document.createElement("div");
            item.className = "qr-item";

            const title = document.createElement("div");
            title.className = "qr-title";
            title.textContent = "QR " + (index + 1) + " / " + totalParts;
            item.appendChild(title);

            const img = document.createElement("img");
            img.className = "qr-image";
            img.src = dataURL;
            item.appendChild(img);

            const meta = document.createElement("div");
            meta.className = "qr-meta";
            meta.innerHTML = "Данные части: " + part.length + " символов · " + utf8Length(part) + " байт";
            item.appendChild(meta);

            const download = document.createElement("button");
            download.className = "secondary";
            download.textContent = "💾 Скачать PNG";
            download.onclick = () => {
                downloadImage(img.src, "QR_" + (index + 1) + "_of_" + totalParts + ".png");
            };
            item.appendChild(download);

            output.appendChild(item);
        });

        // Если есть QR-коды, обновляем интерфейс передачи
        if (transferQRs.length > 0) {
            updateTransferUI();
            document.getElementById("transferStatus").textContent = "Готово к передаче (" + transferQRs.length + " QR)";
        }

    } catch (error) {
        console.error(error);
        info.innerHTML = "<span class='error'>Ошибка: " + error.message + "</span>";
    }
}


/* =========================================================
   ПЕРЕДАЧА (СЛАЙД-ШОУ)
========================================================= */

function updateTransferUI() {
    const img = document.getElementById("transferImage");
    const info = document.getElementById("transferInfo");
    const counter = document.getElementById("transferCounter");

    if (transferQRs.length === 0) {
        img.src = "";
        img.alt = "Нет QR-кодов";
        info.textContent = "Нет QR-кодов";
        counter.textContent = "0 / 0";
        document.getElementById("transferStartBtn").disabled = true;
        return;
    }

    if (transferIndex >= transferQRs.length) {
        transferIndex = 0;
    }

    const current = transferQRs[transferIndex];
    img.src = current.dataURL;
    img.alt = "QR " + current.part + " / " + current.total;
    info.textContent = "QR " + current.part + " / " + current.total;
    counter.textContent = current.part + " / " + current.total + "  |  " + current.size + " симв.";

    document.getElementById("transferStartBtn").disabled = false;
}

function transferNext() {
    if (transferQRs.length === 0) return;
    transferIndex = (transferIndex + 1) % transferQRs.length;
    updateTransferUI();
    resetTransferTimer();
}

function transferPrev() {
    if (transferQRs.length === 0) return;
    transferIndex = (transferIndex - 1 + transferQRs.length) % transferQRs.length;
    updateTransferUI();
    resetTransferTimer();
}

function getTransferSpeed() {
    const speed = parseFloat(document.getElementById("transferSpeed").value);
    document.getElementById("speedDisplay").textContent = speed.toFixed(1) + " сек";
    return speed * 1000; // в миллисекундах
}

function resetTransferTimer() {
    if (transferTimer) {
        clearTimeout(transferTimer);
        transferTimer = null;
    }
    if (transferRunning) {
        startTimer();
    }
}

function startTimer() {
    if (transferTimer) {
        clearTimeout(transferTimer);
        transferTimer = null;
    }
    if (!transferRunning || transferQRs.length === 0) return;

    const speed = getTransferSpeed();
    transferTimer = setTimeout(() => {
        if (transferRunning && transferQRs.length > 0) {
            transferNext();
        }
    }, speed);
}

function startTransfer() {
    if (transferQRs.length === 0) {
        document.getElementById("transferStatus").textContent = "❌ Нет QR-кодов. Создайте их в Генераторе.";
        return;
    }

    if (transferRunning) return;

    transferRunning = true;
    transferIndex = 0;
    updateTransferUI();

    document.getElementById("transferStartBtn").disabled = true;
    document.getElementById("transferStopBtn").disabled = false;
    document.getElementById("transferContainer").classList.add("transfer-active");

    document.getElementById("transferStatus").textContent = "▶ Передача запущена...";

    startTimer();
}

function stopTransfer() {
    transferRunning = false;

    if (transferTimer) {
        clearTimeout(transferTimer);
        transferTimer = null;
    }

    document.getElementById("transferStartBtn").disabled = false;
    document.getElementById("transferStopBtn").disabled = true;
    document.getElementById("transferContainer").classList.remove("transfer-active");

    document.getElementById("transferStatus").textContent = "⏹ Передача остановлена";
}

// Обновление скорости при изменении ползунка
document.addEventListener("DOMContentLoaded", function() {
    const speedSlider = document.getElementById("transferSpeed");
    speedSlider.addEventListener("input", function() {
        const val = parseFloat(this.value);
        document.getElementById("speedDisplay").textContent = val.toFixed(1) + " сек";
        if (transferRunning) {
            resetTransferTimer();
        }
    });
});

// Инициализация интерфейса передачи
function initTransferUI() {
    updateTransferUI();
    document.getElementById("transferStopBtn").disabled = true;
}

// Вызываем при загрузке
setTimeout(initTransferUI, 100);


/* =========================================================
   СКАЧИВАНИЕ QR
========================================================= */

function downloadImage(dataURL, filename) {
    const a = document.createElement("a");
    a.href = dataURL;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
}


/* =========================================================
   ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК
========================================================= */

function showPage(page) {
    document.getElementById("generator").classList.remove("active");
    document.getElementById("scanner").classList.remove("active");
    document.getElementById("transfer").classList.remove("active");

    document.getElementById("tabGenerator").classList.remove("active");
    document.getElementById("tabScanner").classList.remove("active");
    document.getElementById("tabTransfer").classList.remove("active");

    if (page === "generator") {
        document.getElementById("generator").classList.add("active");
        document.getElementById("tabGenerator").classList.add("active");
    } else if (page === "scanner") {
        document.getElementById("scanner").classList.add("active");
        document.getElementById("tabScanner").classList.add("active");
    } else if (page === "transfer") {
        document.getElementById("transfer").classList.add("active");
        document.getElementById("tabTransfer").classList.add("active");
        updateTransferUI();
    }
}


/* =========================================================
   СБОРЩИК
========================================================= */

let receivedParts = {};
let scanTotal = null;
let scanHash = null;
let scanDocumentId = null;


/* =========================================================
   ЗАПУСК СКАНЕРА
========================================================= */

async function startScanner() {
    if (scannerRunning) return;

    const status = document.getElementById("scanStatus");
    status.textContent = "Запрашиваю камеру...";

    try {
        scanner = new Html5Qrcode("reader");

        await scanner.start(
            { facingMode: "environment" },
            {
                fps: 10,
                qrbox: function(width, height) {
                    const size = Math.min(width, height) * 0.75;
                    return { width: size, height: size };
                }
            },
            onScanSuccess,
            function(error) {}
        );

        scannerRunning = true;
        status.innerHTML = "<span class='ok'>📷 Камера работает. Наведите её на QR.</span>";

    } catch (error) {
        console.error(error);
        status.innerHTML = "<span class='error'>Не удалось запустить камеру.<br>Проверьте разрешение браузера.</span>";
    }
}


/* =========================================================
   ОСТАНОВКА
========================================================= */

async function stopScanner() {
    if (scanner && scannerRunning) {
        try { await scanner.stop(); } catch (e) { console.log(e); }
    }
    scannerRunning = false;
    document.getElementById("scanStatus").textContent = "Камера остановлена.";
}


/* =========================================================
   ПОЛУЧЕН QR
========================================================= */

function onScanSuccess(decodedText) {
    const now = Date.now();
    if (decodedText === lastScanText && now - lastScanTime < 2500) return;

    lastScanText = decodedText;
    lastScanTime = now;

    processPacket(decodedText);
}


/* =========================================================
   РАЗБОР QR
========================================================= */

function processPacket(packet) {
    if (!packet.startsWith("QRTX|")) {
        setScanStatus("Это не QR от этого генератора.", "warning");
        return;
    }

    const separatorIndex = packet.indexOf("|" + DATA_SEPARATOR + "|");
    if (separatorIndex < 0) {
        setScanStatus("Повреждённый формат QR.", "error");
        return;
    }

    const header = packet.substring(0, separatorIndex);
    const data = packet.substring(separatorIndex + DATA_SEPARATOR.length + 2);
    const fields = header.split("|");

    if (fields.length < 6) {
        setScanStatus("Неверный QR.", "error");
        return;
    }

    const format = fields[0];
    const version = fields[1];
    const documentId = fields[2];
    const partNumber = Number(fields[3]);
    const total = Number(fields[4]);
    const hash = fields[5];

    if (format !== "QRTX" || version !== "1") {
        setScanStatus("Неподдерживаемый формат QR.", "error");
        return;
    }

    if (!Number.isInteger(partNumber) || !Number.isInteger(total) || partNumber < 1 || partNumber > total) {
        setScanStatus("Неверный номер части.", "error");
        return;
    }

    if (scanDocumentId === null) {
        scanDocumentId = documentId;
        scanTotal = total;
        scanHash = hash;
    } else {
        if (documentId !== scanDocumentId) {
            setScanStatus("⚠️ Это QR от другого документа.", "warning");
            return;
        }
        if (total !== scanTotal) {
            setScanStatus("⚠️ Количество частей не совпадает.", "warning");
            return;
        }
        if (hash !== scanHash) {
            setScanStatus("⚠️ Контрольная сумма не совпадает.", "warning");
            return;
        }
    }

    if (receivedParts[partNumber] !== undefined) {
        setScanStatus("QR " + partNumber + " уже получен.", "warning");
        return;
    }

    receivedParts[partNumber] = data;
    updateScannerInterface();

    setScanStatus("✓ Получен QR " + partNumber + " / " + total, "ok");

    if (Object.keys(receivedParts).length === scanTotal) {
        assembleText();
    }
}


/* =========================================================
   ОБНОВЛЕНИЕ СБОРЩИКА
========================================================= */

function updateScannerInterface() {
    const received = Object.keys(receivedParts).length;
    document.getElementById("receivedCount").textContent = received;
    document.getElementById("totalCount").textContent = scanTotal || "?";

    let percent = 0;
    if (scanTotal) { percent = received / scanTotal * 100; }

    document.getElementById("scanProgress").style.width = percent + "%";
    document.getElementById("scanProgressText").textContent = scanTotal ? received + " из " + scanTotal + " частей" : "Ожидание QR";

    const list = document.getElementById("partsList");
    list.innerHTML = "";

    if (!scanTotal) return;

    for (let i = 1; i <= scanTotal; i++) {
        const div = document.createElement("div");
        if (receivedParts[i] !== undefined) {
            div.className = "part received";
            div.textContent = i;
        } else {
            div.className = "part missing";
            div.textContent = i;
        }
        list.appendChild(div);
    }
}


/* =========================================================
   СБОРКА ТЕКСТА
========================================================= */

async function assembleText() {
    let text = "";

    for (let i = 1; i <= scanTotal; i++) {
        if (receivedParts[i] === undefined) return;
        text += receivedParts[i];
    }

    document.getElementById("resultText").value = text;

    const calculatedHash = await sha256(text);
    const verification = document.getElementById("verification");
    const verificationText = document.getElementById("verificationText");

    verification.classList.remove("hidden");

    if (calculatedHash === scanHash) {
        verificationText.innerHTML =
            "<p class='ok'>✅ Текст восстановлен полностью.</p>" +
            "<p>Все " + scanTotal + " частей получены.</p>" +
            "<p><b>SHA-256 совпадает.</b></p>" +
            "<div class='hash'>" + calculatedHash + "</div>";

        document.getElementById("scanStatus").innerHTML = "<span class='ok'>🎉 ГОТОВО! Текст восстановлен без изменений.</span>";
    } else {
        verificationText.innerHTML =
            "<p class='error'>❌ Ошибка проверки!</p>" +
            "<p>Контрольная сумма восстановленного текста не совпадает.</p>" +
            "<div class='hash'>Ожидалось:<br>" + scanHash + "</div>" +
            "<div class='hash'>Получено:<br>" + calculatedHash + "</div>";
    }
}


/* =========================================================
   СТАТУС
========================================================= */

function setScanStatus(text, type) {
    const status = document.getElementById("scanStatus");
    status.textContent = text;
    status.className = "status " + type;
}


/* =========================================================
   КОПИРОВАНИЕ
========================================================= */

async function copyResult() {
    const text = document.getElementById("resultText").value;
    if (!text) return;

    try {
        await navigator.clipboard.writeText(text);
        setScanStatus("✓ Текст скопирован.", "ok");
    } catch (e) {
        const textarea = document.getElementById("resultText");
        textarea.removeAttribute("readonly");
        textarea.select();
        document.execCommand("copy");
        textarea.setAttribute("readonly", true);
        setScanStatus("✓ Текст скопирован.", "ok");
    }
}


/* =========================================================
   СОХРАНЕНИЕ TXT
========================================================= */

function saveResult() {
    const text = document.getElementById("resultText").value;
    if (!text) return;

    const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "recovered_text.txt";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
}


/* =========================================================
   ОЧИСТКА ГЕНЕРАТОРА
========================================================= */

function clearGenerator() {
    document.getElementById("sourceText").value = "";
    document.getElementById("generatorInfo").innerHTML = "Введите текст и нажмите «Создать QR-коды».";
    document.getElementById("qrOutput").innerHTML = "";
    transferQRs = [];
    stopTransfer();
    updateTransferUI();
}


/* =========================================================
   ОЧИСТКА СБОРЩИКА
========================================================= */

async function clearScanner() {
    await stopScanner();

    receivedParts = {};
    scanTotal = null;
    scanHash = null;
    scanDocumentId = null;
    lastScanText = "";
    lastScanTime = 0;

    document.getElementById("receivedCount").textContent = "0";
    document.getElementById("totalCount").textContent = "?";
    document.getElementById("scanProgress").style.width = "0%";
    document.getElementById("scanProgressText").textContent = "Отсканируйте первый QR-код.";
    document.getElementById("partsList").innerHTML = "";
    document.getElementById("resultText").value = "";
    document.getElementById("verification").classList.add("hidden");
    setScanStatus("Сборщик очищен.", "");
}

</script>
