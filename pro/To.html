<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ультразвуковой модем — тональный</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #e0e0e0; padding: 20px; text-align: center; }
        button { background: #00adb5; border: none; color: white; padding: 12px 24px; font-size: 16px; border-radius: 5px; cursor: pointer; margin: 10px; transition: 0.2s; }
        button:hover { background: #008a92; }
        button:active { background: #007a80; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        input { padding: 10px; font-size: 16px; width: 80%; max-width: 300px; border-radius: 5px; border: 1px solid #333; background: #222; color: white; }
        .box { background: #1e1e1e; padding: 15px; border-radius: 8px; margin: 20px auto; max-width: 450px; border: 1px solid #333; }
        #log { font-family: monospace; color: #888; font-size: 12px; max-height: 150px; overflow-y: auto; text-align: left; background: #000; padding: 10px; border-radius: 5px; }
        #output { font-size: 28px; font-weight: bold; color: #00adb5; margin-top: 10px; min-height: 45px; letter-spacing: 2px; }
        .status { color: #aaa; font-size: 13px; margin-top: 5px; }
        .freq-badge { display: inline-block; background: #2a2a2a; padding: 2px 10px; border-radius: 12px; margin: 2px; font-size: 11px; color: #00adb5; }
        #progress { width: 100%; height: 4px; background: #333; border-radius: 2px; margin: 10px 0; overflow: hidden; }
        #progress-bar { height: 100%; width: 0%; background: #00adb5; transition: width 0.1s; }
    </style>
</head>
<body>

    <h1>🔊 Ultrasonic Tone Modem</h1>
    <button id="initBtn">🎤 Включить звук / микрофон</button>

    <div class="box">
        <h3>📤 Передатчик (Tx)</h3>
        <input type="text" id="textInput" value="HELLO WORLD" placeholder="Текст (A-Z, пробел)">
        <br>
        <button id="sendBtn" disabled>📡 Отправить тонами</button>
        <div id="progress"><div id="progress-bar"></div></div>
        <div class="status">
            <span>Частоты: </span>
            <span class="freq-badge">A=17.0кГц</span>
            <span class="freq-badge">Z=20.5кГц</span>
            <span class="freq-badge">шаг=135Гц</span>
        </div>
    </div>

    <div class="box">
        <h3>📥 Приемник (Rx)</h3>
        <div>Получено:</div>
        <div id="output">⏳ ожидание...</div>
    </div>

    <div class="box">
        <h3>📋 Технический лог</h3>
        <div id="log"></div>
    </div>

<script>
    // ============================================================
    //  ТОНАЛЬНОЕ КОДИРОВАНИЕ
    //  Каждая буква → своя частота в ультразвуковом диапазоне
    // ============================================================
    const ALPHABET = " ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    const BASE_FREQ = 17000;        // 17 кГц — буква 'A'
    const FREQ_STEP = 135;          // шаг 135 Гц на букву
    const TONE_DURATION = 0.08;     // длительность тона 80 мс
    const SILENCE_GAP = 0.04;       // пауза между тонами 40 мс (для разделения)

    // Время на один символ (тон + пауза)
    const SYMBOL_TIME = TONE_DURATION + SILENCE_GAP;

    let audioCtx = null;
    let analyser = null;
    let isListening = false;
    let isSending = false;

    // ---- Логирование ----
    function log(msg) {
        const logDiv = document.getElementById('log');
        logDiv.innerHTML += msg + '<br>';
        logDiv.scrollTop = logDiv.scrollHeight;
    }

    // ---- Прогресс-бар ----
    function setProgress(pct) {
        document.getElementById('progress-bar').style.width = Math.min(100, pct) + '%';
    }

    // ---- Инициализация ----
    document.getElementById('initBtn').addEventListener('click', async () => {
        if (audioCtx) return;
        try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            document.getElementById('sendBtn').disabled = false;
            document.getElementById('initBtn').innerText = "✅ Звук готов";
            document.getElementById('initBtn').style.background = "#28a745";
            await initReceiver();
            log("🔊 Аудио система активирована");
        } catch (e) {
            alert("Ошибка: " + e.message);
            log("❌ Ошибка инициализации: " + e.message);
        }
    });

    // ============================================================
    //  ПЕРЕДАТЧИК — генерация тоновых посылок
    // ============================================================
    function playTone(frequency, startTime, duration) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(frequency, startTime);

        // Плавное включение/выключение (убирает щелчки)
        gain.gain.setValueAtTime(0, startTime);
        gain.gain.linearRampToValueAtTime(0.7, startTime + 0.005);
        gain.gain.setValueAtTime(0.7, startTime + duration - 0.005);
        gain.gain.linearRampToValueAtTime(0, startTime + duration);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(startTime);
        osc.stop(startTime + duration);
    }

    function getFrequency(char) {
        const idx = ALPHABET.indexOf(char);
        if (idx === -1) return null;
        return BASE_FREQ + (idx * FREQ_STEP);
    }

    document.getElementById('sendBtn').addEventListener('click', () => {
        if (isSending) return;
        const text = document.getElementById('textInput').value.toUpperCase().trim();
        if (!text) {
            log("⚠️ Введите текст");
            return;
        }

        isSending = true;
        document.getElementById('sendBtn').disabled = true;
        document.getElementById('sendBtn').innerText = "⏳ Передача...";
        setProgress(0);

        log(`📤 Начало передачи: "${text}" (${text.length} символов)`);

        let startTime = audioCtx.currentTime + 0.15;
        const totalDuration = text.length * SYMBOL_TIME + 0.2;

        // ---- СТАРТОВЫЙ СИГНАЛ (синхронизация) ----
        // Короткий импульс на частоте 19 кГц (маркер начала)
        playTone(19000, startTime, 0.06);
        log(`[Tx] 🟢 Стартовый маркер (19кГц) в ${startTime.toFixed(3)}`);
        startTime += 0.15; // пауза после старта

        // ---- ПЕРЕДАЧА СИМВОЛОВ ----
        for (let i = 0; i < text.length; i++) {
            const char = text[i];
            const freq = getFrequency(char);
            if (freq === null) {
                log(`⚠️ Символ '${char}' пропущен (не в алфавите)`);
                startTime += SYMBOL_TIME;
                continue;
            }

            // Время начала тона
            const toneStart = startTime;
            playTone(freq, toneStart, TONE_DURATION);

            const freqKHz = (freq / 1000).toFixed(1);
            log(`[Tx] '${char}' → ${freqKHz}кГц в ${toneStart.toFixed(3)}`);

            // Сдвигаем время на длительность символа
            startTime += SYMBOL_TIME;

            // Обновляем прогресс
            const progress = ((i + 1) / text.length) * 100;
            setProgress(progress);
        }

        // ---- ЗАВЕРШАЮЩИЙ МАРКЕР ----
        playTone(19500, startTime, 0.06);
        log(`[Tx] 🔴 Финишный маркер (19.5кГц) в ${startTime.toFixed(3)}`);

        // Восстанавливаем кнопку через пару секунд
        setTimeout(() => {
            isSending = false;
            document.getElementById('sendBtn').disabled = false;
            document.getElementById('sendBtn').innerText = "📡 Отправить тонами";
            setProgress(0);
            log("✅ Передача завершена");
        }, (totalDuration + 0.5) * 1000);
    });

    // ============================================================
    //  ПРИЕМНИК — детектирование тонов по частоте
    // ============================================================
    async function initReceiver() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                audio: {
                    echoCancellation: false,
                    noiseSuppression: false,
                    autoGainControl: false
                }
            });

            const source = audioCtx.createMediaStreamSource(stream);
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 4096;        // больше разрешение по частоте
            analyser.smoothingTimeConstant = 0.8;
            source.connect(analyser);

            isListening = true;
            log("[Rx] 🎤 Микрофон активен, фильтры отключены");
            log(`[Rx] Разрешение: ~${(audioCtx.sampleRate / analyser.fftSize).toFixed(1)} Гц/бин`);

            // Запускаем детектор
            detectTones();
        } catch (err) {
            log("[Rx] ❌ Ошибка микрофона: " + err);
        }
    }

    // ---- Детектор тонов ----
    let lastDetectedTime = 0;
    let decodingBuffer = "";
    let isReceiving = false;
    let receiveTimeout = null;

    // Частоты для стартового и финишного маркеров
    const START_FREQ = 19000;
    const STOP_FREQ = 19500;
    const FREQ_TOLERANCE = 80; // Гц

    function detectTones() {
        if (!isListening) return;
        requestAnimationFrame(detectTones);

        const bufferLength = analyser.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);
        analyser.getByteFrequencyData(dataArray);

        const sampleRate = audioCtx.sampleRate;
        const fftSize = analyser.fftSize;
        const now = audioCtx.currentTime;

        // --- Находим доминирующую частоту ---
        let maxPower = 0;
        let maxIndex = 0;
        for (let i = 0; i < bufferLength; i++) {
            if (dataArray[i] > maxPower) {
                maxPower = dataArray[i];
                maxIndex = i;
            }
        }

        // Если сигнал слишком слабый — игнорируем
        if (maxPower < 25) {
            // Сбрасываем прием, если долго тишина
            if (isReceiving && (now - lastDetectedTime > 1.5)) {
                isReceiving = false;
                if (decodingBuffer.length > 0) {
                    log(`[Rx] ⏹️ Прием завершен (таймаут). Получено: "${decodingBuffer}"`);
                }
                decodingBuffer = "";
            }
            return;
        }

        // Частота доминирующего бина
        const freq = (maxIndex * sampleRate) / fftSize;

        // ---- Обработка маркеров ----
        if (Math.abs(freq - START_FREQ) < FREQ_TOLERANCE && maxPower > 30) {
            if (!isReceiving) {
                isReceiving = true;
                decodingBuffer = "";
                document.getElementById('output').innerText = "";
                log(`[Rx] 🟢 СТАРТ ПРИЕМА (частота ${freq.toFixed(0)} Гц)`);
            }
            lastDetectedTime = now;
            return;
        }

        if (Math.abs(freq - STOP_FREQ) < FREQ_TOLERANCE && maxPower > 30 && isReceiving) {
            log(`[Rx] 🔴 ФИНИШ (${freq.toFixed(0)} Гц). Итог: "${decodingBuffer}"`);
            isReceiving = false;
            if (decodingBuffer.length > 0) {
                document.getElementById('output').innerText = decodingBuffer;
            }
            lastDetectedTime = now;
            return;
        }

        // ---- Если мы в режиме приема — декодируем символ ----
        if (isReceiving && maxPower > 30) {
            // Проверяем, что прошло достаточно времени с последнего тона
            if (now - lastDetectedTime < SYMBOL_TIME * 0.3) {
                return; // защита от множественных срабатываний
            }

            // Находим ближайший символ по частоте
            let bestChar = null;
            let bestDiff = Infinity;

            for (let i = 0; i < ALPHABET.length; i++) {
                const targetFreq = BASE_FREQ + (i * FREQ_STEP);
                const diff = Math.abs(freq - targetFreq);
                if (diff < bestDiff) {
                    bestDiff = diff;
                    bestChar = ALPHABET[i];
                }
            }

            // Проверяем, что частота достаточно близка к ожидаемой
            if (bestDiff < FREQ_TOLERANCE && bestChar !== null) {
                const freqKHz = (freq / 1000).toFixed(1);
                log(`[Rx] 🎵 '${bestChar}' (${freqKHz}кГц, погр.${bestDiff.toFixed(0)}Гц)`);
                decodingBuffer += bestChar;
                document.getElementById('output').innerText = decodingBuffer;
                lastDetectedTime = now;
            } else {
                // Если частота не распознана, но это не маркер — возможно шум
                if (freq > 16000 && freq < 22000) {
                    log(`[Rx] ❓ Неизвестный тон: ${freq.toFixed(0)} Гц (${maxPower})`);
                }
                lastDetectedTime = now;
            }
        }
    }

    // ---- Доп. функция: сброс приема ----
    function resetReceiver() {
        isReceiving = false;
        decodingBuffer = "";
        document.getElementById('output').innerText = "⏳ ожидание...";
        log("[Rx] 🔄 Прием сброшен");
    }

    // Обработчик клавиши Enter для отправки
    document.getElementById('textInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            document.getElementById('sendBtn').click();
        }
    });

    log("🚀 Модем загружен. Нажмите 'Включить звук' для старта.");
</script>
</body>
</html>
