<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎵 QR-Аудио Кодер/Декодер</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/jsqr@1.4.0/dist/jsQR.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #0b1b33;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }
        .card {
            max-width: 750px;
            width: 100%;
            background: white;
            border-radius: 28px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 { font-size: 24px; display: flex; gap: 8px; align-items: center; }
        .sub { 
            color: #4a5a72; 
            margin-bottom: 16px; 
            font-size: 13px;
            background: #f0f4fe;
            padding: 8px 14px;
            border-radius: 12px;
        }
        .section {
            background: #f8faff;
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 14px;
            border: 1px solid #e9edf4;
        }
        .btn {
            background: #1a2a4a;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 60px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn:hover { background: #2b3f64; transform: scale(1.02); }
        .btn-success { background: #0f7b3a; }
        .btn-success:hover { background: #1a8f48; }
        .btn-danger { background: #b91c1c; }
        .btn-danger:hover { background: #991b1b; }
        .btn-outline { background: transparent; border: 2px solid #d0d8e6; color: #1a2a4a; }
        .btn-outline:hover { background: #f0f4fe; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .flex-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .qr-container { display: flex; justify-content: center; margin: 12px 0; }
        #qrcode canvas { max-width: 180px; height: auto; }
        .status {
            padding: 8px 14px;
            border-radius: 40px;
            font-size: 13px;
            text-align: center;
            margin: 6px 0;
            font-weight: 500;
        }
        .status.info { background: #dbeafe; color: #1e3a8a; }
        .status.success { background: #dcfce7; color: #166534; }
        .status.error { background: #fee2e2; color: #991b1b; }
        .formula-box {
            background: #0b1b33;
            color: #60a5fa;
            padding: 10px 14px;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            margin: 6px 0;
            overflow-x: auto;
        }
        .progress-bar {
            height: 8px;
            background: #e2e8f0;
            border-radius: 12px;
            overflow: hidden;
            margin: 8px 0;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6);
            transition: width 0.3s ease;
        }
        .progress-text {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #4a5a72;
        }
        audio { width: 100%; margin: 6px 0; border-radius: 40px; }
        .file-input-wrap {
            position: relative;
            display: inline-block;
        }
        .file-input-wrap input[type="file"] {
            position: absolute;
            left: 0; top: 0;
            opacity: 0;
            width: 100%; height: 100%;
            cursor: pointer;
        }
        .badge {
            background: #eef2f9;
            padding: 4px 14px;
            border-radius: 60px;
            font-size: 12px;
            color: #1f2a44;
            display: inline-block;
        }
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 4px 10px;
            font-size: 12px;
            background: white;
            padding: 8px 12px;
            border-radius: 10px;
            margin: 6px 0;
        }
        @media (max-width: 480px) {
            .card { padding: 14px; }
            .flex-row { flex-direction: column; align-items: stretch; }
            .btn { justify-content: center; }
            .info-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>
<div class="card">
    <h1>🎵 QR-Аудио</h1>
    <div class="sub">
        ⚡ Кодируем звук в QR-коды и декодируем обратно
    </div>

    <!-- ============ КОДИРОВАНИЕ ============ -->
    <div class="section">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
            <span style="font-weight:600;font-size:15px;">📤 Кодирование</span>
            <span class="badge" id="encodeStatus">Готово</span>
        </div>

        <div class="flex-row">
            <div class="file-input-wrap">
                <button class="btn btn-success">📁 Выбрать аудио</button>
                <input type="file" id="audioFileInput" accept="audio/*">
            </div>
            <button class="btn btn-outline" id="clearBtn">🧹 Очистить</button>
        </div>

        <div id="audioInfo" style="display:none;margin-top:10px;">
            <audio controls id="audioPlayer"></audio>
            <div class="info-grid">
                <span>📄 Имя: <span id="fileNameDisplay">—</span></span>
                <span>📏 Размер: <span id="fileSizeDisplay">—</span></span>
                <span>📦 Частей: <span id="partsCountDisplay">—</span></span>
            </div>
            <button class="btn" id="encodeBtn" style="width:100%;margin-top:6px;">
                🔗 Закодировать в QR-коды
            </button>
        </div>
    </div>

    <!-- ============ РЕЗУЛЬТАТ КОДИРОВАНИЯ ============ -->
    <div id="encodingResult" style="display:none;">
        <div class="section">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
                <span style="font-weight:600;font-size:15px;">📦 QR-коды созданы</span>
                <span class="badge" id="resultPartsCount">0</span>
            </div>

            <div id="qrGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:10px 0;">
            </div>

            <div class="flex-row" style="justify-content:center;">
                <button class="btn btn-success" id="downloadAllQRBtn">💾 Скачать все QR</button>
                <button class="btn btn-outline" id="downloadMainQRBtn">⭐ Скачать главный</button>
            </div>
        </div>
    </div>

    <!-- ============ ДЕКОДИРОВАНИЕ ============ -->
    <div class="section">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
            <span style="font-weight:600;font-size:15px;">📥 Декодирование</span>
            <span class="badge" id="decodeStatus">Ожидание</span>
        </div>

        <div class="flex-row">
            <div class="file-input-wrap">
                <button class="btn btn-primary">📂 Загрузить QR</button>
                <input type="file" id="qrFileInput" accept="image/*">
            </div>
            <button class="btn btn-outline" id="clearDecodeBtn">🧹 Очистить</button>
        </div>

        <div id="decodeResult" style="display:none;margin-top:10px;">
            <div class="status info" id="decodeStatusText">🔍 Декодирование...</div>
            <div class="progress-bar"><div class="progress-fill" id="decodeProgressFill"></div></div>
            <div class="progress-text">
                <span id="decodeProgressText">0%</span>
                <span id="decodePartsText">0 / 0</span>
            </div>

            <div id="decodedAudioContainer" style="display:none;margin-top:10px;">
                <div class="status success">🎵 Звук восстановлен!</div>
                <audio controls id="decodedPlayer"></audio>
                <button class="btn btn-success" id="downloadDecodedBtn" style="width:100%;margin-top:6px;">
                    💾 Скачать звук
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    // ========================================================
    // ========== ГЛОБАЛЬНОЕ СОСТОЯНИЕ ==========
    // ========================================================
    
    let selectedFile = null;
    let qrParts = [];
    let mainQRData = null;

    // DOM элементы
    const audioFileInput = document.getElementById('audioFileInput');
    const audioInfo = document.getElementById('audioInfo');
    const audioPlayer = document.getElementById('audioPlayer');
    const fileNameDisplay = document.getElementById('fileNameDisplay');
    const fileSizeDisplay = document.getElementById('fileSizeDisplay');
    const partsCountDisplay = document.getElementById('partsCountDisplay');
    const encodeBtn = document.getElementById('encodeBtn');
    const encodingResult = document.getElementById('encodingResult');
    const qrGrid = document.getElementById('qrGrid');
    const resultPartsCount = document.getElementById('resultPartsCount');
    const downloadAllQRBtn = document.getElementById('downloadAllQRBtn');
    const downloadMainQRBtn = document.getElementById('downloadMainQRBtn');
    const clearBtn = document.getElementById('clearBtn');
    const encodeStatus = document.getElementById('encodeStatus');

    const qrFileInput = document.getElementById('qrFileInput');
    const clearDecodeBtn = document.getElementById('clearDecodeBtn');
    const decodeResult = document.getElementById('decodeResult');
    const decodeStatusText = document.getElementById('decodeStatusText');
    const decodeProgressFill = document.getElementById('decodeProgressFill');
    const decodeProgressText = document.getElementById('decodeProgressText');
    const decodePartsText = document.getElementById('decodePartsText');
    const decodedAudioContainer = document.getElementById('decodedAudioContainer');
    const decodedPlayer = document.getElementById('decodedPlayer');
    const downloadDecodedBtn = document.getElementById('downloadDecodedBtn');
    const decodeStatus = document.getElementById('decodeStatus');

    // ========================================================
    // ========== КОДИРОВАНИЕ ==========
    // ========================================================
    
    // Загрузка аудиофайла
    audioFileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        
        selectedFile = file;
        const url = URL.createObjectURL(file);
        audioPlayer.src = url;
        audioInfo.style.display = 'block';
        fileNameDisplay.textContent = file.name;
        fileSizeDisplay.textContent = formatSize(file.size);
        encodingResult.style.display = 'none';
        encodeStatus.textContent = '📁 Файл загружен';
    });

    function formatSize(bytes) {
        if (bytes < 1024) return bytes + ' B';
        if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
        return (bytes / 1048576).toFixed(1) + ' MB';
    }

    // Кодирование в QR-коды
    encodeBtn.addEventListener('click', () => {
        if (!selectedFile) return;

        const reader = new FileReader();
        reader.onload = (e) => {
            // Получаем base64 данные
            const base64 = e.target.result.split(',')[1];
            
            // Оптимальный размер чанка для QR-кода (~3KB)
            const CHUNK_SIZE = 2800;
            const parts = [];
            
            for (let i = 0; i < base64.length; i += CHUNK_SIZE) {
                parts.push(base64.substring(i, i + CHUNK_SIZE));
            }
            
            console.log(`📊 Данные: ${base64.length} символов, ${parts.length} частей`);
            
            qrParts = parts;
            
            // Показываем QR-коды
            displayQRs(parts);
            
            encodingResult.style.display = 'block';
            resultPartsCount.textContent = parts.length + ' частей';
            partsCountDisplay.textContent = parts.length;
            encodeStatus.textContent = `✅ ${parts.length} частей`;
        };
        reader.readAsDataURL(selectedFile);
    });

    // Отображение QR-кодов
    function displayQRs(parts) {
        qrGrid.innerHTML = '';
        
        parts.forEach((part, index) => {
            const div = document.createElement('div');
            div.style.cssText = 'background:white;border-radius:12px;padding:10px;border:2px solid #e9edf4;text-align:center;';
            
            // Создаём данные для QR
            const qrData = {
                index: index,
                total: parts.length,
                data: part,
                // Для главного QR добавляем метаданные
                isMain: index === 0
            };
            
            // Если это первый QR, добавляем информацию о файле
            if (index === 0) {
                qrData.fileName = selectedFile.name;
                qrData.fileType = selectedFile.type;
                qrData.fileSize = selectedFile.size;
                mainQRData = qrData;
            }
            
            const container = document.createElement('div');
            new QRCode(container, {
                text: JSON.stringify(qrData),
                width: 130,
                height: 130,
                colorDark: '#0b1b33',
                colorLight: '#ffffff',
                correctLevel: QRCode.CorrectLevel.M
            });
            
            div.appendChild(container);
            
            const label = document.createElement('div');
            label.style.cssText = 'font-size:12px;font-weight:600;color:#1a2a4a;margin-top:6px;';
            label.textContent = index === 0 ? '⭐ Главный' : `#${index + 1}`;
            div.appendChild(label);
            
            qrGrid.appendChild(div);
        });
    }

    // Скачать все QR-коды
    downloadAllQRBtn.addEventListener('click', () => {
        const canvasList = qrGrid.querySelectorAll('canvas');
        canvasList.forEach((canvas, index) => {
            setTimeout(() => {
                const link = document.createElement('a');
                link.download = `qr_part_${index + 1}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            }, index * 200);
        });
    });

    // Скачать главный QR-код
    downloadMainQRBtn.addEventListener('click', () => {
        const firstCanvas = qrGrid.querySelector('canvas');
        if (firstCanvas) {
            const link = document.createElement('a');
            link.download = 'main_qr.png';
            link.href = firstCanvas.toDataURL('image/png');
            link.click();
        }
    });

    // ========================================================
    // ========== ДЕКОДИРОВАНИЕ ==========
    // ========================================================
    
    let decodedParts = [];
    let expectedTotal = 0;

    qrFileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                canvas.width = img.width;
                canvas.height = img.height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0);
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                
                const code = jsQR(imageData.data, imageData.width, imageData.height);
                if (code && code.data) {
                    processQRData(code.data);
                } else {
                    decodeStatus.textContent = '❌ Не удалось распознать QR';
                    decodeStatus.style.background = '#fee2e2';
                    decodeStatus.style.color = '#991b1b';
                    decodeStatusText.textContent = '❌ QR-код не распознан';
                }
            };
            img.src = event.target.result;
        };
        reader.readAsDataURL(file);
    });

    function processQRData(qrText) {
        try {
            const data = JSON.parse(qrText);
            
            if (!data.data) {
                throw new Error('Неверный формат QR-кода');
            }
            
            // Если это главный QR
            if (data.isMain || data.index === 0) {
                expectedTotal = data.total || 1;
                decodedParts = new Array(expectedTotal);
                decodedParts[0] = data.data;
                
                decodeResult.style.display = 'block';
                decodedAudioContainer.style.display = 'none';
                decodeStatus.style.background = '#dbeafe';
                decodeStatus.style.color = '#1e3a8a';
                decodeStatus.textContent = '🔄 Декодирование...';
                decodeStatusText.textContent = `🔍 Загружен главный QR (1/${expectedTotal})`;
                
                updateDecodeProgress();
                
                // Если всего одна часть
                if (expectedTotal === 1) {
                    assembleAudio();
                } else {
                    decodeStatusText.textContent = `📸 Отсканируйте остальные ${expectedTotal - 1} QR-кодов`;
                }
                return;
            }
            
            // Если это обычная часть
            if (data.index !== undefined && data.data) {
                if (data.index < expectedTotal && !decodedParts[data.index]) {
                    decodedParts[data.index] = data.data;
                    updateDecodeProgress();
                    
                    // Проверяем, все ли части собраны
                    const allCollected = decodedParts.every(p => p !== undefined);
                    if (allCollected) {
                        assembleAudio();
                    } else {
                        const count = decodedParts.filter(p => p).length;
                        decodeStatusText.textContent = `📸 Собрано ${count}/${expectedTotal} частей`;
                    }
                }
            }
            
        } catch (e) {
            decodeStatus.textContent = '❌ Ошибка: ' + e.message;
            decodeStatus.style.background = '#fee2e2';
            decodeStatus.style.color = '#991b1b';
            decodeStatusText.textContent = '❌ ' + e.message;
        }
    }

    function updateDecodeProgress() {
        if (!expectedTotal) return;
        const count = decodedParts.filter(p => p).length;
        const progress = Math.min(100, Math.round((count / expectedTotal) * 100));
        
        decodeProgressFill.style.width = progress + '%';
        decodeProgressText.textContent = progress + '%';
        decodePartsText.textContent = `${count} / ${expectedTotal}`;
    }

    function assembleAudio() {
        try {
            // Собираем все части
            let fullData = '';
            for (let i = 0; i < expectedTotal; i++) {
                if (decodedParts[i]) {
                    fullData += decodedParts[i];
                }
            }
            
            if (!fullData) {
                throw new Error('Нет данных для сборки');
            }
            
            // Декодируем из base64
            const binaryString = atob(fullData);
            const bytes = new Uint8Array(binaryString.length);
            for (let i = 0; i < binaryString.length; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }
            
            // Определяем тип файла
            let mimeType = 'audio/webm;codecs=opus';
            if (selectedFile) {
                mimeType = selectedFile.type || mimeType;
            }
            
            const blob = new Blob([bytes], { type: mimeType });
            const url = URL.createObjectURL(blob);
            
            decodedPlayer.src = url;
            decodedAudioContainer.style.display = 'block';
            
            downloadDecodedBtn.onclick = () => {
                const a = document.createElement('a');
                a.href = url;
                a.download = selectedFile ? selectedFile.name : 'restored_audio.webm';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            };
            
            decodeStatusText.textContent = '🎵 Звук успешно восстановлен!';
            decodeStatus.textContent = '✅ Восстановлено!';
            decodeStatus.style.background = '#dcfce7';
            decodeStatus.style.color = '#166534';
            
        } catch (e) {
            decodeStatusText.textContent = '❌ Ошибка сборки: ' + e.message;
            decodeStatus.textContent = '❌ Ошибка';
            decodeStatus.style.background = '#fee2e2';
            decodeStatus.style.color = '#991b1b';
        }
    }

    // ========================================================
    // ========== ОЧИСТКА ==========
    // ========================================================
    
    clearBtn.addEventListener('click', () => {
        selectedFile = null;
        qrParts = [];
        audioInfo.style.display = 'none';
        encodingResult.style.display = 'none';
        qrGrid.innerHTML = '';
        audioFileInput.value = '';
        audioPlayer.src = '';
        encodeStatus.textContent = 'Готово';
    });

    clearDecodeBtn.addEventListener('click', () => {
        decodedParts = [];
        expectedTotal = 0;
        decodeResult.style.display = 'none';
        decodedAudioContainer.style.display = 'none';
        qrFileInput.value = '';
        decodeStatus.textContent = 'Ожидание';
        decodeStatus.style.background = '#eef2f9';
        decodeStatus.style.color = '#1f2a44';
        decodeStatusText.textContent = '📷 Загрузите QR-код для декодирования';
    });
</script>
</body>
</html>
