<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧬 QR-Матрёшка: Один QR → Бесконечность</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, sans-serif;
            background: #0b1b33;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .card {
            max-width: 700px;
            width: 100%;
            background: white;
            border-radius: 28px;
            padding: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 { font-size: 24px; display: flex; gap: 8px; align-items: center; }
        .sub { color: #4a5a72; margin-bottom: 16px; font-size: 14px; }
        .section {
            background: #f8faff;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .btn {
            background: #1a2a4a;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 60px;
            font-size: 14px;
            cursor: pointer;
            transition: 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn:hover { background: #2b3f64; }
        .btn-success { background: #0f7b3a; }
        .btn-success:hover { background: #1a8f48; }
        .btn-danger { background: #b91c1c; }
        .btn-danger:hover { background: #991b1b; }
        .btn-outline { background: transparent; border: 1px solid #d0d8e6; color: #1a2a4a; }
        .btn-outline:hover { background: #f0f4fe; }
        .flex-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .qr-container { display: flex; justify-content: center; margin: 12px 0; }
        #qrcode canvas { max-width: 200px; height: auto; }
        .progress-bar {
            height: 8px;
            background: #e2e8f0;
            border-radius: 12px;
            overflow: hidden;
            margin: 8px 0;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #2563eb);
            transition: width 0.3s ease;
        }
        .status {
            padding: 10px 16px;
            border-radius: 40px;
            font-size: 14px;
            text-align: center;
            margin: 8px 0;
        }
        .status.success { background: #dcfce7; color: #166534; }
        .status.error { background: #fee2e2; color: #991b1b; }
        .status.info { background: #dbeafe; color: #1e3a8a; }
        .data-output {
            background: #0b1b33;
            color: #60a5fa;
            padding: 12px;
            border-radius: 12px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 120px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
            margin: 8px 0;
        }
        audio { width: 100%; margin: 8px 0; border-radius: 40px; }
        .formula-box {
            background: #f0f4fe;
            padding: 10px 14px;
            border-radius: 12px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            border: 1px dashed #3b82f6;
            margin: 8px 0;
        }
        .matrix-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 8px;
            margin: 12px 0;
        }
        .matrix-item {
            background: white;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid #e9edf4;
            text-align: center;
            font-size: 12px;
        }
        .matrix-item canvas { max-width: 100%; height: auto; }
    </style>
</head>
<body>
<div class="card">
    <h1>🧬 QR-Матрёшка</h1>
    <div class="sub">Один QR-код → Бесконечная цепочка → Звук</div>

    <div class="section">
        <div class="flex-row">
            <button class="btn btn-success" id="recordBtn">🎙️ Записать звук</button>
            <button class="btn btn-danger" id="stopRecordBtn" disabled>⏹️ Остановить</button>
            <button class="btn btn-outline" id="clearBtn">🧹 Очистить</button>
        </div>
        <div id="recordingStatus" style="display:none;" class="status info">🔴 Идёт запись...</div>
        <div id="audioPreview" style="display:none;">
            <audio controls id="audioPlayer"></audio>
            <button class="btn" id="encodeBtn" style="width:100%;margin-top:8px;">🧬 Создать QR-Матрёшку</button>
        </div>
    </div>

    <div id="matryoshkaResult" style="display:none;">
        <div class="section">
            <div class="status success">✅ QR-Матрёшка создана!</div>
            
            <div class="formula-box">
                🧬 Формула: <strong id="formulaDisplay">x = (x * 9301 + 49297) % 233280</strong>
            </div>

            <div class="qr-container">
                <div id="mainQR"></div>
            </div>

            <div style="text-align:center;font-size:13px;color:#4a5a72;margin:8px 0;">
                ⬇️ Скачайте этот QR-код — он содержит всё!
            </div>

            <button class="btn btn-success" id="downloadMainQR" style="width:100%;">💾 Скачать QR-Матрёшку</button>

            <div style="margin-top:12px;">
                <button class="btn btn-outline" id="expandBtn" style="width:100%;">🔍 Развернуть матрёшку</button>
            </div>

            <div id="expandedChain" style="display:none;margin-top:12px;">
                <div class="status info">🔍 Матрёшка разворачивается...</div>
                <div class="matrix-grid" id="chainGrid"></div>
                <div class="progress-bar"><div class="progress-fill" id="expandProgress"></div></div>
                <div style="display:flex;justify-content:space-between;font-size:13px;color:#4a5a72;">
                    <span id="expandStatus">0 из 0 частей</span>
                    <span id="expandPercent">0%</span>
                </div>

                <div id="restoredAudioContainer" style="display:none;margin-top:12px;">
                    <div class="status success">🎵 Звук восстановлен из матрёшки!</div>
                    <audio controls id="restoredPlayer"></audio>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // ========================================================
    // ========== СОСТОЯНИЕ ==========
    // ========================================================
    let mediaRecorder = null;
    let audioChunks = [];
    let audioBlob = null;
    let mainQRData = null;
    const FORMULA = "x = (x * 9301 + 49297) % 233280";
    let currentSeed = 12345;

    // DOM элементы
    const recordBtn = document.getElementById('recordBtn');
    const stopRecordBtn = document.getElementById('stopRecordBtn');
    const recordingStatus = document.getElementById('recordingStatus');
    const audioPreview = document.getElementById('audioPreview');
    const audioPlayer = document.getElementById('audioPlayer');
    const encodeBtn = document.getElementById('encodeBtn');
    const matryoshkaResult = document.getElementById('matryoshkaResult');
    const mainQR = document.getElementById('mainQR');
    const formulaDisplay = document.getElementById('formulaDisplay');
    const downloadMainQR = document.getElementById('downloadMainQR');
    const expandBtn = document.getElementById('expandBtn');
    const expandedChain = document.getElementById('expandedChain');
    const chainGrid = document.getElementById('chainGrid');
    const expandProgress = document.getElementById('expandProgress');
    const expandStatus = document.getElementById('expandStatus');
    const expandPercent = document.getElementById('expandPercent');
    const restoredAudioContainer = document.getElementById('restoredAudioContainer');
    const restoredPlayer = document.getElementById('restoredPlayer');
    const clearBtn = document.getElementById('clearBtn');

    formulaDisplay.textContent = FORMULA;

    // ========================================================
    // ========== ЗАПИСЬ ==========
    // ========================================================
    recordBtn.addEventListener('click', async () => {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream, {
                mimeType: 'audio/webm;codecs=opus'
            });
            audioChunks = [];

            mediaRecorder.ondataavailable = (e) => {
                if (e.data.size > 0) audioChunks.push(e.data);
            };

            mediaRecorder.onstop = () => {
                audioBlob = new Blob(audioChunks, { type: 'audio/webm;codecs=opus' });
                const url = URL.createObjectURL(audioBlob);
                audioPlayer.src = url;
                audioPreview.style.display = 'block';
                recordingStatus.style.display = 'none';
                recordBtn.disabled = false;
                stopRecordBtn.disabled = true;
                recordBtn.textContent = '🎙️ Записать ещё';
            };

            mediaRecorder.start();
            recordingStatus.style.display = 'block';
            recordBtn.disabled = true;
            stopRecordBtn.disabled = false;
            audioPreview.style.display = 'none';
            matryoshkaResult.style.display = 'none';
            
        } catch (err) {
            alert('Ошибка доступа к микрофону: ' + err.message);
        }
    });

    stopRecordBtn.addEventListener('click', () => {
        if (mediaRecorder && mediaRecorder.state === 'recording') {
            mediaRecorder.stop();
            mediaRecorder.stream.getTracks().forEach(track => track.stop());
        }
    });

    // ========================================================
    // ========== СОЗДАНИЕ QR-МАТРЁШКИ ==========
    // ========================================================
    encodeBtn.addEventListener('click', () => {
        if (!audioBlob) return;

        const reader = new FileReader();
        reader.onload = (e) => {
            const base64 = e.target.result.split(',')[1];
            
            // Разбиваем на части
            const chunkSize = 1300;
            const chunks = [];
            for (let i = 0; i < base64.length; i += chunkSize) {
                chunks.push(base64.substring(i, i + chunkSize));
            }

            // Создаём QR-цепочку
            const qrChain = [];
            let seed = 12345;

            chunks.forEach((chunk, index) => {
                const qrData = {
                    index: index,
                    total: chunks.length,
                    seed: seed,
                    formula: FORMULA,
                    data: chunk
                };
                seed = (seed * 9301 + 49297) % 233280;
                qrData.nextSeed = seed;
                qrChain.push(qrData);
            });

            // Сохраняем ВСЁ в один главный QR-код
            mainQRData = {
                type: 'matryoshka',
                formula: FORMULA,
                seed: 12345,
                total: chunks.length,
                data: chunks.join('|') // Все части в одной строке
            };

            // Создаём главный QR-код
            mainQR.innerHTML = '';
            const mainData = JSON.stringify(mainQRData);
            new QRCode(mainQR, {
                text: mainData,
                width: 200,
                height: 200,
                colorDark: '#0b1b33',
                colorLight: '#ffffff',
                correctLevel: QRCode.CorrectLevel.M
            });

            matryoshkaResult.style.display = 'block';
            expandedChain.style.display = 'none';
        };
        reader.readAsDataURL(audioBlob);
    });

    // ========================================================
    // ========== СКАЧАТЬ QR-МАТРЁШКУ ==========
    // ========================================================
    downloadMainQR.addEventListener('click', () => {
        const canvas = mainQR.querySelector('canvas');
        if (canvas) {
            const link = document.createElement('a');
            link.download = 'qr_matryoshka.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
    });

    // ========================================================
    // ========== РАЗВЕРНУТЬ МАТРЁШКУ ==========
    // ========================================================
    expandBtn.addEventListener('click', () => {
        if (!mainQRData) return;

        expandedChain.style.display = 'block';
        chainGrid.innerHTML = '';
        restoredAudioContainer.style.display = 'none';

        // Разбиваем данные на части
        const parts = mainQRData.data.split('|');
        const total = parts.length;

        // Создаём QR-коды для каждой части
        parts.forEach((part, index) => {
            const div = document.createElement('div');
            div.className = 'matrix-item';
            
            const container = document.createElement('div');
            const qrData = JSON.stringify({
                idx: index,
                total: total,
                data: part
            });
            
            new QRCode(container, {
                text: qrData,
                width: 100,
                height: 100,
                colorDark: '#0b1b33',
                colorLight: '#ffffff',
                correctLevel: QRCode.CorrectLevel.M
            });
            
            div.appendChild(container);
            div.innerHTML += `<div style="margin-top:4px;font-weight:600;">Часть ${index + 1}</div>`;
            chainGrid.appendChild(div);
        });

        // Обновляем прогресс
        expandProgress.style.width = '100%';
        expandStatus.textContent = `${total} из ${total} частей`;
        expandPercent.textContent = '100%';

        // Восстанавливаем звук из частей
        let fullData = '';
        for (let i = 0; i < parts.length; i++) {
            fullData += parts[i] || '';
        }

        try {
            const binaryString = atob(fullData);
            const bytes = new Uint8Array(binaryString.length);
            for (let i = 0; i < binaryString.length; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }
            const blob = new Blob([bytes], { type: 'audio/webm;codecs=opus' });
            const url = URL.createObjectURL(blob);
            
            restoredPlayer.src = url;
            restoredAudioContainer.style.display = 'block';
            
            expandStatus.textContent = '🎵 Звук восстановлен!';
        } catch (e) {
            alert('Ошибка восстановления звука: ' + e.message);
        }
    });

    // ========================================================
    // ========== ОЧИСТКА ==========
    // ========================================================
    clearBtn.addEventListener('click', () => {
        audioBlob = null;
        mainQRData = null;
        audioPreview.style.display = 'none';
        matryoshkaResult.style.display = 'none';
        expandedChain.style.display = 'none';
        chainGrid.innerHTML = '';
        mainQR.innerHTML = '';
        recordBtn.textContent = '🎙️ Записать звук';
        recordBtn.disabled = false;
        stopRecordBtn.disabled = true;
        audioPlayer.src = '';
    });

    // Инициализация
    stopRecordBtn.disabled = true;
</script>
</body>
</html>
