<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ужималка с предпросмотром веса</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: linear-gradient(145deg, #f5f7fa 0%, #e2e8f0 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
            padding: 16px;
        }
        .card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 48px 48px 32px 32px;
            box-shadow: 0 25px 50px -10px rgba(0, 0, 0, 0.25), inset 0 1px 2px rgba(255,255,255,0.7);
            width: 100%;
            max-width: 720px;
            padding: 28px 24px 36px;
            border: 1px solid rgba(255,255,255,0.4);
            transition: all 0.2s;
        }
        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: #0f172a;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid rgba(0,0,0,0.04);
            padding-bottom: 16px;
        }
        h1 span {
            background: #1e293b;
            color: white;
            font-size: 0.9rem;
            font-weight: 500;
            padding: 4px 14px;
            border-radius: 40px;
            margin-left: auto;
            letter-spacing: 0;
        }
        .drop-zone {
            background: rgba(255, 255, 255, 0.5);
            border: 2px dashed #94a3b8;
            border-radius: 32px;
            padding: 40px 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s ease;
            margin-bottom: 24px;
            backdrop-filter: blur(2px);
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.02);
        }
        .drop-zone:hover, .drop-zone.dragover {
            border-color: #2563eb;
            background: rgba(37, 99, 235, 0.06);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.08);
            transform: scale(1.01);
        }
        .drop-zone-icon {
            font-size: 3.4rem;
            line-height: 1.2;
            margin-bottom: 6px;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.04));
        }
        .drop-zone p {
            color: #1e293b;
            font-weight: 450;
            font-size: 1.1rem;
        }
        .drop-zone small {
            display: block;
            color: #64748b;
            margin-top: 10px;
            font-size: 0.85rem;
        }
        .file-input {
            display: none;
        }
        .control-panel {
            background: rgba(255,255,255,0.4);
            backdrop-filter: blur(2px);
            border-radius: 36px;
            padding: 18px 20px 22px;
            margin: 6px 0 18px;
            border: 1px solid rgba(255,255,255,0.5);
            box-shadow: 0 6px 14px rgba(0,0,0,0.02);
        }
        .slider-row {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }
        .slider-row label {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 2 1 180px;
            font-weight: 500;
            color: #0f172a;
        }
        .slider-row label span:first-child {
            min-width: 70px;
        }
        .slider-row input[type="range"] {
            flex: 2;
            min-width: 110px;
            height: 6px;
            -webkit-appearance: none;
            appearance: none;
            background: #cbd5e1;
            border-radius: 10px;
            outline: none;
            transition: background 0.2s;
        }
        .slider-row input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 40px;
            background: #1e293b;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            border: 2px solid white;
            transition: 0.1s;
        }
        .slider-row input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.08);
            background: #2563eb;
        }
        .slider-row input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 40px;
            background: #1e293b;
            cursor: pointer;
            border: 2px solid white;
        }
        .quality-value {
            min-width: 44px;
            font-weight: 600;
            font-size: 1.1rem;
            color: #0f172a;
            background: white;
            padding: 2px 10px;
            border-radius: 60px;
            text-align: center;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.04);
        }
        .est-size {
            font-weight: 500;
            color: #0b3b2c;
            background: #d1fae5;
            padding: 4px 16px;
            border-radius: 60px;
            font-size: 0.95rem;
            white-space: nowrap;
            border: 1px solid #a7f3d0;
        }
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 14px;
            flex-wrap: wrap;
        }
        .btn {
            background: white;
            border: none;
            padding: 12px 22px;
            border-radius: 60px;
            font-weight: 550;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.02);
            transition: all 0.2s ease;
            cursor: pointer;
            border: 1px solid rgba(0,0,0,0.03);
            flex: 1 0 auto;
            background: #ffffffcc;
            backdrop-filter: blur(2px);
            color: #1e293b;
        }
        .btn-primary {
            background: #1e293b;
            color: white;
            box-shadow: 0 8px 18px -6px #1e293b50;
            border: 1px solid #1e293b;
            flex: 2;
        }
        .btn-primary:hover {
            background: #0f172a;
            transform: scale(0.98);
            box-shadow: 0 4px 12px -4px #0f172a70;
        }
        .btn-primary:disabled {
            opacity: 0.4;
            pointer-events: none;
            filter: grayscale(0.6);
        }
        .btn-outline {
            background: transparent;
            border: 1px solid #94a3b8;
            backdrop-filter: none;
            box-shadow: none;
        }
        .btn-outline:hover {
            background: #e2e8f0;
            border-color: #64748b;
        }
        .btn-success {
            background: #0b3b2c;
            color: white;
            border: 1px solid #0b3b2c;
            box-shadow: 0 8px 18px -6px #0b3b2c60;
        }
        .btn-success:hover {
            background: #0a2f23;
            transform: scale(0.98);
        }
        .btn-success:disabled {
            opacity: 0.4;
            pointer-events: none;
        }
        .preview-area {
            margin: 16px 0 12px;
            border-radius: 28px;
            overflow: hidden;
            background: rgba(0,0,0,0.02);
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.02);
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .preview-area img {
            display: block;
            width: 100%;
            height: auto;
            max-height: 400px;
            object-fit: contain;
            border-radius: 20px;
            background: #f1f5f9;
        }
        .preview-placeholder {
            color: #94a3b8;
            font-size: 0.9rem;
            padding: 28px 12px;
            text-align: center;
            width: 100%;
        }
        .file-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #1e293b;
            background: rgba(255,255,255,0.35);
            padding: 10px 16px;
            border-radius: 40px;
            margin: 8px 0 14px;
            backdrop-filter: blur(2px);
            flex-wrap: wrap;
            gap: 4px 14px;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .file-info span {
            background: rgba(0,0,0,0.02);
            padding: 2px 12px;
            border-radius: 40px;
        }
        .badge {
            background: #1e293b10;
            padding: 2px 14px;
            border-radius: 40px;
            font-weight: 500;
        }
        .footer-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 14px;
        }
        .footer-actions .btn {
            flex: 1;
        }
        @media (max-width: 480px) {
            .card { padding: 20px 14px; }
            .slider-row { flex-direction: column; align-items: stretch; }
            .slider-row label { flex-wrap: wrap; }
            .quality-value { align-self: flex-start; }
            .est-size { align-self: flex-start; }
        }
        .hidden { display: none; }
        .flex-center { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    </style>
</head>
<body>

<div class="card">
    <h1>
        🗜️ Ужималка
        <span>1% шаг</span>
    </h1>

    <div class="drop-zone" id="dropZone">
        <div class="drop-zone-icon">🖼️</div>
        <p>Перетащите фото или нажмите</p>
        <small>JPEG, PNG, WebP (до 20 МБ)</small>
        <input type="file" id="fileInput" class="file-input" accept="image/*">
    </div>

    <div class="control-panel">
        <div class="slider-row">
            <label>
                <span>Качество</span>
                <input type="range" id="qualitySlider" min="1" max="100" value="85">
                <span class="quality-value" id="qualityDisplay">85%</span>
            </label>
            <span class="est-size" id="estSizeDisplay">📊 ~ —</span>
        </div>
        <div class="action-buttons">
            <button class="btn btn-primary" id="compressBtn">⬇️ Сжать</button>
            <button class="btn btn-outline" id="resetBtn">↺ Сброс</button>
        </div>
    </div>

    <div class="preview-area" id="previewArea">
        <div class="preview-placeholder" id="placeholderText">
            <span style="font-size: 2rem; display: block; margin-bottom: 6px;">🖼️</span>
            Здесь будет превью
        </div>
        <img id="previewImage" class="hidden" alt="Preview" />
    </div>

    <div class="file-info" id="fileInfo">
        <span id="fileName">Файл не выбран</span>
        <span id="fileSize">—</span>
        <span id="fileDimensions">—</span>
    </div>

    <div class="footer-actions">
        <button class="btn btn-success" id="downloadBtn" disabled>💾 Скачать сжатое</button>
        <button class="btn btn-outline" id="clearBtn">🗑️ Очистить</button>
    </div>
</div>

<script>
    (function() {
        "use strict";

        // DOM
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const previewImage = document.getElementById('previewImage');
        const placeholderText = document.getElementById('placeholderText');
        const fileName = document.getElementById('fileName');
        const fileSize = document.getElementById('fileSize');
        const fileDimensions = document.getElementById('fileDimensions');
        const qualitySlider = document.getElementById('qualitySlider');
        const qualityDisplay = document.getElementById('qualityDisplay');
        const estSizeDisplay = document.getElementById('estSizeDisplay');
        const compressBtn = document.getElementById('compressBtn');
        const resetBtn = document.getElementById('resetBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const clearBtn = document.getElementById('clearBtn');

        // State
        let originalFile = null;
        let originalDataURL = null;
        let compressedDataURL = null;
        let currentImage = null;          // отображаемое изображение (оригинал или сжатое)
        let isCompressed = false;
        let lastEstimatedSize = null;     // байты (приблизительно)

        // --- helpers ---
        function formatFileSize(bytes) {
            if (!bytes || bytes === 0) return '—';
            const k = 1024;
            const sizes = ['Б', 'КБ', 'МБ', 'ГБ'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        }

        function getImageDimensions(img) {
            if (!img) return { width: 0, height: 0 };
            return { width: img.naturalWidth || img.width, height: img.naturalHeight || img.height };
        }

        function updateInfo(file, img) {
            if (file) {
                fileName.textContent = file.name || 'Файл';
                fileSize.textContent = formatFileSize(file.size);
            } else {
                fileName.textContent = 'Файл не выбран';
                fileSize.textContent = '—';
            }
            if (img) {
                const dim = getImageDimensions(img);
                fileDimensions.textContent = dim.width && dim.height ? `${dim.width}×${dim.height}` : '—';
            } else {
                fileDimensions.textContent = '—';
            }
        }

        function showImage(dataURL, imgObj) {
            if (!dataURL) {
                previewImage.classList.add('hidden');
                placeholderText.classList.remove('hidden');
                return;
            }
            previewImage.src = dataURL;
            previewImage.classList.remove('hidden');
            placeholderText.classList.add('hidden');
            if (imgObj) {
                currentImage = imgObj;
                updateInfo(originalFile, imgObj);
            } else {
                updateInfo(originalFile, currentImage);
            }
        }

        // --- Оценка размера на основе качества (синхронно, используем canvas) ---
        function estimateSize(quality) {
            if (!originalDataURL) {
                estSizeDisplay.textContent = '📊 ~ —';
                lastEstimatedSize = null;
                return;
            }

            // Используем Image для синхронной оценки (создаём canvas и сразу toDataURL)
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = img.width;
                canvas.height = img.height;
                ctx.drawImage(img, 0, 0);
                try {
                    const dataURL = canvas.toDataURL('image/jpeg', quality / 100);
                    // Приблизительный размер: base64 ~ 4/3 от бинарного размера
                    const approxBytes = Math.round((dataURL.length * 3) / 4);
                    lastEstimatedSize = approxBytes;
                    estSizeDisplay.textContent = `📊 ~ ${formatFileSize(approxBytes)}`;
                } catch (e) {
                    estSizeDisplay.textContent = '📊 ~ ошибка';
                    lastEstimatedSize = null;
                }
            };
            img.onerror = function() {
                estSizeDisplay.textContent = '📊 ~ ошибка';
                lastEstimatedSize = null;
            };
            img.src = originalDataURL;
        }

        // --- Сброс к оригиналу ---
        function resetToOriginal() {
            if (!originalDataURL) {
                clearAll();
                return;
            }
            compressedDataURL = null;
            isCompressed = false;
            downloadBtn.disabled = true;
            if (currentImage) {
                showImage(originalDataURL, currentImage);
            } else {
                const img = new Image();
                img.onload = function() {
                    currentImage = img;
                    showImage(originalDataURL, img);
                    updateInfo(originalFile, img);
                };
                img.src = originalDataURL;
            }
            updateInfo(originalFile, currentImage);
            compressBtn.disabled = false;
            // обновляем оценку по текущему качеству
            estimateSize(parseInt(qualitySlider.value, 10));
        }

        function clearAll() {
            originalFile = null;
            originalDataURL = null;
            compressedDataURL = null;
            currentImage = null;
            isCompressed = false;
            previewImage.classList.add('hidden');
            placeholderText.classList.remove('hidden');
            previewImage.src = '';
            fileName.textContent = 'Файл не выбран';
            fileSize.textContent = '—';
            fileDimensions.textContent = '—';
            downloadBtn.disabled = true;
            compressBtn.disabled = false;
            estSizeDisplay.textContent = '📊 ~ —';
            lastEstimatedSize = null;
            fileInput.value = '';
        }

        // --- Сжатие (асинхронное, но обновляет оценку после) ---
        function compressImage(quality) {
            if (!originalFile || !originalDataURL) {
                alert('Сначала загрузите изображение.');
                return;
            }

            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = img.width;
                canvas.height = img.height;
                ctx.drawImage(img, 0, 0);

                const qualityFactor = quality / 100;
                try {
                    const compressed = canvas.toDataURL('image/jpeg', qualityFactor);
                    compressedDataURL = compressed;
                    isCompressed = true;

                    const compressedImg = new Image();
                    compressedImg.onload = function() {
                        currentImage = compressedImg;
                        showImage(compressedDataURL, compressedImg);
                        // размер сжатого (приблизительно)
                        const approxSize = Math.round((compressed.length * 3) / 4);
                        fileSize.textContent = formatFileSize(approxSize);
                        const dim = getImageDimensions(compressedImg);
                        fileDimensions.textContent = dim.width && dim.height ? `${dim.width}×${dim.height}` : '—';
                        downloadBtn.disabled = false;
                        compressBtn.disabled = false;
                        // обновляем оценку (она уже должна быть актуальна, но покажем текущий размер)
                        lastEstimatedSize = approxSize;
                        estSizeDisplay.textContent = `📊 ${formatFileSize(approxSize)} (факт)`;
                    };
                    compressedImg.src = compressedDataURL;
                } catch (e) {
                    alert('Ошибка сжатия: ' + e.message);
                    compressBtn.disabled = false;
                }
            };
            img.onerror = function() {
                alert('Не удалось загрузить изображение для сжатия.');
                compressBtn.disabled = false;
            };
            img.src = originalDataURL;
            compressBtn.disabled = true;
        }

        // --- Обработка загруженного файла ---
        function handleFile(file) {
            if (!file || !file.type.startsWith('image/')) {
                alert('Пожалуйста, выберите изображение.');
                return;
            }
            if (file.size > 20 * 1024 * 1024) {
                alert('Файл слишком большой. Максимум 20 МБ.');
                return;
            }

            originalFile = file;
            const reader = new FileReader();
            reader.onload = function(e) {
                originalDataURL = e.target.result;
                compressedDataURL = null;
                isCompressed = false;
                downloadBtn.disabled = true;
                compressBtn.disabled = false;

                const img = new Image();
                img.onload = function() {
                    currentImage = img;
                    showImage(originalDataURL, img);
                    updateInfo(originalFile, img);
                    fileInput.value = '';
                    // После загрузки сразу оцениваем размер при текущем качестве
                    estimateSize(parseInt(qualitySlider.value, 10));
                };
                img.onerror = function() {
                    alert('Не удалось декодировать изображение.');
                    clearAll();
                };
                img.src = originalDataURL;
            };
            reader.onerror = function() {
                alert('Ошибка чтения файла.');
            };
            reader.readAsDataURL(file);
        }

        // --- События ---

        dropZone.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', (e) => {
            if (fileInput.files && fileInput.files.length > 0) {
                handleFile(fileInput.files[0]);
            }
        });

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });
        dropZone.addEventListener('dragleave', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
        });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                handleFile(e.dataTransfer.files[0]);
            }
        });

        // Слайдер: обновляем отображение и оценку размера
        qualitySlider.addEventListener('input', () => {
            const val = qualitySlider.value;
            qualityDisplay.textContent = val + '%';
            if (originalDataURL) {
                estimateSize(parseInt(val, 10));
            } else {
                estSizeDisplay.textContent = '📊 ~ —';
            }
        });

        compressBtn.addEventListener('click', () => {
            const quality = parseInt(qualitySlider.value, 10);
            compressImage(quality);
        });

        resetBtn.addEventListener('click', resetToOriginal);

        downloadBtn.addEventListener('click', () => {
            if (!compressedDataURL) {
                alert('Сначала выполните сжатие.');
                return;
            }
            let baseName = 'compressed';
            if (originalFile && originalFile.name) {
                const nameParts = originalFile.name.split('.');
                if (nameParts.length > 1) {
                    baseName = nameParts.slice(0, -1).join('.') + '_compressed';
                } else {
                    baseName = originalFile.name + '_compressed';
                }
            }
            const link = document.createElement('a');
            link.href = compressedDataURL;
            link.download = baseName + '.jpg';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });

        clearBtn.addEventListener('click', clearAll);

        document.addEventListener('dragover', (e) => e.preventDefault());
        document.addEventListener('drop', (e) => e.preventDefault());

        // Инициализация
        clearAll();
        qualityDisplay.textContent = qualitySlider.value + '%';
        estSizeDisplay.textContent = '📊 ~ —';
    })();
</script>
</body>
</html>
