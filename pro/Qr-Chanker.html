<script>

/* =========================================================
   ОБЩИЕ НАСТРОЙКИ
========================================================= */

const QR_ERROR_LEVEL = "M";

let scanner = null;

let scannerRunning = false;

let lastScanText = "";

let lastScanTime = 0;


/* =========================================================
   ГЕНЕРАТОР
========================================================= */

function utf8Bytes(text) {

    return new TextEncoder().encode(text);

}


function utf8Length(text) {

    return utf8Bytes(text).length;

}


/*
    Проверяем, способен ли QR-код вместить
    данный текст.
*/

function canFitQR(text) {

    try {

        const qr =
            qrcode(0, QR_ERROR_LEVEL);

        qr.addData(text);

        qr.make();

        return true;

    } catch (e) {

        return false;

    }

}


/*
    Unicode-разбиение.

    Array.from() позволяет не разрывать
    обычные Unicode-символы и emoji.
*/

function unicodeChars(text) {

    return Array.from(text);

}


/*
    Находим максимально большой кусок,
    который помещается в QR.

    Используем бинарный поиск.
*/

function findLargestChunk(chars, start) {

    let low = 1;

    let high =
        chars.length - start;

    let best = 0;


    while (low <= high) {

        const middle =
            Math.floor((low + high) / 2);

        const candidate =
            chars
                .slice(
                    start,
                    start + middle
                )
                .join("");


        if (canFitQR(candidate)) {

            best = middle;

            low = middle + 1;

        } else {

            high = middle - 1;

        }

    }


    return best;

}


/*
    Разбиваем исходный текст.

    Сначала делаем временные части.
*/

function splitRawText(text) {

    const chars =
        unicodeChars(text);

    const result = [];

    let position = 0;


    while (
        position <
        chars.length
    ) {

        const count =
            findLargestChunk(
                chars,
                position
            );


        if (count <= 0) {

            throw new Error(
                "Не удалось создать QR-код."
            );

        }


        const part =
            chars
                .slice(
                    position,
                    position + count
                )
                .join("");


        result.push(part);

        position += count;

    }


    return result;

}


/* =========================================================
   SHA-256
========================================================= */

async function sha256(text) {

    const data =
        new TextEncoder()
            .encode(text);

    const hash =
        await crypto.subtle.digest(
            "SHA-256",
            data
        );

    return Array
        .from(new Uint8Array(hash))
        .map(
            b =>
                b
                    .toString(16)
                    .padStart(2, "0")
        )
        .join("");

}


/* =========================================================
   ФОРМАТ QR

   Внутри каждого QR:

   QRTX
   Версия формата
   ID документа
   Номер части
   Всего частей
   SHA-256
   Данные

========================================================= */

function createPacket(
    documentId,
    partNumber,
    totalParts,
    hash,
    data
) {

    return [
        "QRTX",
        "1",
        documentId,
        String(partNumber),
        String(totalParts),
        hash,
        data
    ].join("|");

}


/*
    Разделитель между служебной частью
    и данными — специальный маркер.

    Он крайне маловероятно встретится
    в обычном тексте.
*/

const DATA_SEPARATOR =
    "<<<QRTX_DATA>>>";


function createPacketSafe(
    documentId,
    partNumber,
    totalParts,
    hash,
    data
) {

    return [
        "QRTX",
        "1",
        documentId,
        String(partNumber),
        String(totalParts),
        hash,
        DATA_SEPARATOR,
        data
    ].join("|");

}


/* =========================================================
   ГЕНЕРАЦИЯ
========================================================= */

async function generateQRs() {

    const text =
        document.getElementById(
            "sourceText"
        ).value;


    const info =
        document.getElementById(
            "generatorInfo"
        );

    const output =
        document.getElementById(
            "qrOutput"
        );


    output.innerHTML = "";


    if (text.length === 0) {

        info.innerHTML =
            "Введите текст.";

        return;

    }


    info.innerHTML =
        "⏳ Анализирую вместимость QR-кодов...";


    try {

        /*
            Получаем SHA-256 исходного текста.
        */

        const hash =
            await sha256(text);


        /*
            ID документа.

            Он нужен, чтобы сборщик понимал,
            что разные QR относятся к одному
            набору.
        */

        const documentId =
            crypto.randomUUID
                ? crypto.randomUUID()
                : Date.now().toString(36);


        /*
            ВАЖНО:

            Нельзя просто разбить исходный текст
            и добавить служебную информацию.

            Служебная информация тоже занимает
            место в QR.

            Поэтому сначала определяем размер
            с учётом будущего заголовка.

            Используем итерационный подход.
        */

        let rawParts = [];

        let chars =
            unicodeChars(text);

        let position = 0;


        /*
            Временно предполагаем количество частей.

            Затем уточняем.
        */

        let estimatedTotal = 1;


        for (let iteration = 0;
             iteration < 10;
             iteration++) {

            rawParts = [];

            position = 0;


            while (
                position <
                chars.length
            ) {

                /*
                    Номер части пока неизвестен,
                    поэтому берём максимально
                    возможный номер по длине.
                */

                const headerExample =
                    createPacketSafe(
                        documentId,
                        estimatedTotal,
                        estimatedTotal,
                        hash,
                        ""
                    );


                /*
                    Находим максимальный кусок,
                    добавляя служебный заголовок.
                */

                let low = 1;

                let high =
                    chars.length - position;

                let best = 0;


                while (low <= high) {

                    const middle =
                        Math.floor(
                            (low + high) / 2
                        );


                    const candidate =
                        chars
                            .slice(
                                position,
                                position + middle
                            )
                            .join("");


                    const packet =
                        createPacketSafe(
                            documentId,
                            rawParts.length + 1,
                            estimatedTotal,
                            hash,
                            candidate
                        );


                    if (canFitQR(packet)) {

                        best = middle;

                        low =
                            middle + 1;

                    } else {

                        high =
                            middle - 1;

                    }

                }


                if (best <= 0) {

                    throw new Error(
                        "Даже минимальная часть не помещается в QR."
                    );

                }


                rawParts.push(
                    chars
                        .slice(
                            position,
                            position + best
                        )
                        .join("")
                );


                position += best;

            }


            if (
                rawParts.length ===
                estimatedTotal
            ) {

                break;

            }


            estimatedTotal =
                rawParts.length;

        }


        const totalParts =
            rawParts.length;


        /*
            Создаём QR-коды.
        */

        info.innerHTML =
            "Символов: <b>" +
            text.length +
            "</b><br>" +

            "UTF-8: <b>" +
            utf8Length(text) +
            " байт</b><br>" +

            "QR-кодов: <b>" +
            totalParts +
            "</b><br><br>" +

            "Контрольная сумма SHA-256:<br>" +

            "<div class='hash'>" +
            hash +
            "</div>";


        rawParts.forEach(
            (part, index) => {

                const packet =
                    createPacketSafe(
                        documentId,
                        index + 1,
                        totalParts,
                        hash,
                        part
                    );


                const qr =
                    qrcode(
                        0,
                        QR_ERROR_LEVEL
                    );


                qr.addData(packet);

                qr.make();


                const item =
                    document.createElement(
                        "div"
                    );

                item.className =
                    "qr-item";


                const title =
                    document.createElement(
                        "div"
                    );

                title.className =
                    "qr-title";

                title.textContent =
                    "QR " +
                    (index + 1) +
                    " / " +
                    totalParts;


                item.appendChild(title);


                const img =
                    document.createElement(
                        "img"
                    );

                img.className =
                    "qr-image";

                img.src =
                    qr.createDataURL(
                        7,
                        12
                    );


                item.appendChild(img);


                const meta =
                    document.createElement(
                        "div"
                    );

                meta.className =
                    "qr-meta";

                meta.innerHTML =
                    "Данные части: " +
                    part.length +
                    " символов · " +
                    utf8Length(part) +
                    " байт";


                item.appendChild(meta);


                const download =
                    document.createElement(
                        "button"
                    );

                download.className =
                    "secondary";

                download.textContent =
                    "💾 Скачать PNG";


                download.onclick =
                    () => {

                        downloadImage(
                            img.src,
                            "QR_" +
                            (index + 1) +
                            "_of_" +
                            totalParts +
                            ".png"
                        );

                    };


                item.appendChild(download);


                output.appendChild(item);

            }
        );


    } catch (error) {

        console.error(error);

        info.innerHTML =
            "<span class='error'>" +
            "Ошибка: " +
            error.message +
            "</span>";

    }

}


/* =========================================================
   СКАЧИВАНИЕ QR
========================================================= */

function downloadImage(
    dataURL,
    filename
) {

    const a =
        document.createElement("a");

    a.href = dataURL;

    a.download = filename;

    document.body.appendChild(a);

    a.click();

    document.body.removeChild(a);

}


/* =========================================================
   ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК
========================================================= */

function showPage(page) {

    document
        .getElementById("generator")
        .classList.remove("active");

    document
        .getElementById("scanner")
        .classList.remove("active");


    document
        .getElementById("tabGenerator")
        .classList.remove("active");

    document
        .getElementById("tabScanner")
        .classList.remove("active");


    if (page === "generator") {

        document
            .getElementById("generator")
            .classList.add("active");

        document
            .getElementById("tabGenerator")
            .classList.add("active");

    } else {

        document
            .getElementById("scanner")
            .classList.add("active");

        document
            .getElementById("tabScanner")
            .classList.add("active");

    }

}


/* =========================================================
   СБОРЩИК
========================================================= */


/*
    Здесь части хранятся по номеру:

    receivedParts[1]
    receivedParts[2]
    receivedParts[3]

    Поэтому порядок сканирования значения
    НЕ имеет.
*/

let receivedParts = {};

let scanTotal = null;

let scanHash = null;

let scanDocumentId = null;


/* =========================================================
   ЗАПУСК СКАНЕРА
========================================================= */

async function startScanner() {

    if (scannerRunning) {
        return;
    }


    const status =
        document.getElementById(
            "scanStatus"
        );


    status.textContent =
        "Запрашиваю камеру...";


    try {

        scanner =
            new Html5Qrcode(
                "reader"
            );


        await scanner.start(

            {
                facingMode:
                    "environment"
            },

            {
                fps: 10,

                qrbox:
                    function(
                        width,
                        height
                    ) {

                        const size =
                            Math.min(
                                width,
                                height
                            ) * 0.75;

                        return {
                            width: size,
                            height: size
                        };

                    }

            },

            onScanSuccess,

            function(error) {
                // Обычная ситуация:
                // QR не распознан в текущем кадре.
            }

        );


        scannerRunning = true;


        status.innerHTML =
            "<span class='ok'>" +
            "📷 Камера работает. " +
            "Наведите её на QR." +
            "</span>";


    } catch (error) {

        console.error(error);

        status.innerHTML =
            "<span class='error'>" +
            "Не удалось запустить камеру.<br>" +
            "Проверьте разрешение браузера." +
            "</span>";

    }

}


/* =========================================================
   ОСТАНОВКА
========================================================= */

async function stopScanner() {

    if (
        scanner &&
        scannerRunning
    ) {

        try {

            await scanner.stop();

        } catch (e) {

            console.log(e);

        }

    }


    scannerRunning = false;


    document.getElementById(
        "scanStatus"
    ).textContent =
        "Камера остановлена.";

}


/* =========================================================
   ПОЛУЧЕН QR
========================================================= */

function onScanSuccess(
    decodedText
) {

    const now =
        Date.now();


    /*
        Один QR может быть распознан
        камерой много раз подряд.
    */

    if (
        decodedText === lastScanText &&
        now - lastScanTime < 2500
    ) {

        return;

    }


    lastScanText =
        decodedText;

    lastScanTime =
        now;


    processPacket(
        decodedText
    );

}


/* =========================================================
   РАЗБОР QR
========================================================= */

function processPacket(packet) {

    /*
        Формат:

        QRTX
        1
        documentId
        part
        total
        hash
        <<<QRTX_DATA>>>
        data
    */

    if (
        !packet.startsWith(
            "QRTX|"
        )
    ) {

        setScanStatus(
            "Это не QR от этого генератора.",
            "warning"
        );

        return;

    }


    const separatorIndex =
        packet.indexOf(
            "|" + DATA_SEPARATOR + "|"
        );


    if (separatorIndex < 0) {

        setScanStatus(
            "Повреждённый формат QR.",
            "error"
        );

        return;

    }


    const header =
        packet.substring(
            0,
            separatorIndex
        );


    const data =
        packet.substring(
            separatorIndex +
            DATA_SEPARATOR.length +
            2
        );


    const fields =
        header.split("|");


    if (
        fields.length < 6
    ) {

        setScanStatus(
            "Неверный QR.",
            "error"
        );

        return;

    }


    const format =
        fields[0];

    const version =
        fields[1];

    const documentId =
        fields[2];

    const partNumber =
        Number(fields[3]);

    const total =
        Number(fields[4]);

    const hash =
        fields[5];


    if (
        format !== "QRTX" ||
        version !== "1"
    ) {

        setScanStatus(
            "Неподдерживаемый формат QR.",
            "error"
        );

        return;

    }


    if (
        !Number.isInteger(partNumber) ||
        !Number.isInteger(total) ||
        partNumber < 1 ||
        partNumber > total
    ) {

        setScanStatus(
            "Неверный номер части.",
            "error"
        );

        return;

    }


    /*
        Первый QR определяет документ.
    */

    if (
        scanDocumentId === null
    ) {

        scanDocumentId =
            documentId;

        scanTotal =
            total;

        scanHash =
            hash;

    } else {

        /*
            Защита от случайного смешивания
            двух разных наборов QR.
        */

        if (
            documentId !==
            scanDocumentId
        ) {

            setScanStatus(
                "⚠️ Это QR от другого документа.",
                "warning"
            );

            return;

        }


        if (
            total !==
            scanTotal
        ) {

            setScanStatus(
                "⚠️ Количество частей не совпадает.",
                "warning"
            );

            return;

        }


        if (
            hash !==
            scanHash
        ) {

            setScanStatus(
                "⚠️ Контрольная сумма не совпадает.",
                "warning"
            );

            return;

        }

    }


    /*
        Проверяем дубликат.
    */

    if (
        receivedParts[partNumber] !==
        undefined
    ) {

        setScanStatus(
            "QR " +
            partNumber +
            " уже получен.",
            "warning"
        );

        return;

    }


    /*
        Сохраняем по номеру.

        Поэтому порядок сканирования
        совершенно не важен.
    */

    receivedParts[partNumber] =
        data;


    updateScannerInterface();


    setScanStatus(
        "✓ Получен QR " +
        partNumber +
        " / " +
        total,
        "ok"
    );


    /*
        Проверяем, все ли части получены.
    */

    if (
        Object.keys(receivedParts)
            .length === scanTotal
    ) {

        assembleText();

    }

}


/* =========================================================
   ОБНОВЛЕНИЕ СБОРЩИКА
========================================================= */

function updateScannerInterface() {

    const received =
        Object.keys(
            receivedParts
        ).length;


    document.getElementById(
        "receivedCount"
    ).textContent =
        received;


    document.getElementById(
        "totalCount"
    ).textContent =
        scanTotal || "?";


    let percent = 0;


    if (scanTotal) {

        percent =
            received /
            scanTotal *
            100;

    }


    document.getElementById(
        "scanProgress"
    ).style.width =
        percent + "%";


    document.getElementById(
        "scanProgressText"
    ).textContent =
        scanTotal
            ? (
                received +
                " из " +
                scanTotal +
                " частей"
              )
            : "Ожидание QR";


    /*
        Номера всех частей
    */

    const list =
        document.getElementById(
            "partsList"
        );


    list.innerHTML = "";


    if (!scanTotal) {
        return;
    }


    for (
        let i = 1;
        i <= scanTotal;
        i++
    ) {

        const div =
            document.createElement(
                "div"
            );


        if (
            receivedParts[i] !==
            undefined
        ) {

            div.className =
                "part received";

            div.textContent =
                i;

        } else {

            div.className =
                "part missing";

            div.textContent =
                i;

        }


        list.appendChild(div);

    }

}


/* =========================================================
   СБОРКА ТЕКСТА
========================================================= */

async function assembleText() {

    let text = "";


    /*
        Строго от 1 до N.
    */

    for (
        let i = 1;
        i <= scanTotal;
        i++
    ) {

        if (
            receivedParts[i] ===
            undefined
        ) {

            return;

        }


        text +=
            receivedParts[i];

    }


    document.getElementById(
        "resultText"
    ).value =
        text;


    /*
        Проверяем SHA-256.
    */

    const calculatedHash =
        await sha256(text);


    const verification =
        document.getElementById(
            "verification"
        );


    const verificationText =
        document.getElementById(
            "verificationText"
        );


    verification.classList.remove(
        "hidden"
    );


    if (
        calculatedHash ===
        scanHash
    ) {

        verificationText.innerHTML =
            "<p class='ok'>" +
            "✅ Текст восстановлен полностью." +
            "</p>" +

            "<p>" +
            "Все " +
            scanTotal +
            " частей получены." +
            "</p>" +

            "<p>" +
            "<b>SHA-256 совпадает.</b>" +
            "</p>" +

            "<div class='hash'>" +
            calculatedHash +
            "</div>";

        document.getElementById(
            "scanStatus"
        ).innerHTML =
            "<span class='ok'>" +
            "🎉 ГОТОВО! Текст восстановлен без изменений." +
            "</span>";

    } else {

        verificationText.innerHTML =
            "<p class='error'>" +
            "❌ Ошибка проверки!" +
            "</p>" +

            "<p>" +
            "Контрольная сумма восстановленного " +
            "текста не совпадает." +
            "</p>" +

            "<div class='hash'>" +
            "Ожидалось:<br>" +
            scanHash +
            "</div>" +

            "<div class='hash'>" +
            "Получено:<br>" +
            calculatedHash +
            "</div>";

    }

}


/* =========================================================
   СТАТУС
========================================================= */

function setScanStatus(
    text,
    type
) {

    const status =
        document.getElementById(
            "scanStatus"
        );


    status.textContent =
        text;


    status.className =
        "status " +
        type;

}


/* =========================================================
   КОПИРОВАНИЕ
========================================================= */

async function copyResult() {

    const text =
        document.getElementById(
            "resultText"
        ).value;


    if (!text) {
        return;
    }


    try {

        await navigator.clipboard.writeText(
            text
        );


        setScanStatus(
            "✓ Текст скопирован.",
            "ok"
        );

    } catch (e) {

        const textarea =
            document.getElementById(
                "resultText"
            );


        textarea.removeAttribute(
            "readonly"
        );

        textarea.select();

        document.execCommand(
            "copy"
        );

        textarea.setAttribute(
            "readonly",
            true
        );


        setScanStatus(
            "✓ Текст скопирован.",
            "ok"
        );

    }

}


/* =========================================================
   СОХРАНЕНИЕ TXT
========================================================= */

function saveResult() {

    const text =
        document.getElementById(
            "resultText"
        ).value;


    if (!text) {
        return;
    }


    const blob =
        new Blob(
            [text],
            {
                type:
                    "text/plain;charset=utf-8"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const a =
        document.createElement(
            "a"
        );


    a.href =
        url;

    a.download =
        "recovered_text.txt";


    document.body.appendChild(a);

    a.click();

    document.body.removeChild(a);


    URL.revokeObjectURL(
        url
    );

}


/* =========================================================
   ОЧИСТКА ГЕНЕРАТОРА
========================================================= */

function clearGenerator() {

    document.getElementById(
        "sourceText"
    ).value = "";


    document.getElementById(
        "generatorInfo"
    ).innerHTML =
        "Введите текст и нажмите «Создать QR-коды».";


    document.getElementById(
        "qrOutput"
    ).innerHTML = "";

}


/* =========================================================
   ОЧИСТКА СБОРЩИКА
========================================================= */

async function clearScanner() {

    await stopScanner();


    receivedParts = {};

    scanTotal = null;

    scanHash = null;

    scanDocumentId = null;

    lastScanText = "";

    lastScanTime = 0;


    document.getElementById(
        "receivedCount"
    ).textContent =
        "0";


    document.getElementById(
        "totalCount"
    ).textContent =
        "?";


    document.getElementById(
        "scanProgress"
    ).style.width =
        "0%";


    document.getElementById(
        "scanProgressText"
    ).textContent =
        "Отсканируйте первый QR-код.";


    document.getElementById(
        "partsList"
    ).innerHTML = "";


    document.getElementById(
        "resultText"
    ).value = "";


    document.getElementById(
        "verification"
    ).classList.add(
        "hidden"
    );


    setScanStatus(
        "Сборщик очищен.",
        ""
    );

}

</script>
