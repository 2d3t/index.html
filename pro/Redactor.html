<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>KlikEdit 🎀 с вкладками</title>
<style id="themeStyles">
/* ---------- Базовые стили ---------- */
* { box-sizing: border-box; }
body {
  margin:0;
  font-family:sans-serif;
  background:#f5f5f5;
  transition:background .2s ease,color .2s ease;
  overflow:hidden;
  height:100vh;
  display:flex;
  flex-direction:column;
}
.toolbar {
  display:flex;
  gap:5px;
  padding:6px 10px;
  background:#333;
  color:white;
  flex-wrap:wrap;
  align-items:center;
  transition:background .2s,color .2s;
  flex-shrink:0;
  border-bottom:1px solid rgba(255,255,255,0.1);
}
.toolbar input,.toolbar button,.toolbar label,.toolbar select {
  transition:background .2s,border-color .2s,color .2s;
  font-size:13px;
}
.toolbar input[type="text"],
.toolbar input[type="number"] {
  background:#444;
  border:1px solid #666;
  color:white;
  border-radius:4px;
  padding:4px 6px;
  height:30px;
}
.toolbar button, .toolbar label[for="fileUpload"], .toolbar .theme-select {
  padding:4px 10px;
  border:none;
  border-radius:4px;
  cursor:pointer;
  font-size:13px;
  font-family:inherit;
  background:#555;
  color:white;
  height:30px;
  display:inline-flex;
  align-items:center;
  gap:4px;
  white-space:nowrap;
}
.toolbar button:hover, .toolbar label:hover { filter:brightness(1.1); }
.toolbar .theme-select { background:#444; }

/* ---------- Вкладки ---------- */
.tabs-container {
  display:flex;
  background:#2a2a2a;
  padding:4px 8px 0 8px;
  gap:2px;
  flex-shrink:0;
  border-bottom:1px solid #444;
  overflow-x:auto;
  flex-wrap:nowrap;
}
.tab {
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:6px 12px;
  background:#3a3a3a;
  color:#ccc;
  border-radius:6px 6px 0 0;
  cursor:pointer;
  font-size:13px;
  border:1px solid transparent;
  border-bottom:none;
  transition:all .15s;
  white-space:nowrap;
  flex-shrink:0;
}
.tab.active {
  background:#555;
  color:white;
  border-color:#666;
}
.tab:hover { background:#4a4a4a; }
.tab .close-tab {
  background:none;
  border:none;
  color:#999;
  cursor:pointer;
  font-size:14px;
  padding:0 2px;
  line-height:1;
}
.tab .close-tab:hover { color:white; }
.tab .tab-label { max-width:120px; overflow:hidden; text-overflow:ellipsis; }
.add-tab-btn {
  background:#3a3a3a;
  border:1px solid #555;
  color:#ccc;
  border-radius:4px;
  cursor:pointer;
  font-size:16px;
  padding:0 12px;
  height:28px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
}
.add-tab-btn:hover { background:#4a4a4a; color:white; }

/* ---------- Редактор ---------- */
.editor-wrapper {
  display:flex;
  flex:1;
  overflow:hidden;
  position:relative;
}
.editor {
  display:flex;
  flex:1;
  overflow:hidden;
  width:100%;
}
.line-numbers {
  background:#eee;
  color:#666;
  padding:5px 0;
  text-align:right;
  user-select:none;
  overflow:hidden;
  width:50px;
  min-width:50px;
  box-sizing:border-box;
  font-family:monospace;
  font-size:14px;
  line-height:1.4;
  transition:background .2s,color .2s;
}
.line-numbers div { padding:0 10px; box-sizing:border-box; }
textarea {
  flex:1;
  outline:none;
  resize:none;
  padding:5px;
  font-family:monospace;
  font-size:14px;
  line-height:1.4;
  overflow:auto;
  box-sizing:border-box;
  border:none;
  background:#fff;
  color:#000;
  transition:background .2s,color .2s;
}
.preview {
  width:100%;
  height:100%;
  border:none;
  background:white;
  display:none;
  position:absolute;
  top:0;
  left:0;
}
.preview.active {
  display:block;
  position:relative;
}
.editor.hidden { display:none; }

/* ---------- Fullscreen ---------- */
.fullscreen-overlay {
  position:fixed;
  top:0;left:0;width:100%;height:100%;
  z-index:10000;
  display:none;
  background:#0f0f17;
}
.fullscreen-overlay.active { display:block; }
.fullscreen-exit-btn {
  position:fixed;
  top:30px; right:20px;
  z-index:10001;
  padding:0;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-size:16px;
  font-weight:bold;
  box-shadow:0 4px 8px rgba(0,0,0,.3);
  display:flex;
  align-items:center;
  background:rgba(0,0,0,0.35);
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
  overflow:hidden;
  user-select:none;
}
.fullscreen-exit-btn:hover { background:rgba(0,0,0,0.6); transform:scale(1.03); }
.fullscreen-exit-btn .exit-label {
  padding:12px 18px 12px 16px;
  color:white;
  text-shadow:0 1px 4px rgba(0,0,0,0.5);
  white-space:nowrap;
}
.fullscreen-exit-btn .drag-handle {
  width:18px;
  height:100%;
  min-height:44px;
  background:rgba(255,255,255,0.15);
  border-left:1px solid rgba(255,255,255,0.2);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:grab;
  padding:0 4px;
}
.fullscreen-exit-btn .drag-handle:hover { background:rgba(255,255,255,0.25); }
.fullscreen-exit-btn .drag-handle:active { cursor:grabbing; }
.drag-handle-dots {
  display:flex;
  flex-direction:column;
  gap:2px;
}
.drag-handle-dots span {
  display:block;
  width:4px;
  height:4px;
  border-radius:50%;
  background:rgba(255,255,255,0.7);
}
#fullscreenFrame { width:100%; height:100%; border:none; }

/* ---------- Темы ---------- */
body.theme-dark .toolbar { background:#1e1e2f; }
body.theme-dark .tabs-container { background:#161625; border-color:#2a2a3a; }
body.theme-dark .tab { background:#25253a; color:#bbb; }
body.theme-dark .tab.active { background:#3a3a5a; color:white; border-color:#4a4a6a; }
body.theme-dark .tab:hover { background:#32324a; }
body.theme-dark .line-numbers { background:#1e1e2a; color:#aaa; }
body.theme-dark textarea { background:#0f0f17; color:#e6e6fa; }
body.theme-dark .fullscreen-overlay { background:#0f0f17; }
body.theme-dark { background:#12121a; }

body.theme-light .toolbar { background:#f0f0f4; color:#222; border-bottom:1px solid #ddd; }
body.theme-light .tabs-container { background:#e8e8ee; border-color:#ddd; }
body.theme-light .tab { background:#e0e0e8; color:#333; }
body.theme-light .tab.active { background:#f5f5fa; color:#111; border-color:#ccc; }
body.theme-light .tab:hover { background:#ececf2; }
body.theme-light .line-numbers { background:#f9f9fc; color:#6c6c7a; }
body.theme-light textarea { background:#fff; color:#1e1e2a; }
body.theme-light .fullscreen-overlay { background:#fff; }
body.theme-light { background:#eef2f5; }

body.theme-green .toolbar { background:#1f3b2c; color:#d4ecd0; }
body.theme-green .tabs-container { background:#1a2e23; border-color:#2c553a; }
body.theme-green .tab { background:#2a4a36; color:#b8dbb0; }
body.theme-green .tab.active { background:#3a6a4a; color:#eaffdf; border-color:#4a7a5a; }
body.theme-green .line-numbers { background:#1e3527; color:#a8d5a5; }
body.theme-green textarea { background:#17261e; color:#cfeec7; }
body.theme-green .fullscreen-overlay { background:#1a2e23; }
body.theme-green { background:#1a2a20; }

body.theme-ocean .toolbar { background:#0a192f; color:#b8e1fc; }
body.theme-ocean .tabs-container { background:#07152a; border-color:#1e3a5f; }
body.theme-ocean .tab { background:#112240; color:#9ac9f0; }
body.theme-ocean .tab.active { background:#1e4a7a; color:#d9efff; border-color:#2a5a8a; }
body.theme-ocean .line-numbers { background:#07152a; color:#6b93c0; }
body.theme-ocean textarea { background:#05101f; color:#d9efff; }
body.theme-ocean .fullscreen-overlay { background:#07152a; }
body.theme-ocean { background:#0a192f; }

body.theme-graphite .toolbar { background:#2c2c2e; color:#f5f5f7; }
body.theme-graphite .tabs-container { background:#222224; border-color:#3a3a3c; }
body.theme-graphite .tab { background:#3a3a3c; color:#ccc; }
body.theme-graphite .tab.active { background:#4a4a4c; color:white; border-color:#5a5a5c; }
body.theme-graphite .line-numbers { background:#222224; color:#aaa; }
body.theme-graphite textarea { background:#1c1c1e; color:#e2e2e6; }
body.theme-graphite .fullscreen-overlay { background:#1c1c1e; }
body.theme-graphite { background:#1c1c1e; }

/* ---------- Утилиты ---------- */
.active-line { background:rgba(100,150,250,.3); }
.file-input { display:none; }
.fetch-loading { background:#f0ad4e!important; cursor:wait!important; }
.clear-url-btn { background:#e74c3c; color:white; }
.clear-url-btn:hover { background:#c0392b; }
.copied { background:#4CAF50!important; }
</style>
</head>

<body class="theme-dark">

<!-- Панель инструментов -->
<div class="toolbar">
  <input type="text" id="urlInput" placeholder="HTML (https://...)" value="">
  <button id="fetchButton" onclick="fetchWebsiteCode()">👁️‍🗨️</button>
  <button class="clear-url-btn" onclick="clearUrlInput()" title="Очистить URL">🗑️</button>

<button onclick="window.location.href='https://2d3t.github.io/index.html/'">Выход 🚸</button>

  <input type="number" id="lineNumber" min="1" placeholder="Строка" style="width:70px;">
  <button onclick="goToLine()">Перейти 🔀</button>

<select id="themeSwitcher" class="theme-select">
    <option value="dark">Ночь 🌙</option>
    <option value="light">День ☀️</option>
    <option value="green">Изумруд 🌿</option>
    <option value="ocean">Океан 🌊</option>
    <option value="graphite">Графит ⚙️</option>
  </select>

  <label for="fileUpload" title="Открыть файл">Файлы 📂</label>
  <input type="file" id="fileUpload" class="file-input" accept=".html,.htm,.txt,.py,.js,.css,.json,.xml,.md,.csv,.log,.ini,.cfg,.conf,.sh,.bat,.ps1,.rb,.php,.java,.c,.cpp,.h,.cs,.go,.rs,.swift,.kt,.sql,.yaml,.yml,.toml,.pl,.pm,.r,.lua,.vim,.ts,.jsx,.tsx,.vue,.scss,.less,.sass,.styl" onchange="handleFileUpload(event)">


  <input type="text" id="searchInput" placeholder="Поиск 🔎" style="width:100px;">
  <button onclick="findNext()">Найти ▶️</button>
  <button onclick="findPrev()">Назад ◀️</button>

  <button onclick="sendCodeQR()">📱 QR</button>
  <button id="copyButton" onclick="copyText()">Скопировать 📃</button>
  <button onclick="clearAll()">Очистить ❌</button>

<button onclick="shareCode()">Скачать ⬇️</button>


  <button onclick="undo()">Отменить ↩️</button>
  <button onclick="redo()">Повторить ↪️</button>
  
  <button onclick="showEditor()">Редактор 🛠️</button>
  <button onclick="runCode()">Просмотр 🖥️</button>
  <button id="fullscreenButton" onclick="toggleFullscreen()">Полный экран⛶</button>

  
  
</div>

<!-- Вкладки -->
<div class="tabs-container" id="tabsContainer">
  <button class="add-tab-btn" onclick="addNewTab()" title="Новая вкладка">➕</button>
</div>

<!-- Редактор -->
<div class="editor-wrapper">
  <div class="editor" id="editorContainer">
    <div class="line-numbers" id="lineNumbers"></div>
    <textarea id="codeArea" oninput="onEditorInput()" onscroll="syncScroll()"></textarea>
  </div>
  <iframe class="preview" id="previewFrame"></iframe>
</div>

<!-- Fullscreen -->
<div class="fullscreen-overlay" id="fullscreenOverlay">
  <button class="fullscreen-exit-btn" id="forceExitFullscreenBtn">
    <span class="exit-label">✕ Выйти</span>
    <span class="drag-handle" id="dragHandle">
      <span class="drag-handle-dots"><span></span><span></span><span></span></span>
    </span>
  </button>
  <iframe id="fullscreenFrame"></iframe>
</div>

<script>
// ============================
//  Модуль вкладок + localStorage
// ============================
const STORAGE_KEY = 'klikedit_tabs_data';

let tabs = [];            // [{ id, name, content, active }]
let tabIdCounter = 0;
let activeTabId = null;
let isRestoring = false;

// DOM
const tabsContainer = document.getElementById('tabsContainer');
const textarea = document.getElementById('codeArea');
const lineNumbersDiv = document.getElementById('lineNumbers');
const previewFrame = document.getElementById('previewFrame');
const fullscreenOverlay = document.getElementById('fullscreenOverlay');
const fullscreenFrame = document.getElementById('fullscreenFrame');
const editorContainer = document.getElementById('editorContainer');

// Состояния
let history = [];
let redoStack = [];
let isFullscreen = false;
let lastPreviewUrl = null;
let searchResults = [];
let currentResult = -1;
let lastSearch = "";
let activeLineNumber = null;
let suppressInputSave = false;

// ---------- Управление вкладками ----------
function generateTabName() {
  const names = tabs.map(t => t.name);
  let base = 'Новая вкладка';
  let idx = 1;
  while (names.includes(base + (idx > 1 ? ' ' + idx : ''))) idx++;
  return base + (idx > 1 ? ' ' + idx : '');
}

function createTab(name, content = '') {
  const id = ++tabIdCounter;
  return { id, name: name || generateTabName(), content, active: false };
}

function renderTabs() {
  // Сохраняем активный таб
  let activeId = tabs.find(t => t.active)?.id || null;
  // Удаляем все табы, кроме кнопки добавления
  const addBtn = tabsContainer.querySelector('.add-tab-btn');
  tabsContainer.innerHTML = '';
  tabsContainer.appendChild(addBtn);
  
  tabs.forEach(tab => {
    const div = document.createElement('div');
    div.className = 'tab' + (tab.id === activeId ? ' active' : '');
    div.dataset.id = tab.id;
    
    const label = document.createElement('span');
    label.className = 'tab-label';
    label.textContent = tab.name;
    div.appendChild(label);
    
    const close = document.createElement('button');
    close.className = 'close-tab';
    close.textContent = '×';
    close.title = 'Закрыть вкладку';
    close.addEventListener('click', (e) => {
      e.stopPropagation();
      closeTab(tab.id);
    });
    div.appendChild(close);
    
    div.addEventListener('click', () => switchTab(tab.id));
    tabsContainer.insertBefore(div, addBtn);
  });
  
  // Обновляем активный
  if (activeId) {
    const activeTab = tabs.find(t => t.id === activeId);
    if (activeTab) {
      activeTab.active = true;
      loadTabContent(activeTab);
    }
  } else if (tabs.length) {
    tabs[0].active = true;
    loadTabContent(tabs[0]);
  } else {
    // Создаём таб по умолчанию
    addNewTab();
  }
  saveTabs();
}

function loadTabContent(tab) {
  if (!tab) return;
  activeTabId = tab.id;
  textarea.value = tab.content || '';
  updateLineNumbers();
  activeLineNumber = null;
  highlightActiveLine();
  lastSearch = '';
  searchResults = [];
  currentResult = -1;
  // Сброс истории для текущего таба — храним отдельно в tab.history, но пока упростим
  history = [];
  redoStack = [];
  // Синхронизация
  syncScroll();
  // Прячем preview если активен
  if (previewFrame.classList.contains('active')) {
    previewFrame.classList.remove('active');
    previewFrame.style.display = 'none';
    editorContainer.classList.remove('hidden');
    editorContainer.style.display = 'flex';
  }
}

function switchTab(id) {
  if (isRestoring) return;
  // Сохраняем текущий контент
  const current = tabs.find(t => t.active);
  if (current) {
    current.content = textarea.value;
  }
  tabs.forEach(t => t.active = (t.id === id));
  const newTab = tabs.find(t => t.id === id);
  if (newTab) loadTabContent(newTab);
  renderTabs();
  saveTabs();
}

function closeTab(id) {
  if (tabs.length <= 1) {
    // Не даём закрыть последнюю вкладку
    return;
  }
  const idx = tabs.findIndex(t => t.id === id);
  if (idx === -1) return;
  const wasActive = tabs[idx].active;
  tabs.splice(idx, 1);
  if (wasActive) {
    // Активируем соседнюю
    const newActive = tabs[Math.min(idx, tabs.length - 1)];
    if (newActive) {
      newActive.active = true;
      loadTabContent(newActive);
    }
  }
  renderTabs();
  saveTabs();
}

function addNewTab() {
  const tab = createTab(generateTabName(), '');
  tabs.push(tab);
  // Деактивируем все, активируем новый
  tabs.forEach(t => t.active = (t.id === tab.id));
  loadTabContent(tab);
  renderTabs();
  saveTabs();
  // Фокус на редактор
  textarea.focus();
}

function renameTab(id, newName) {
  const tab = tabs.find(t => t.id === id);
  if (tab) {
    tab.name = newName || 'Без имени';
    renderTabs();
    saveTabs();
  }
}

// ---------- Сохранение / загрузка localStorage ----------
function saveTabs() {
  try {
    // Сохраняем текущий контент активного таба
    const active = tabs.find(t => t.active);
    if (active) {
      active.content = textarea.value;
    }
    const data = tabs.map(t => ({ id: t.id, name: t.name, content: t.content, active: t.active }));
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch(e) { console.warn('Save error', e); }
}

function loadTabs() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);
    if (!data || !data.length) return false;
    isRestoring = true;
    tabs = data.map(t => ({ ...t, active: t.active || false }));
    tabIdCounter = Math.max(0, ...tabs.map(t => t.id)) + 1;
    // Проверяем, есть ли активный
    if (!tabs.some(t => t.active)) {
      tabs[0].active = true;
    }
    renderTabs();
    const active = tabs.find(t => t.active);
    if (active) loadTabContent(active);
    isRestoring = false;
    return true;
  } catch(e) {
    console.warn('Load error', e);
    return false;
  }
}

// ---------- Обработчики редактора ----------
function onEditorInput() {
  if (isRestoring) return;
  // Сохраняем контент в активный таб
  const active = tabs.find(t => t.active);
  if (active) {
    active.content = textarea.value;
  }
  updateLineNumbers();
  saveTabs();
  // История
  saveState();
}

function updateLineNumbers() {
  const lines = textarea.value.split('\n').length;
  const total = lines + Math.ceil(lines * .5);
  lineNumbersDiv.innerHTML = '';
  for (let i = 1; i <= total; i++) {
    const d = document.createElement('div');
    d.textContent = i;
    lineNumbersDiv.appendChild(d);
  }
  syncScroll();
}

function syncScroll() {
  lineNumbersDiv.scrollTop = textarea.scrollTop;
}

function highlightActiveLine(line) {
  activeLineNumber = line !== undefined ? line : null;
  Array.from(lineNumbersDiv.children).forEach((el, i) => {
    el.classList.toggle('active-line', activeLineNumber !== null && i === activeLineNumber - 1);
  });
}

function goToLine() {
  const line = parseInt(document.getElementById('lineNumber').value);
  const lines = textarea.value.split('\n');
  if (!isNaN(line) && line > 0 && line <= lines.length) {
    const h = parseFloat(getComputedStyle(textarea).lineHeight);
    textarea.scrollTop = Math.max(0, (line - 1) * h - textarea.clientHeight / 2 + h / 2);
    highlightActiveLine(line);
  }
}

// ---------- Остальные функции (копирование, запуск, и т.д.) ----------
function copyText() {
  textarea.select();
  document.execCommand('copy');
  const btn = document.getElementById('copyButton');
  btn.classList.add('copied');
  btn.textContent = 'Скопировано';
  setTimeout(() => {
    btn.classList.remove('copied');
    btn.textContent = 'Скопировать 📃';
  }, 1000);
}

function clearAll() {
  const active = tabs.find(t => t.active);
  if (active) {
    active.content = '';
    textarea.value = '';
    updateLineNumbers();
    highlightActiveLine();
    saveTabs();
    saveState();
  }
}

function runCode() {
  const code = textarea.value;
  const url = URL.createObjectURL(new Blob([code], { type: 'text/html' }));
  if (lastPreviewUrl?.startsWith('blob:')) URL.revokeObjectURL(lastPreviewUrl);
  lastPreviewUrl = url;
  previewFrame.src = url;
  fullscreenFrame.src = url;
  previewFrame.style.display = 'block';
  previewFrame.classList.add('active');
  editorContainer.classList.add('hidden');
  editorContainer.style.display = 'none';
  window.scrollTo(0, 0);
}

function showEditor() {
  if (isFullscreen) forceExitFullscreen();
  previewFrame.classList.remove('active');
  previewFrame.style.display = 'none';
  previewFrame.src = 'about:blank';
  editorContainer.classList.remove('hidden');
  editorContainer.style.display = 'flex';
  updateLineNumbers();
  window.scrollTo(0, 0);
}

function shareCode() {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([textarea.value], { type: 'text/plain' }));
  a.download = 'code.html';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 100);
}

function saveState() {
  history.push(textarea.value);
  redoStack = [];
  if (history.length > 100) history.shift();
}

function undo() {
  if (history.length) {
    redoStack.push(textarea.value);
    textarea.value = history.pop();
    const active = tabs.find(t => t.active);
    if (active) active.content = textarea.value;
    updateLineNumbers();
    highlightActiveLine();
    saveTabs();
  }
}

function redo() {
  if (redoStack.length) {
    history.push(textarea.value);
    textarea.value = redoStack.pop();
    const active = tabs.find(t => t.active);
    if (active) active.content = textarea.value;
    updateLineNumbers();
    highlightActiveLine();
    saveTabs();
  }
}

// ---------- Поиск ----------
function findAll(term) {
  searchResults = [];
  currentResult = -1;
  if (!term) return;
  let i = textarea.value.indexOf(term);
  while (i !== -1) {
    searchResults.push(i);
    i = textarea.value.indexOf(term, i + term.length);
  }
}

function highlightMatch() {
  if (!searchResults.length) return;
  const pos = searchResults[currentResult];
  const term = document.getElementById('searchInput').value;
  textarea.focus();
  textarea.setSelectionRange(pos, pos + term.length);
  const h = parseFloat(getComputedStyle(textarea).lineHeight);
  const line = textarea.value.substring(0, pos).split('\n').length;
  textarea.scrollTop = Math.max(0, (line - 1) * h - textarea.clientHeight / 2);
}

function findNext() {
  const term = document.getElementById('searchInput').value;
  if (!term) return;
  if (term !== lastSearch) { findAll(term); lastSearch = term; }
  if (!searchResults.length) return;
  currentResult = (currentResult + 1) % searchResults.length;
  highlightMatch();
}

function findPrev() {
  const term = document.getElementById('searchInput').value;
  if (!term) return;
  if (term !== lastSearch) { findAll(term); lastSearch = term; }
  if (!searchResults.length) return;
  currentResult = (currentResult - 1 + searchResults.length) % searchResults.length;
  highlightMatch();
}

// ---------- Fullscreen ----------
function toggleFullscreen() {
  if (!previewFrame.classList.contains('active')) return;
  isFullscreen ? forceExitFullscreen() : enterFullscreenInternal();
}

function enterFullscreenInternal() {
  if (!previewFrame.classList.contains('active')) return;
  const code = textarea.value;
  const url = URL.createObjectURL(new Blob([code], { type: 'text/html' }));
  if (lastPreviewUrl?.startsWith('blob:')) URL.revokeObjectURL(lastPreviewUrl);
  lastPreviewUrl = url;
  fullscreenFrame.src = url;
  previewFrame.src = url;
  fullscreenOverlay.classList.add('active');
  isFullscreen = true;
  document.getElementById('fullscreenButton').textContent = '⛶✕';
  previewFrame.classList.remove('active');
  previewFrame.style.display = 'none';
  document.querySelector('.toolbar').style.display = 'none';
  editorContainer.style.display = 'none';
  if (fullscreenOverlay.requestFullscreen) fullscreenOverlay.requestFullscreen().catch(() => {});
  document.addEventListener('keydown', handleEscapeKey);
}

function forceExitFullscreen() {
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  fullscreenOverlay.classList.remove('active');
  isFullscreen = false;
  document.getElementById('fullscreenButton').textContent = '⛶';
  document.querySelector('.toolbar').style.display = 'flex';
  editorContainer.style.display = 'flex';
  editorContainer.classList.remove('hidden');
  previewFrame.classList.remove('active');
  previewFrame.style.display = 'none';
  previewFrame.src = 'about:blank';
  fullscreenFrame.src = 'about:blank';
  document.removeEventListener('keydown', handleEscapeKey);
  window.scrollTo(0, 0);
}

function handleEscapeKey(e) {
  if (e.key === 'Escape' && isFullscreen) forceExitFullscreen();
}

// ---------- Обработчик файлов ----------
function handleFileUpload(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    const content = e.target.result;
    // Создаём новую вкладку с именем файла
    const tab = createTab(file.name, content);
    tabs.push(tab);
    tabs.forEach(t => t.active = (t.id === tab.id));
    loadTabContent(tab);
    renderTabs();
    saveTabs();
    textarea.focus();
  };
  reader.readAsText(file, 'UTF-8');
  event.target.value = '';
}

// ---------- Fetch URL ----------
async function fetchWebsiteCode() {
  let url = document.getElementById('urlInput').value.trim();
  if (!url) return;
  if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
  const btn = document.getElementById('fetchButton');
  const old = btn.textContent;
  btn.textContent = '⏳';
  btn.classList.add('fetch-loading');
  btn.disabled = true;
  try {
    const r = await fetch(url);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const html = await r.text();
    if (!html) throw new Error('Пустой ответ');
    const tab = createTab(url.replace(/^https?:\/\//, '').slice(0, 30), html);
    tabs.push(tab);
    tabs.forEach(t => t.active = (t.id === tab.id));
    loadTabContent(tab);
    renderTabs();
    saveTabs();
  } catch(e) { console.error('Ошибка загрузки:', e); }
  finally {
    btn.textContent = old;
    btn.classList.remove('fetch-loading');
    btn.disabled = false;
  }
}

function clearUrlInput() {
  document.getElementById('urlInput').value = '';
  document.getElementById('urlInput').focus();
}

// ---------- Инициализация ----------
function init() {
  // Загружаем тему
  const t = localStorage.getItem('klikedit_theme');
  if (t) applyTheme(t);
  else applyTheme('dark');
  
  // Загружаем вкладки
  const loaded = loadTabs();
  if (!loaded) {
    // Создаём вкладку по умолчанию
    const tab = createTab('Новая вкладка', '');
    tabs = [tab];
    tab.active = true;
    renderTabs();
    loadTabContent(tab);
    saveTabs();
  }
  
  // События
  document.getElementById('themeSwitcher').addEventListener('change', (e) => applyTheme(e.target.value));
  document.getElementById('lineNumber').addEventListener('keydown', (e) => { if (e.key === 'Enter') goToLine(); });
  document.getElementById('urlInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') fetchWebsiteCode(); });
  document.getElementById('searchInput').addEventListener('input', () => { lastSearch = ''; searchResults = []; currentResult = -1; });
  document.getElementById('forceExitFullscreenBtn').addEventListener('click', (e) => {
    if (!e.target.closest('.drag-handle')) forceExitFullscreen();
  });
  
  // Перетаскивание кнопки выхода из fullscreen
  setupDrag();
  
  // Синхронизация
  updateLineNumbers();
  syncScroll();
  highlightActiveLine();
  window.addEventListener('pageshow', () => { updateLineNumbers(); syncScroll(); });
}

function applyTheme(themeName) {
  ['theme-dark','theme-light','theme-green','theme-ocean','theme-graphite'].forEach(c => document.body.classList.remove(c));
  document.body.classList.add('theme-' + themeName);
  localStorage.setItem('klikedit_theme', themeName);
  document.getElementById('themeSwitcher').value = themeName;
}

function setupDrag() {
  const btn = document.getElementById('forceExitFullscreenBtn');
  const handle = document.getElementById('dragHandle');
  let isDragging = false, startX, startY, startRight, startTop;
  const onStart = (e) => {
    const ev = e.touches ? e.touches[0] : e;
    isDragging = true;
    const rect = btn.getBoundingClientRect();
    startX = ev.clientX; startY = ev.clientY;
    startRight = window.innerWidth - rect.right;
    startTop = rect.top;
    btn.style.transition = 'none';
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onEnd);
    document.addEventListener('touchmove', onMove, { passive: false });
    document.addEventListener('touchend', onEnd, { passive: false });
    e.preventDefault && e.preventDefault();
  };
  const onMove = (e) => {
    if (!isDragging) return;
    const ev = e.touches ? e.touches[0] : e;
    const dx = ev.clientX - startX, dy = ev.clientY - startY;
    let newRight = startRight - dx, newTop = startTop + dy;
    newRight = Math.max(10, Math.min(window.innerWidth - btn.offsetWidth - 10, newRight));
    newTop = Math.max(10, Math.min(window.innerHeight - btn.offsetHeight - 10, newTop));
    btn.style.right = newRight + 'px';
    btn.style.top = newTop + 'px';
    btn.style.left = 'auto'; btn.style.bottom = 'auto';
    e.preventDefault && e.preventDefault();
  };
  const onEnd = () => {
    if (isDragging) {
      isDragging = false;
      btn.style.transition = '';
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onEnd);
      document.removeEventListener('touchmove', onMove);
      document.removeEventListener('touchend', onEnd);
    }
  };
  handle.addEventListener('mousedown', onStart);
  handle.addEventListener('touchstart', onStart, { passive: false });
}

// Запуск
init();

// Для QR (отправка кода)
async function sendCodeQR() {
  const code = textarea.value;
  try { await navigator.clipboard.writeText(code); } catch(e) { textarea.select(); document.execCommand('copy'); }
  window.location.href = 'https://2d3t.github.io/index.html/pro/Qr-Chanker.html';
}
